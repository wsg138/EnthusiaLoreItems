name: EnthusiaLoreItems
version: ${version}
main: net.enthusia.loreitems.plugin.LoreItemsPlugin
api-version: "1.21"
authors:
  - wsg138
description: Durable lore-item tracking and delivery for Enthusia SMP.
softdepend: [floodgate]
commands:
  loreitems:
    description: Opens and administers Enthusia lore items.
    usage: /loreitems create|adopt|give|reload|browse|anomalies|audit|recovery|remove|purge|delete|operations|targets|destructive-metrics|pause-operation|resume-operation|resolve-removal ...
  loreitemsreview:
    description: Resolves REVIEW_REQUIRED lore-item mutations after staff evidence review.
    usage: /loreitemsreview <mutation-uuid> <mutation-type> <retry|cancel> <evidence>
    permission: enthusia.loreitems.admin.recovery.review
  loredistribution:
    description: Validates, starts, inspects, and controls one-use lore-item distribution campaigns.
    usage: /loredistribution reload|inspect|preview|confirm|campaigns|status|recipients|pause|resume|cancel|reconcile ...
permissions:
  enthusia.loreitems.admin.create:
    description: Creates a lore definition from the held item.
    default: op
  enthusia.loreitems.admin.adopt:
    description: Adopts the held item into an existing lore definition.
    default: op
  enthusia.loreitems.admin.give:
    description: Queues a new lore-item instance for a player.
    default: op
  enthusia.loreitems.admin.reload:
    description: Reloads a complete validated LoreItems configuration snapshot without restarting.
    default: op
  enthusia.loreitems.admin.audit:
    description: Views active lore-item anomalies, audit evidence, recovery work, and template status.
    default: op
  enthusia.loreitems.admin.recovery.review:
    description: Resolves REVIEW_REQUIRED lore-item mutations using reviewed evidence.
    default: op
  enthusia.loreitems.admin.edit:
    description: Creates and confirms lore-item template revisions through the GUI/chat editor.
    default: op
  enthusia.loreitems.admin.remove:
    description: Previews and confirms exact lore-item instance removal.
    default: op
  enthusia.loreitems.admin.purge:
    description: Previews and confirms removal of all instances of a lore definition.
    default: op
  enthusia.loreitems.admin.delete:
    description: Previews and confirms full deletion of a lore definition and its instances.
    default: op
  enthusia.loreitems.admin.destructive.inspect:
    description: Inspects destructive operations, targets, and queue metrics.
    default: op
  enthusia.loreitems.admin.destructive.control:
    description: Pauses and resumes durable destructive operations.
    default: op
  enthusia.loreitems.admin.destructive.review:
    description: Resolves destructive targets that require evidence review.
    default: op
  enthusia.loreitems.admin.distribution.inspect:
    description: Reloads, validates, and inspects mass distribution sources and campaign status.
    default: op
  enthusia.loreitems.admin.distribution.start:
    description: Previews and explicitly confirms one-use mass distribution campaigns.
    default: op
  enthusia.loreitems.admin.distribution.control:
    description: Pauses, resumes, cancels, and reconciles mass distribution campaigns.
    default: op

name: Agent inspect Codacy annotations

on:
  push:
    branches:
      - agent/loreitems-pr2-creation-delivery-protection

permissions:
  checks: read
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/loreitems-pr2-creation-delivery-protection
      - name: Export Codacy check annotations for reviewed head
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 62dacb35a82b69502068d2e9f29c2752244d3c98
        shell: bash
        run: |
          set -euo pipefail
          checks="$(curl --fail --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${TARGET_SHA}/check-runs?per_page=100")"
          mapfile -t run_ids < <(jq -r '.check_runs[] | select((.app.slug | ascii_downcase | contains("codacy")) or (.name | ascii_downcase | contains("codacy"))) | .id' <<<"${checks}")
          if (( ${#run_ids[@]} == 0 )); then
            echo 'No Codacy check run found.' >&2
            exit 1
          fi
          : > .codacy-inspection.jsonl
          jq -c '.check_runs[] | select((.app.slug | ascii_downcase | contains("codacy")) or (.name | ascii_downcase | contains("codacy"))) | {type:"check",id,name,status,conclusion,app:.app.slug,details_url,output}' <<<"${checks}" >> .codacy-inspection.jsonl
          for run_id in "${run_ids[@]}"; do
            curl --fail --silent --show-error \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/check-runs/${run_id}/annotations?per_page=100" \
              | jq -c --argjson run_id "${run_id}" '.[] | {type:"annotation",run_id:$run_id,path,start_line,end_line,annotation_level,title,message,raw_details}' \
              >> .codacy-inspection.jsonl
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .codacy-inspection.jsonl
          git commit -m 'export Codacy annotations for inspection'
          git push origin HEAD:agent/loreitems-pr2-creation-delivery-protection

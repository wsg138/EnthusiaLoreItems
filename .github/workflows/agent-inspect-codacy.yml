name: Agent inspect Codacy

on:
  pull_request:

permissions:
  contents: read

jobs:
  inspect:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Export exact Codacy pull-request issues
        env:
          CODACY_API_TOKEN: ${{ secrets.CODACY_API_TOKEN }}
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p codacy-evidence
          endpoint="https://app.codacy.com/api/v3/analysis/organizations/gh/wsg138/repositories/EnthusiaLoreItems/pull-requests/3/issues?limit=100"
          status=000
          auth=none
          if [ -n "${CODACY_API_TOKEN:-}" ]; then
            auth=api-token
            status=$(curl --silent --show-error --output codacy-evidence/issues.json --write-out '%{http_code}' \
              --header "api-token: ${CODACY_API_TOKEN}" \
              --header 'Accept: application/json' \
              "$endpoint")
          elif [ -n "${CODACY_PROJECT_TOKEN:-}" ]; then
            auth=project-token
            status=$(curl --silent --show-error --output codacy-evidence/issues.json --write-out '%{http_code}' \
              --header "project-token: ${CODACY_PROJECT_TOKEN}" \
              --header 'Accept: application/json' \
              "$endpoint")
          else
            printf '{"error":"No Codacy API token secret is available to this workflow."}\n' > codacy-evidence/issues.json
          fi
          jq -n --arg authentication "$auth" --arg httpStatus "$status" \
            --arg queriedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{authentication: $authentication, httpStatus: $httpStatus, queriedAt: $queriedAt}' \
            > codacy-evidence/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: codacy-evidence
          path: codacy-evidence
          retention-days: 1
          if-no-files-found: error

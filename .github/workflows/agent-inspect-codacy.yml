name: Agent apply Codacy direct-delivery fixes

on:
  push:
    branches:
      - agent/loreitems-pr2-creation-delivery-protection

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/loreitems-pr2-creation-delivery-protection
          fetch-depth: 0
      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.14.3"
      - name: Apply focused Codacy fixes, verify, and publish
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              text = file_path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one match in {path}, found {count}: {old!r}")
              file_path.write_text(text.replace(old, new, 1))

          worker = "adapters-paper/src/main/java/net/enthusia/loreitems/paper/PaperDirectDeliveryWorker.java"
          replace_once(
              worker,
              """        switch (result.status()) {
                      case APPLIED -> complete(delivery, result);
                      case NO_SPACE -> defer(delivery);
                      case REVIEW_REQUIRED -> requireReview(delivery, result.detail(), null);
                  }
          """,
              """        switch (result.status()) {
                      case APPLIED -> complete(delivery, result);
                      case NO_SPACE -> defer(delivery);
                      case REVIEW_REQUIRED -> requireReview(delivery, result.detail(), null);
                      default -> requireReview(
                              delivery,
                              "Unsupported direct-delivery apply status: " + result.status(),
                              null);
                  }
          """)
          replace_once(worker, "            pollTask = null;\n", "")

          prepared = "application/src/main/java/net/enthusia/loreitems/application/PreparedDirectDelivery.java"
          replace_once(
              prepared,
              "    private static final long MIN_TIMESTAMP = 0L;\n",
              "    private static final long MIN_TIMESTAMP = 0L;\n"
              "    private static final int MIN_ATTEMPT_COUNT = 1;\n")
          replace_once(prepared, "        if (attemptCount < 1) {\n", "        if (attemptCount < MIN_ATTEMPT_COUNT) {\n")

          plugin = "plugin/src/main/java/net/enthusia/loreitems/plugin/LoreItemsPlugin.java"
          replace_once(plugin, "            directDeliveryWorker = null;\n", "")

          repository = Path("adapters-sqlite/src/main/java/net/enthusia/loreitems/sqlite/SQLiteDirectDeliveryRepository.java")
          text = repository.read_text()
          anchor = """    private static final String COMPLETED_STATE = "COMPLETED";
          """
          if text.count(anchor) != 1:
              raise SystemExit("SQLite constant anchor changed")
          text = text.replace(
              anchor,
              anchor
              + "    private static final String DELIVERY_ID_COLUMN = \"delivery_id\";\n"
              + "    private static final String INSTANCE_ID_COLUMN = \"instance_id\";\n"
              + "    private static final String PLAYER_ID_COLUMN = \"player_id\";\n",
              1)

          start_marker = "    private static int moveExpiredClaimsToReviewInTransaction("
          end_marker = "\n    private static boolean transitionDelivery("
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit("Expired-claim method markers changed")
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = """    private static int moveExpiredClaimsToReviewInTransaction(
                  Connection connection,
                  long now,
                  int limit) throws SQLException {
              List<ExpiredClaim> expired = listExpiredClaims(connection, now, limit);
              return moveExpiredClaimsToReview(connection, expired, now);
          }

          private static List<ExpiredClaim> listExpiredClaims(
                  Connection connection,
                  long now,
                  int limit) throws SQLException {
              List<ExpiredClaim> expired = new ArrayList<>();
              try (PreparedStatement statement = connection.prepareStatement(
                      "SELECT delivery_id, instance_id, player_id, state, claim_token "
                              + "FROM direct_deliveries WHERE state IN ('RESERVED', 'APPLIED', 'VERIFIED') "
                              + "AND claim_expires_at <= ? ORDER BY claim_expires_at, delivery_id LIMIT ?")) {
                  statement.setLong(1, now);
                  statement.setInt(2, limit);
                  try (ResultSet resultSet = statement.executeQuery()) {
                      while (resultSet.next()) {
                          expired.add(readExpiredClaim(resultSet));
                      }
                  }
              }
              return expired;
          }

          private static ExpiredClaim readExpiredClaim(ResultSet resultSet) throws SQLException {
              return new ExpiredClaim(
                      UUID.fromString(resultSet.getString(DELIVERY_ID_COLUMN)),
                      UUID.fromString(resultSet.getString(INSTANCE_ID_COLUMN)),
                      UUID.fromString(resultSet.getString(PLAYER_ID_COLUMN)),
                      resultSet.getString("state"),
                      resultSet.getString("claim_token"));
          }

          private static int moveExpiredClaimsToReview(
                  Connection connection,
                  List<ExpiredClaim> expired,
                  long now) throws SQLException {
              int updated = 0;
              try (PreparedStatement statement = connection.prepareStatement(
                      "UPDATE direct_deliveries SET state = 'REVIEW_REQUIRED', claim_token = NULL, "
                              + "claim_expires_at = NULL, updated_at = ? WHERE delivery_id = ? "
                              + "AND state = ? AND claim_token = ? AND claim_expires_at <= ?")) {
                  for (ExpiredClaim claim : expired) {
                      if (moveExpiredClaimToReview(statement, claim, now)) {
                          updated++;
                          recordExpiredClaimReview(connection, claim, now);
                      }
                  }
              }
              return updated;
          }

          private static boolean moveExpiredClaimToReview(
                  PreparedStatement statement,
                  ExpiredClaim claim,
                  long now) throws SQLException {
              statement.setLong(1, now);
              statement.setString(2, claim.deliveryId().toString());
              statement.setString(3, claim.state());
              statement.setString(4, claim.claimToken());
              statement.setLong(5, now);
              return statement.executeUpdate() == SINGLE_UPDATED_ROW;
          }

          private static void recordExpiredClaimReview(
                  Connection connection,
                  ExpiredClaim claim,
                  long now) throws SQLException {
              markQueuedCurrentStateUnresolved(
                      connection,
                      claim.instanceId(),
                      claim.deliveryId(),
                      claim.playerId(),
                      now);
              appendAudit(
                      connection,
                      claim.instanceId(),
                      REVIEW_EVENT,
                      claim.playerId().toString(),
                      reviewDetail(
                              claim.deliveryId(),
                              "The delivery claim expired before safe completion."),
                      now);
          }
          """
          text = text[:start] + replacement + text[end:]

          replacements = {
              'resultSet.getString("delivery_id")': 'resultSet.getString(DELIVERY_ID_COLUMN)',
              'resultSet.getString("instance_id")': 'resultSet.getString(INSTANCE_ID_COLUMN)',
              'resultSet.getString("player_id")': 'resultSet.getString(PLAYER_ID_COLUMN)',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 3:
                  raise SystemExit(f"Expected three remaining matches for {old}, found {count}")
              text = text.replace(old, new)
          repository.write_text(text)
          PY
          git rm .codacy-inspection.jsonl .github/workflows/agent-inspect-codacy.yml
          git diff --check
          gradle --no-daemon clean check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add adapters-paper application adapters-sqlite plugin
          git commit -m 'resolve direct-delivery Codacy findings'
          git push origin HEAD:agent/loreitems-pr2-creation-delivery-protection

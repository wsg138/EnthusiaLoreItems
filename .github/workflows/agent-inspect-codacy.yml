name: Agent inspect Codacy

on:
  pull_request:

permissions:
  contents: read
  checks: read

jobs:
  inspect:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_SHA: 50160ca5fee9b9a8642328b1ac9e2fc5aa63b039
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Export exact Codacy check annotations
        shell: python
        run: |
          import json
          import os
          import pathlib
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          target_sha = os.environ["TARGET_SHA"]
          token = os.environ["GH_TOKEN"]
          output = pathlib.Path("codacy-evidence")
          output.mkdir()
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "EnthusiaLoreItems-agent",
          }

          def read_json(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          base = f"https://api.github.com/repos/{repository}"
          checks = read_json(f"{base}/commits/{target_sha}/check-runs?per_page=100")
          (output / "check-runs.json").write_text(json.dumps(checks, indent=2))
          for check in checks.get("check_runs", []):
              app = (check.get("app") or {}).get("slug", "")
              name = check.get("name", "")
              if "codacy" not in f"{app} {name}".lower():
                  continue
              annotations = read_json(
                  f"{base}/check-runs/{check['id']}/annotations?per_page=100")
              (output / f"annotations-{check['id']}.json").write_text(
                  json.dumps(annotations, indent=2))
      - uses: actions/upload-artifact@v4
        with:
          name: codacy-evidence
          path: codacy-evidence
          retention-days: 1
          if-no-files-found: error

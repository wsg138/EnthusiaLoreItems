name: Agent diagnose Codacy fix transforms

on:
  push:
    branches:
      - agent/loreitems-pr2-creation-delivery-protection

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/loreitems-pr2-creation-delivery-protection
      - name: Export expected source-match counts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          files = {
              "worker": Path("adapters-paper/src/main/java/net/enthusia/loreitems/paper/PaperDirectDeliveryWorker.java").read_text(),
              "prepared": Path("application/src/main/java/net/enthusia/loreitems/application/PreparedDirectDelivery.java").read_text(),
              "plugin": Path("plugin/src/main/java/net/enthusia/loreitems/plugin/LoreItemsPlugin.java").read_text(),
              "sqlite": Path("adapters-sqlite/src/main/java/net/enthusia/loreitems/sqlite/SQLiteDirectDeliveryRepository.java").read_text(),
          }
          worker_switch = """        switch (result.status()) {
                      case APPLIED -> complete(delivery, result);
                      case NO_SPACE -> defer(delivery);
                      case REVIEW_REQUIRED -> requireReview(delivery, result.detail(), null);
                  }
          """
          diagnostics = {
              "worker_switch": files["worker"].count(worker_switch),
              "worker_poll_null": files["worker"].count("            pollTask = null;\n"),
              "prepared_constant": files["prepared"].count("    private static final long MIN_TIMESTAMP = 0L;\n"),
              "prepared_attempt_literal": files["prepared"].count("        if (attemptCount < 1) {\n"),
              "plugin_worker_null": files["plugin"].count("            directDeliveryWorker = null;\n"),
              "sqlite_constant_anchor": files["sqlite"].count("    private static final String COMPLETED_STATE = \"COMPLETED\";\n"),
              "sqlite_start_marker": files["sqlite"].count("    private static int moveExpiredClaimsToReviewInTransaction("),
              "sqlite_end_marker": files["sqlite"].count("\n    private static boolean transitionDelivery("),
              "sqlite_delivery_id_getters": files["sqlite"].count('resultSet.getString("delivery_id")'),
              "sqlite_instance_id_getters": files["sqlite"].count('resultSet.getString("instance_id")'),
              "sqlite_player_id_getters": files["sqlite"].count('resultSet.getString("player_id")'),
          }
          Path(".codacy-transform-diagnostics.json").write_text(json.dumps(diagnostics, indent=2) + "\n")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .codacy-transform-diagnostics.json
          git commit -m 'export Codacy transform diagnostics'
          git push origin HEAD:agent/loreitems-pr2-creation-delivery-protection

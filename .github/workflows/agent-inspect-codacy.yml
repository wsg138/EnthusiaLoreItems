name: Agent inspect Codacy

on:
  pull_request:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Export public Codacy PR issues
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p codacy-evidence
          endpoint="https://app.codacy.com/api/v3/analysis/organizations/gh/wsg138/repositories/EnthusiaLoreItems/pull-requests/3/issues?limit=100"
          status=$(curl --silent --show-error --output codacy-evidence/issues.json --write-out '%{http_code}' \
            --header 'Accept: application/json' \
            "$endpoint")
          jq -n --arg httpStatus "$status" --arg queriedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{httpStatus: $httpStatus, queriedAt: $queriedAt}' > codacy-evidence/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: codacy-evidence
          path: codacy-evidence
          retention-days: 1
          if-no-files-found: error

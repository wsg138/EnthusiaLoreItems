name: Apply protection Codacy fixes

on:
  push:
    branches:
      - agent/loreitems-pr2-creation-delivery-protection

permissions:
  contents: write

jobs:
  fix-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/loreitems-pr2-creation-delivery-protection
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.14.3'

      - name: Apply exact retrieved findings
        run: |
          python3 - <<'PY'
          from pathlib import Path

          listener = Path('adapters-paper/src/main/java/net/enthusia/loreitems/paper/PaperTrackedItemProtectionListener.java')
          text = listener.read_text(encoding='utf-8')
          replacements = [
              (
                  '    private static final int MAX_COMPLETION_ATTEMPTS = 3;\n',
                  '    private static final int MAX_COMPLETION_ATTEMPTS = 3;\n'
                  '    private static final int MIN_IN_FLIGHT = 1;\n'
              ),
              ('        if (maxInFlight < 1) {', '        if (maxInFlight < MIN_IN_FLIGHT) {'),
          ]
          for before, after in replacements:
              if text.count(before) != 1:
                  raise SystemExit(f'Expected one listener replacement for {before!r}, found {text.count(before)}')
              text = text.replace(before, after)
          listener.write_text(text, encoding='utf-8')

          store = Path('adapters-sqlite/src/main/java/net/enthusia/loreitems/sqlite/SQLiteVoidLossStore.java')
          text = store.read_text(encoding='utf-8')
          replacements = [
              (
                  'import java.util.Objects;\nimport java.util.UUID;\n',
                  'import java.util.Objects;\nimport java.util.OptionalLong;\nimport java.util.UUID;\n'
              ),
              (
                  '                || mutation.claimExpiresAt() == null\n'
                  '                || mutation.claimExpiresAt() <= completedAt) {',
                  '                || mutation.claimExpiresAt().isEmpty()\n'
                  '                || mutation.claimExpiresAt().getAsLong() <= completedAt) {'
              ),
              (
                  '                long expiry = resultSet.getLong("claim_expires_at");\n'
                  '                return new MutationRow(\n'
                  '                        resultSet.getString("state"),\n'
                  '                        resultSet.getString("claim_token"),\n'
                  '                        resultSet.wasNull() ? null : expiry);',
                  '                long expiry = resultSet.getLong("claim_expires_at");\n'
                  '                OptionalLong claimExpiresAt = resultSet.wasNull()\n'
                  '                        ? OptionalLong.empty()\n'
                  '                        : OptionalLong.of(expiry);\n'
                  '                return new MutationRow(\n'
                  '                        resultSet.getString("state"),\n'
                  '                        resultSet.getString("claim_token"),\n'
                  '                        claimExpiresAt);'
              ),
              (
                  '    private record MutationRow(\n'
                  '            String state,\n'
                  '            String claimToken,\n'
                  '            Long claimExpiresAt) {}',
                  '    private record MutationRow(\n'
                  '            String state,\n'
                  '            String claimToken,\n'
                  '            OptionalLong claimExpiresAt) {}'
              ),
          ]
          for before, after in replacements:
              if text.count(before) != 1:
                  raise SystemExit(f'Expected one store replacement for {before!r}, found {text.count(before)}')
              text = text.replace(before, after)
          store.write_text(text, encoding='utf-8')

          test = Path('adapters-paper/src/test/java/net/enthusia/loreitems/paper/PaperTrackedItemProtectionListenerTest.java')
          text = test.read_text(encoding='utf-8')
          before = '''        item.teleport(new Location(
                  item.getWorld(),
                  0.0,
                  item.getWorld().getMinHeight() - 1.0,
                  0.0));'''
          after = '''        assertTrue(item.teleport(new Location(
                  item.getWorld(),
                  0.0,
                  item.getWorld().getMinHeight() - 1.0,
                  0.0)));'''
          if text.count(before) != 1:
              raise SystemExit(f'Expected one teleport replacement, found {text.count(before)}')
          test.write_text(text.replace(before, after), encoding='utf-8')
          PY

          rm -f .github/workflows/codacy-protection-evidence.yml
          rm -f .github/workflows/protection-codacy-fixes.yml

      - name: Run full verification
        run: gradle --no-daemon clean check --rerun-tasks

      - name: Commit and push focused fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            adapters-paper/src/main/java/net/enthusia/loreitems/paper/PaperTrackedItemProtectionListener.java \
            adapters-sqlite/src/main/java/net/enthusia/loreitems/sqlite/SQLiteVoidLossStore.java \
            adapters-paper/src/test/java/net/enthusia/loreitems/paper/PaperTrackedItemProtectionListenerTest.java \
            .github/workflows/codacy-protection-evidence.yml \
            .github/workflows/protection-codacy-fixes.yml
          git diff --cached --check
          git commit -m 'resolve protection Codacy findings'
          git push origin HEAD:agent/loreitems-pr2-creation-delivery-protection

name: WP-05 Editor Contract Acceptance

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: wp05-editor-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  editor-contract:
    if: github.event.pull_request.number == 18
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PAPER_URL: https://fill-data.papermc.io/v1/objects/e708e8c132dc143ffd73528cccb9532e2eb17628b1a0eee74469bf466c7003f8/paper-1.21.11-116.jar
      PAPER_SHA256: e708e8c132dc143ffd73528cccb9532e2eb17628b1a0eee74469bf466c7003f8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.14.3"

      - name: Build exact head and prepare disposable Paper server
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :plugin:shadowJar :acceptance-harness:jar -PreleaseVersion=1.0.0-rc.1
          ROOT=/tmp/wp05-editor-contract
          mkdir -p "$ROOT/server/plugins/EnthusiaLoreItems" "$ROOT/evidence" "$ROOT/bot"
          PLUGIN_JAR="$(find plugin/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' | head -n1)"
          HARNESS_JAR="$(find acceptance-harness/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' | head -n1)"
          cp "$PLUGIN_JAR" "$ROOT/server/plugins/EnthusiaLoreItems.jar"
          cp "$HARNESS_JAR" "$ROOT/server/plugins/WP05AcceptanceHarness.jar"
          sha256sum "$PLUGIN_JAR" > "$ROOT/evidence/plugin-sha256.txt"
          sha256sum "$HARNESS_JAR" > "$ROOT/evidence/harness-sha256.txt"
          printf '%s\n' "${{ github.event.pull_request.head.sha || github.sha }}" > "$ROOT/evidence/source-head.txt"
          java -version 2> "$ROOT/evidence/java-version.txt"
          cat > "$ROOT/server/plugins/EnthusiaLoreItems/config.yml" <<'EOF'
          database-busy-timeout-millis: 500
          duplicate-warning-interval-seconds: 300
          mutation-budget-per-tick: 16
          EOF
          cp "$ROOT/server/plugins/EnthusiaLoreItems/config.yml" "$ROOT/evidence/loreitems-config.yml"
          cd "$ROOT/server"
          curl -fsSL "$PAPER_URL" -o paper.jar
          echo "$PAPER_SHA256  paper.jar" | sha256sum -c -
          printf 'eula=true\n' > eula.txt
          cat > server.properties <<'EOF'
          online-mode=false
          enforce-secure-profile=false
          spawn-protection=0
          white-list=false
          server-port=25565
          motd=WP05 editor contract acceptance
          EOF
          cd "$ROOT/bot"
          npm init -y >/dev/null
          npm install --save-exact mineflayer@4.35.0 >"$ROOT/evidence/npm-install.log" 2>&1
          npm list --depth=0 > "$ROOT/evidence/npm-list.txt"
          cat > bot.js <<'EOF'
          const mineflayer=require('mineflayer'), fs=require('fs')
          const root='/tmp/wp05-editor-contract'
          const bot=mineflayer.createBot({host:'127.0.0.1',port:25565,username:'Wp05EditorBot',version:'1.21.11',auth:'offline'})
          const log=x=>{fs.appendFileSync(`${root}/evidence/bot.log`,`${new Date().toISOString()} ${x}\n`);console.log(x)}
          const sleep=ms=>new Promise(r=>setTimeout(r,ms))
          function componentText(v){
            if(v==null)return ''
            if(typeof v==='string')return v
            if(typeof v.text==='string')return v.text+(Array.isArray(v.extra)?v.extra.map(componentText).join(''):'')
            if(typeof v.value==='string')return v.value
            if(Array.isArray(v.extra))return v.extra.map(componentText).join('')
            try{return JSON.stringify(v)}catch{return String(v)}
          }
          const title=()=>bot.currentWindow ? componentText(bot.currentWindow.title) : ''
          const waitWindow=async fragment=>{
            for(let i=0;i<160;i++){
              if(bot.currentWindow && title().toLowerCase().includes(fragment.toLowerCase())) return
              await sleep(100)
            }
            throw new Error(`window '${fragment}' not open; current=${title()}`)
          }
          const waitNoWindow=async()=>{for(let i=0;i<160;i++){if(!bot.currentWindow)return;await sleep(100)};throw new Error('window did not close')}
          const click=async slot=>{await bot.clickWindow(slot,0,0);await sleep(250)}
          async function openManagement(){
            bot.chat('/loreitems browse'); await waitWindow('Lore definitions'); await click(0); await waitWindow('Template management')
          }
          async function openEditor(){await openManagement();await click(29);await waitWindow('Template editor')}
          async function edit(slot,input){
            await click(slot);await waitNoWindow();bot.chat(`submit ${input}`);await waitWindow('Template editor');log(`EDIT_OK slot=${slot} input=${input}`)
          }
          async function cancelPreview(){
            await openEditor(); await edit(10,'literal Cancel Candidate'); await click(49); await waitWindow('Confirm template revision')
            log(`CANCEL_PREVIEW ${JSON.stringify(bot.currentWindow.slots[15]||null)}`); await click(33); await sleep(600)
          }
          async function invalidInput(){
            await openEditor(); await click(9); await waitNoWindow(); bot.chat('submit definitely:not_a_material'); await sleep(600)
            bot.chat('cancel'); await waitWindow('Template editor'); await click(45); await sleep(500); log('INVALID_REJECTED_AND_CANCELLED')
          }
          async function confirmMatrix(){
            await openEditor()
            await edit(9,'minecraft:netherite_sword')
            await edit(10,'solid #112233 Matrix Name')
            await edit(11,'gradient #ff0000,#0000ff Matrix Item')
            await edit(12,'add literal First line')
            await edit(12,'add gradient #ff0000,#0000ff Gradient line')
            await edit(12,'edit 1 solid #00ff00 Edited first')
            await edit(12,'move 2 1')
            await edit(12,'remove 1')
            await edit(13,'set minecraft:sharpness 7')
            await edit(13,'tooltip hidden')
            await edit(13,'tooltip visible')
            await edit(14,'true')
            await edit(15,'damage 15')
            await edit(15,'unbreakable true')
            await edit(16,'set minecraft:attack_damage enthusia:wp05_matrix add_number 4.5 mainhand')
            await edit(17,'enthusia:wp05_blade')
            await edit(18,'1')
            await edit(19,'floats 1.5,2.25')
            await edit(19,'flags true,false,true')
            await edit(19,'strings first|second_value')
            await edit(19,'colors #010203,#abcdef')
            await edit(27,'add hide_attributes')
            await edit(28,'hide true')
            await edit(28,'hide false')
            await edit(28,'style enthusia:wp05_style')
            await click(49);await waitWindow('Confirm template revision')
            log(`MATRIX_PREVIEW ${JSON.stringify(bot.currentWindow.slots[15]||null)}`)
            await click(31);await sleep(1800);log('MATRIX_CONFIRMED')
          }
          async function replaceHeld(cancel){
            await openManagement(); await click(31); await waitWindow('Confirm template revision')
            log(`${cancel?'REPLACE_CANCEL':'REPLACE_CONFIRM'}_PREVIEW ${JSON.stringify(bot.currentWindow.slots[15]||null)}`)
            await click(cancel?33:31); await sleep(cancel?600:1800)
          }
          bot.on('message',m=>log(`CHAT ${m.toString()}`))
          bot.on('error',e=>log(`ERROR ${e.stack||e}`));bot.on('kicked',r=>log(`KICKED ${String(r)}`))
          bot.once('spawn',async()=>{
            try{
              log(`SPAWN uuid=${bot.player.uuid} username=${bot.username}`);fs.writeFileSync(`${root}/bot.uuid`,`${bot.player.uuid}\n`)
              while(!fs.existsSync(`${root}/go-cancel`))await sleep(100);await cancelPreview();fs.writeFileSync(`${root}/done-cancel`,'ok\n')
              while(!fs.existsSync(`${root}/go-invalid`))await sleep(100);await invalidInput();fs.writeFileSync(`${root}/done-invalid`,'ok\n')
              while(!fs.existsSync(`${root}/go-matrix`))await sleep(100);await confirmMatrix();fs.writeFileSync(`${root}/done-matrix`,'ok\n')
              while(!fs.existsSync(`${root}/go-replace-cancel`))await sleep(100);await replaceHeld(true);fs.writeFileSync(`${root}/done-replace-cancel`,'ok\n')
              while(!fs.existsSync(`${root}/go-replace-confirm`))await sleep(100);await replaceHeld(false);fs.writeFileSync(`${root}/done-replace-confirm`,'ok\n')
              while(!fs.existsSync(`${root}/bot.stop`))await sleep(100);bot.quit('acceptance complete')
            }catch(e){log(`FATAL ${e.stack||e}`);fs.writeFileSync(`${root}/bot.failed`,String(e.stack||e));bot.quit('acceptance failed')}
          })
          EOF

      - name: Execute ACC-EDIT-001 and ACC-EDIT-002
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/wp05-editor-contract
          DB="$ROOT/server/plugins/EnthusiaLoreItems/loreitems.db"
          cd "$ROOT/server"
          rm -f server.stdin; mkfifo server.stdin; exec 3<>server.stdin
          java -Xms512M -Xmx1536M -Dpaper.disablePluginRemapping=true -jar paper.jar --nogui <server.stdin >"$ROOT/evidence/server.log" 2>&1 & SERVER_PID=$!
          cleanup(){
            touch "$ROOT/bot.stop" || true
            if [[ -n "${BOT_PID:-}" ]]; then wait "$BOT_PID" || true; fi
            if kill -0 "$SERVER_PID" 2>/dev/null; then echo stop >&3 || true; wait "$SERVER_PID" || true; fi
          }
          trap cleanup EXIT
          for _ in $(seq 1 180); do
            grep -q 'Queued direct-delivery processing is active.' "$ROOT/evidence/server.log" && grep -q 'WP-05 deterministic acceptance helper is active' "$ROOT/evidence/server.log" && break
            kill -0 "$SERVER_PID" 2>/dev/null || { cat "$ROOT/evidence/server.log"; exit 1; }; sleep 1
          done
          (cd "$ROOT/bot" && node bot.js) >"$ROOT/evidence/bot-stdout.log" 2>&1 & BOT_PID=$!
          for _ in $(seq 1 90); do test -s "$ROOT/bot.uuid" && break; sleep 1; done
          test -s "$ROOT/bot.uuid"
          echo 'op Wp05EditorBot' >&3
          echo 'wp05accept source Wp05EditorBot sword' >&3; sleep .5
          echo 'wp05accept perform Wp05EditorBot loreitems create acc_edit_contract Editor Contract' >&3
          python3 - "$DB" <<'PY'
          import sqlite3,sys,time
          db=sys.argv[1]
          for _ in range(120):
              try:
                  with sqlite3.connect(db) as c:
                      row=c.execute("select definition_id,current_revision from lore_definitions where lookup_key='acc_edit_contract' and deleted_at is null").fetchone()
                      if row and row[1]==1: break
              except sqlite3.Error: pass
              time.sleep(.25)
          else: raise SystemExit('definition creation did not converge')
          PY
          echo 'wp05accept perform Wp05EditorBot loreitems give acc_edit_contract' >&3
          python3 - "$DB" <<'PY'
          import sqlite3,sys,time
          db=sys.argv[1]
          for _ in range(180):
              with sqlite3.connect(db) as c:
                  did=c.execute("select definition_id from lore_definitions where lookup_key='acc_edit_contract'").fetchone()[0]
                  rows=c.execute("select instance_id,applied_revision,desired_revision,lifecycle_state from lore_instances where definition_id=?",(did,)).fetchall()
                  if len(rows)==1 and rows[0][1:]==(1,1,'ACTIVE'):
                      open('/tmp/wp05-editor-contract/evidence/original-instance.txt','w').write(str(rows[0][0])+'\n');break
              time.sleep(.25)
          else: raise SystemExit('initial online instance was not delivered')
          PY

          touch "$ROOT/go-cancel"; for _ in $(seq 1 160); do test -f "$ROOT/done-cancel" && break; test ! -f "$ROOT/bot.failed" || { cat "$ROOT/bot.failed"; exit 1; }; sleep .25; done; test -f "$ROOT/done-cancel"
          python3 - "$DB" <<'PY'
          import sqlite3,sys
          with sqlite3.connect(sys.argv[1]) as c:
              did,rev=c.execute("select definition_id,current_revision from lore_definitions where lookup_key='acc_edit_contract'").fetchone(); assert rev==1,rev
              assert c.execute('select count(*) from lore_definition_revisions where definition_id=?',(did,)).fetchone()[0]==1
          PY
          touch "$ROOT/go-invalid"; for _ in $(seq 1 160); do test -f "$ROOT/done-invalid" && break; test ! -f "$ROOT/bot.failed" || { cat "$ROOT/bot.failed"; exit 1; }; sleep .25; done; test -f "$ROOT/done-invalid"
          python3 - "$DB" <<'PY'
          import sqlite3,sys
          with sqlite3.connect(sys.argv[1]) as c:
              did,rev=c.execute("select definition_id,current_revision from lore_definitions where lookup_key='acc_edit_contract'").fetchone(); assert rev==1,rev
              assert c.execute('select count(*) from lore_definition_revisions where definition_id=?',(did,)).fetchone()[0]==1
          PY

          touch "$ROOT/go-matrix"; for _ in $(seq 1 360); do test -f "$ROOT/done-matrix" && break; test ! -f "$ROOT/bot.failed" || { cat "$ROOT/bot.failed"; exit 1; }; sleep .25; done; test -f "$ROOT/done-matrix"
          python3 - "$DB" <<'PY' | tee "$ROOT/evidence/case-results.txt"
          import sqlite3,sys,time
          db=sys.argv[1]
          for _ in range(240):
              with sqlite3.connect(db) as c:
                  did,rev=c.execute("select definition_id,current_revision from lore_definitions where lookup_key='acc_edit_contract'").fetchone()
                  rows=c.execute("select instance_id,applied_revision,desired_revision,lifecycle_state from lore_instances where definition_id=?",(did,)).fetchall()
                  pending=c.execute("select count(*) from pending_mutations where definition_id=? and mutation_type='TEMPLATE_UPDATE' and state not in ('COMPLETED','CANCELLED')",(did,)).fetchone()[0]
                  if rev==2 and len(rows)==1 and rows[0][1:]==(2,2,'ACTIVE') and pending==0:
                      original=open('/tmp/wp05-editor-contract/evidence/original-instance.txt').read().strip(); assert str(rows[0][0])==original; break
              time.sleep(.25)
          else: raise SystemExit('matrix revision did not roll out to online instance')
          print('PASS ACC-EDIT-001: supported GUI/chat field matrix, invalid input, preview cancel, confirmation, bounded rollout')
          PY
          grep -q 'EDIT_OK slot=9 input=minecraft:netherite_sword' "$ROOT/evidence/bot.log"
          grep -q 'EDIT_OK slot=10 input=solid #112233 Matrix Name' "$ROOT/evidence/bot.log"
          grep -q 'EDIT_OK slot=11 input=gradient #ff0000,#0000ff Matrix Item' "$ROOT/evidence/bot.log"
          grep -q 'EDIT_OK slot=12 input=edit 1 solid #00ff00 Edited first' "$ROOT/evidence/bot.log"
          grep -q 'EDIT_OK slot=13 input=set minecraft:sharpness 7' "$ROOT/evidence/bot.log"
          grep -q 'EDIT_OK slot=13 input=tooltip hidden' "$ROOT/evidence/bot.log"
          grep -q 'EDIT_OK slot=13 input=tooltip visible' "$ROOT/evidence/bot.log"
          grep -q 'EDIT_OK slot=14 input=true' "$ROOT/evidence/bot.log"
          grep -q 'EDIT_OK slot=15 input=damage 15' "$ROOT/evidence/bot.log"
          grep -q 'EDIT_OK slot=15 input=unbreakable true' "$ROOT/evidence/bot.log"
          grep -q 'EDIT_OK slot=16 input=set minecraft:attack_damage enthusia:wp05_matrix add_number 4.5 mainhand' "$ROOT/evidence/bot.log"
          grep -q 'EDIT_OK slot=17 input=enthusia:wp05_blade' "$ROOT/evidence/bot.log"
          grep -q 'EDIT_OK slot=18 input=1' "$ROOT/evidence/bot.log"
          grep -q 'EDIT_OK slot=19 input=colors #010203,#abcdef' "$ROOT/evidence/bot.log"
          grep -q 'EDIT_OK slot=27 input=add hide_attributes' "$ROOT/evidence/bot.log"
          grep -q 'EDIT_OK slot=28 input=style enthusia:wp05_style' "$ROOT/evidence/bot.log"
          grep -q 'INVALID_REJECTED_AND_CANCELLED' "$ROOT/evidence/bot.log"

          echo 'wp05accept source Wp05EditorBot uncommon' >&3; sleep .75
          echo 'data get entity Wp05EditorBot Inventory' >&3; sleep .5
          touch "$ROOT/go-replace-cancel"; for _ in $(seq 1 160); do test -f "$ROOT/done-replace-cancel" && break; test ! -f "$ROOT/bot.failed" || { cat "$ROOT/bot.failed"; exit 1; }; sleep .25; done; test -f "$ROOT/done-replace-cancel"
          python3 - "$DB" <<'PY'
          import sqlite3,sys
          with sqlite3.connect(sys.argv[1]) as c:
              did,rev=c.execute("select definition_id,current_revision from lore_definitions where lookup_key='acc_edit_contract'").fetchone(); assert rev==2,rev
              assert c.execute('select count(*) from lore_definition_revisions where definition_id=?',(did,)).fetchone()[0]==2
          PY
          touch "$ROOT/go-replace-confirm"; for _ in $(seq 1 240); do test -f "$ROOT/done-replace-confirm" && break; test ! -f "$ROOT/bot.failed" || { cat "$ROOT/bot.failed"; exit 1; }; sleep .25; done; test -f "$ROOT/done-replace-confirm"
          python3 - "$DB" <<'PY' | tee -a "$ROOT/evidence/case-results.txt"
          import sqlite3,sys,time
          db=sys.argv[1]
          for _ in range(240):
              with sqlite3.connect(db) as c:
                  did,rev=c.execute("select definition_id,current_revision from lore_definitions where lookup_key='acc_edit_contract'").fetchone()
                  rows=c.execute("select instance_id,applied_revision,desired_revision,lifecycle_state from lore_instances where definition_id=?",(did,)).fetchall()
                  pending=c.execute("select count(*) from pending_mutations where definition_id=? and mutation_type='TEMPLATE_UPDATE' and state not in ('COMPLETED','CANCELLED')",(did,)).fetchone()[0]
                  if rev==3 and len(rows)==1 and rows[0][1:]==(3,3,'ACTIVE') and pending==0:
                      original=open('/tmp/wp05-editor-contract/evidence/original-instance.txt').read().strip(); assert str(rows[0][0])==original; break
              time.sleep(.25)
          else: raise SystemExit('held replacement revision did not roll out')
          print('PASS ACC-EDIT-002: uncommon held template preview/cancel then exact-copy confirmation with identity preserved')
          PY
          echo 'data get entity Wp05EditorBot Inventory' >&3; sleep .75
          grep -q 'REPLACE_CANCEL_PREVIEW' "$ROOT/evidence/bot.log"
          grep -q 'REPLACE_CONFIRM_PREVIEW' "$ROOT/evidence/bot.log"
          grep -qi 'firework' "$ROOT/evidence/bot.log"
          grep -q 'WP05 Uncommon Source' "$ROOT/evidence/server.log"

          touch "$ROOT/bot.stop"; wait "$BOT_PID"; unset BOT_PID
          echo stop >&3; wait "$SERVER_PID"; exec 3>&-; rm -f server.stdin
          trap - EXIT

      - name: Verify restart durability and database integrity
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/wp05-editor-contract
          DB="$ROOT/server/plugins/EnthusiaLoreItems/loreitems.db"
          cd "$ROOT/server"
          rm -f server.stdin; mkfifo server.stdin; exec 3<>server.stdin
          java -Xms512M -Xmx1536M -Dpaper.disablePluginRemapping=true -jar paper.jar --nogui <server.stdin >"$ROOT/evidence/server-restart.log" 2>&1 & PID=$!
          trap 'echo stop >&3 || true; wait "$PID" || true' EXIT
          for _ in $(seq 1 180); do grep -q 'Queued direct-delivery processing is active.' "$ROOT/evidence/server-restart.log" && break; kill -0 "$PID" 2>/dev/null || { cat "$ROOT/evidence/server-restart.log"; exit 1; }; sleep 1; done
          python3 - "$DB" <<'PY'
          import sqlite3,sys
          db=sys.argv[1]
          with sqlite3.connect(db) as c:
              did,rev=c.execute("select definition_id,current_revision from lore_definitions where lookup_key='acc_edit_contract'").fetchone(); assert rev==3,rev
              rows=c.execute("select instance_id,applied_revision,desired_revision,lifecycle_state from lore_instances where definition_id=?",(did,)).fetchall(); assert len(rows)==1 and rows[0][1:]==(3,3,'ACTIVE'),rows
              assert c.execute('select count(*) from lore_definition_revisions where definition_id=?',(did,)).fetchone()[0]==3
              versions=[r[0] for r in c.execute('select version from schema_history order by version')]; assert versions==list(range(1,9)),versions
              assert c.execute('pragma integrity_check').fetchone()[0]=='ok'
              assert c.execute('pragma foreign_key_check').fetchall()==[]
          print('restart/integrity PASS')
          PY
          echo stop >&3; wait "$PID"; exec 3>&-; trap - EXIT

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wp05-editor-contract-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/wp05-editor-contract/evidence
          if-no-files-found: error
          retention-days: 30

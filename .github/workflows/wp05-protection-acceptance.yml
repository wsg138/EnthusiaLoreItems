name: WP-05 Protection Acceptance

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: wp05-protection-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  protection-contract:
    if: github.event.pull_request.number == 18
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PAPER_URL: https://fill-data.papermc.io/v1/objects/e708e8c132dc143ffd73528cccb9532e2eb17628b1a0eee74469bf466c7003f8/paper-1.21.11-116.jar
      PAPER_SHA256: e708e8c132dc143ffd73528cccb9532e2eb17628b1a0eee74469bf466c7003f8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.14.3"

      - name: Build exact PR head and prepare Paper protection fixture
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :plugin:shadowJar :acceptance-harness:jar -PreleaseVersion=1.0.0-rc.1
          ROOT=/tmp/wp05-protection
          mkdir -p "$ROOT/server/plugins/EnthusiaLoreItems" "$ROOT/evidence" "$ROOT/bot"
          PLUGIN_JAR="$(find plugin/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' | head -n1)"
          HARNESS_JAR="$(find acceptance-harness/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' | head -n1)"
          cp "$PLUGIN_JAR" "$ROOT/server/plugins/EnthusiaLoreItems.jar";cp "$HARNESS_JAR" "$ROOT/server/plugins/WP05AcceptanceHarness.jar"
          sha256sum "$PLUGIN_JAR">"$ROOT/evidence/plugin-sha256.txt";sha256sum "$HARNESS_JAR">"$ROOT/evidence/harness-sha256.txt"
          printf '%s\n' "${{ github.event.pull_request.head.sha || github.sha }}">"$ROOT/evidence/source-head.txt"
          java -version 2>"$ROOT/evidence/java-version.txt"
          cd "$ROOT/server";curl -fsSL "$PAPER_URL" -o paper.jar;echo "$PAPER_SHA256  paper.jar"|sha256sum -c -;printf 'eula=true\n'>eula.txt
          cat >server.properties <<'EOF'
          online-mode=false
          enforce-secure-profile=false
          spawn-protection=0
          white-list=false
          server-port=25565
          motd=WP05 protection acceptance
          EOF
          cd "$ROOT/bot";npm init -y >/dev/null;npm install --save-exact mineflayer@4.35.0 >"$ROOT/evidence/npm-install.log" 2>&1;npm list --depth=0>"$ROOT/evidence/npm-list.txt"
          cat >bot.js <<'EOF'
          const mineflayer=require('mineflayer'),fs=require('fs')
          const root='/tmp/wp05-protection',sleep=ms=>new Promise(r=>setTimeout(r,ms)),log=x=>{fs.appendFileSync(`${root}/evidence/bot.log`,`${new Date().toISOString()} ${x}\n`);console.log(x)}
          const bot=mineflayer.createBot({host:'127.0.0.1',port:25565,username:'Wp05Protect',version:'1.21.11',auth:'offline'})
          bot.on('message',m=>log(`CHAT ${m.toString()}`));bot.on('error',e=>log(`ERROR ${e.stack||e}`))
          function item(name){return bot.inventory.items().find(i=>i.name===name)}
          async function waitFile(p){for(let i=0;i<600;i++){if(fs.existsSync(p))return;await sleep(100)}throw new Error(`marker timeout ${p}`)}
          bot.once('spawn',async()=>{try{
            log(`SPAWN uuid=${bot.player.uuid}`);fs.writeFileSync(`${root}/bot.uuid`,`${bot.player.uuid}\n`);fs.writeFileSync(`${root}/bot.ready`,'ok\n')
            await waitFile(`${root}/attack.go`);let sword=item('diamond_sword');if(!sword)throw new Error('attack sword missing');await bot.equip(sword,'hand');await sleep(500);sword=item('diamond_sword');log(`DURABILITY_BEFORE ${sword?.durabilityUsed}`);let zombie=bot.nearestEntity(e=>e.name==='zombie');if(!zombie)throw new Error('attack zombie missing');bot.attack(zombie);await sleep(1500);sword=item('diamond_sword')||bot.heldItem;log(`DURABILITY_AFTER ${sword?.durabilityUsed}`);fs.writeFileSync(`${root}/attack.done`,`${sword?.durabilityUsed}\n`)
            await waitFile(`${root}/consume.go`);let food=item('cooked_beef');if(!food)throw new Error('tracked food missing');await bot.equip(food,'hand');let before=bot.inventory.items().filter(i=>i.name==='cooked_beef').reduce((n,i)=>n+i.count,0);log(`FOOD_BEFORE ${before}`);try{await Promise.race([bot.consume(),sleep(5000)])}catch(e){log(`CONSUME_RESULT ${e.message}`)}await sleep(1000);let after=bot.inventory.items().filter(i=>i.name==='cooked_beef').reduce((n,i)=>n+i.count,0);log(`FOOD_AFTER ${after}`);fs.writeFileSync(`${root}/consume.done`,`${before},${after}\n`)
            await waitFile(`${root}/exit.go`);bot.quit('done')
          }catch(e){log(`FAIL ${e.stack||e}`);fs.writeFileSync(`${root}/bot.failed`,String(e.stack||e));process.exit(1)}})
          EOF

      - name: Execute ACC-PROT-001 and ACC-PROT-002
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/wp05-protection;SERVER="$ROOT/server";DB="$SERVER/plugins/EnthusiaLoreItems/loreitems.db";E="$ROOT/evidence";LOG="$E/server.log";cd "$SERVER"
          rm -f server.stdin;mkfifo server.stdin;exec 3<>server.stdin;java -Xms512M -Xmx1536M -Dpaper.disablePluginRemapping=true -jar paper.jar --nogui <server.stdin >"$LOG" 2>&1 & SERVER_PID=$!
          for _ in $(seq 1 180);do if grep -q 'Queued direct-delivery processing is active.' "$LOG"&&grep -q 'WP-05 deterministic acceptance helper is active' "$LOG";then break;fi;kill -0 "$SERVER_PID" 2>/dev/null||{ cat "$LOG";exit 1;};sleep 1;done
          (cd "$ROOT/bot"&&node bot.js)>"$E/bot-stdout.log" 2>&1 & BOT_PID=$!;for _ in $(seq 1 60);do test -f "$ROOT/bot.ready"&&break;sleep 1;done;test -f "$ROOT/bot.ready"
          UUID="$(tr -d '\r\n'<"$ROOT/bot.uuid")";echo 'op Wp05Protect' >&3;echo 'tp Wp05Protect 0 71 0' >&3;echo 'setblock 2 70 0 minecraft:stone' >&3;sleep 2
          wait_sql(){ local q="$1" limit="${2:-90}";for _ in $(seq 1 "$limit");do if python3 - "$DB" "$q" <<'PY'
          import sqlite3,sys
          try:
              with sqlite3.connect(sys.argv[1]) as c:r=c.execute(sys.argv[2]).fetchone();raise SystemExit(0 if r and r[0] else 1)
          except sqlite3.OperationalError:raise SystemExit(1)
          PY
            then return 0;fi;sleep 1;done;echo "SQL timeout $q" >&2;return 1; }
          item_present(){ local marker="$1" before;before="$(grep -Fc "$marker" "$LOG"||true)";echo "execute positioned 2 71 0 if entity @e[type=item,tag=wp05-acceptance,distance=..4,limit=1] run say $marker" >&3;for _ in $(seq 1 30);do test "$(grep -Fc "$marker" "$LOG"||true)" -gt "$before"&&return 0;sleep 1;done;tail -n 120 "$LOG";return 1; }
          dump_expect(){ local n="$1" before;before="$(grep -Fc "WP05_ACCEPT DUMP ok player=Wp05Protect count=$n" "$LOG"||true)";echo 'wp05accept dump Wp05Protect' >&3;for _ in $(seq 1 40);do test "$(grep -Fc "WP05_ACCEPT DUMP ok player=Wp05Protect count=$n" "$LOG"||true)" -gt "$before"&&return 0;sleep 1;done;return 1; }
          START="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # One tracked dropped sword exercises fire, lava, cactus, explosion, despawn, and mob pickup.
          echo 'wp05accept source Wp05Protect sword' >&3;sleep 1;echo 'wp05accept perform Wp05Protect loreitems create acc_prot_sword Protection Sword' >&3
          wait_sql "select count(*)=1 from lore_definitions where lookup_key='acc_prot_sword' and deleted_at is null" 60
          DEF="$(python3 - "$DB" <<'PY'
          import sqlite3
          with sqlite3.connect('/tmp/wp05-protection/server/plugins/EnthusiaLoreItems/loreitems.db') as c:print(c.execute("select definition_id from lore_definitions where lookup_key='acc_prot_sword'").fetchone()[0])
          PY
          )"
          echo 'wp05accept perform Wp05Protect loreitems adopt acc_prot_sword' >&3;wait_sql "select count(*)=1 from lore_instances where definition_id='$DEF' and lifecycle_state='ACTIVE'" 60;dump_expect 1
          ENV_INSTANCE="$(python3 - "$DB" "$DEF" <<'PY'
          import sqlite3,sys
          with sqlite3.connect(sys.argv[1]) as c:print(c.execute('select instance_id from lore_instances where definition_id=?',(sys.argv[2],)).fetchone()[0])
          PY
          )"
          echo 'wp05accept place Wp05Protect drop' >&3;wait_sql "select count(*)=1 from instance_current_state where instance_id='$ENV_INSTANCE' and location_type='DROPPED_ENTITY'" 60;sleep 2;item_present WP05_PROT_BASELINE

          echo 'setblock 2 70 0 minecraft:netherrack' >&3;echo 'setblock 2 71 0 minecraft:fire' >&3;sleep 3;item_present WP05_PROT_FIRE;echo 'setblock 2 71 0 minecraft:air' >&3
          echo 'setblock 2 70 0 minecraft:stone' >&3;echo 'setblock 2 71 0 minecraft:lava' >&3;sleep 3;item_present WP05_PROT_LAVA;echo 'setblock 2 71 0 minecraft:air' >&3
          echo 'setblock 2 70 0 minecraft:sand' >&3;echo 'setblock 2 71 0 minecraft:cactus' >&3;sleep 3;item_present WP05_PROT_CACTUS;echo 'setblock 2 71 0 minecraft:air' >&3;echo 'setblock 2 70 0 minecraft:stone' >&3
          echo 'summon minecraft:tnt 2 72 0 {Fuse:0s}' >&3;sleep 3;item_present WP05_PROT_EXPLOSION
          echo 'data merge entity @e[type=item,tag=wp05-acceptance,sort=nearest,limit=1,x=2,y=71,z=0,distance=..4] {Age:5990s}' >&3;sleep 3;item_present WP05_PROT_DESPAWN
          echo 'summon minecraft:zombie 2 71 0 {NoAI:1b,Silent:1b,CanPickUpLoot:1b,PersistenceRequired:1b,Tags:["wp05-prot-zombie"]}' >&3;sleep 4;item_present WP05_PROT_MOB_PICKUP
          echo 'data get entity @e[type=zombie,tag=wp05-prot-zombie,limit=1] HandItems' >&3;sleep 1
          ! grep -F 'HandItems: [{id: "minecraft:diamond_sword"' "$LOG"
          echo 'kill @e[type=zombie,tag=wp05-prot-zombie]' >&3
          echo 'tp @e[type=item,tag=wp05-acceptance,sort=nearest,limit=1,x=2,y=71,z=0,distance=..4] 40 80 0' >&3

          # A real player attack at maxDurability-1 must not consume the final durability point.
          echo 'loreitems give acc_prot_sword Wp05Protect' >&3;wait_sql "select count(*)=2 from lore_instances where definition_id='$DEF' and lifecycle_state='ACTIVE'" 60;dump_expect 1
          echo 'wp05accept damage Wp05Protect' >&3;sleep 2;echo 'summon minecraft:zombie 1 71 0 {NoAI:1b,Silent:1b,PersistenceRequired:1b,Tags:["wp05-attack-zombie"]}' >&3;touch "$ROOT/attack.go"
          for _ in $(seq 1 80);do test -s "$ROOT/attack.done"&&break;sleep 1;done;test -s "$ROOT/attack.done"
          BEFORE_DAMAGE="$(grep -F 'DURABILITY_BEFORE ' "$E/bot.log"|tail -n1|awk '{print $NF}')";AFTER_DAMAGE="$(grep -F 'DURABILITY_AFTER ' "$E/bot.log"|tail -n1|awk '{print $NF}')";test "$BEFORE_DAMAGE" = "$AFTER_DAMAGE";echo 'kill @e[type=zombie,tag=wp05-attack-zombie]' >&3

          # Tracked consumable use must be cancelled without consuming or duplicating the item.
          echo 'wp05accept source Wp05Protect food' >&3;sleep 1;echo 'wp05accept perform Wp05Protect loreitems create acc_prot_food Protection Food' >&3;wait_sql "select count(*)=1 from lore_definitions where lookup_key='acc_prot_food'" 60
          FOOD_DEF="$(python3 - "$DB" <<'PY'
          import sqlite3
          with sqlite3.connect('/tmp/wp05-protection/server/plugins/EnthusiaLoreItems/loreitems.db') as c:print(c.execute("select definition_id from lore_definitions where lookup_key='acc_prot_food'").fetchone()[0])
          PY
          )";echo 'wp05accept perform Wp05Protect loreitems adopt acc_prot_food' >&3;wait_sql "select count(*)=1 from lore_instances where definition_id='$FOOD_DEF' and lifecycle_state='ACTIVE'" 60
          echo 'effect give Wp05Protect minecraft:hunger 6 20 true' >&3;sleep 6;touch "$ROOT/consume.go";for _ in $(seq 1 90);do test -s "$ROOT/consume.done"&&break;sleep 1;done;test -s "$ROOT/consume.done"
          IFS=, read -r FOOD_BEFORE FOOD_AFTER <"$ROOT/consume.done";test "$FOOD_BEFORE" -ge 1;test "$FOOD_AFTER" = "$FOOD_BEFORE";wait_sql "select count(*)=1 from lore_instances where definition_id='$FOOD_DEF' and lifecycle_state='ACTIVE'" 30

          # Separate tracked instance intentionally enters the void and must terminalize durably.
          echo 'loreitems give acc_prot_sword Wp05Protect' >&3;wait_sql "select count(*)=3 from lore_instances where definition_id='$DEF'" 60
          VOID_INSTANCE="$(python3 - "$DB" "$DEF" <<'PY'
          import sqlite3,sys
          with sqlite3.connect(sys.argv[1]) as c:
              rows=c.execute("select i.instance_id from lore_instances i join instance_current_state s on s.instance_id=i.instance_id where i.definition_id=? and i.lifecycle_state='ACTIVE' and s.location_type='PLAYER_INVENTORY' order by i.created_at desc",(sys.argv[2],)).fetchall();assert rows,rows;print(rows[0][0])
          PY
          )"
          echo 'wp05accept place Wp05Protect drop' >&3;wait_sql "select count(*)=1 from instance_current_state where instance_id='$VOID_INSTANCE' and location_type='DROPPED_ENTITY'" 60;sleep 1
          echo 'tp @e[type=item,tag=wp05-acceptance,sort=nearest,limit=1,x=2,y=71,z=0,distance=..4] 2 -100 0' >&3
          wait_sql "select count(*)=1 from lore_instances where instance_id='$VOID_INSTANCE' and lifecycle_state='VOID_DESTROYED' and terminal_at is not null" 120
          wait_sql "select count(*)=1 from instance_current_state where instance_id='$VOID_INSTANCE' and state='TERMINAL_VOID' and location_type='TERMINAL_VOID'" 60
          wait_sql "select count(*)>=1 from pending_mutations where instance_id='$VOID_INSTANCE' and mutation_type='VOID_TERMINAL_LOSS' and state='COMPLETED'" 60
          wait_sql "select count(*)>=1 from audit_events where aggregate_id='$VOID_INSTANCE' and event_type='void_loss_completed'" 60
          touch "$ROOT/exit.go";for _ in $(seq 1 30);do kill -0 "$BOT_PID" 2>/dev/null||break;sleep 1;done;kill "$BOT_PID" 2>/dev/null||true;wait "$BOT_PID" 2>/dev/null||true
          echo stop >&3;wait "$SERVER_PID";exec 3>&-;rm -f server.stdin
          END="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          python3 - "$DB" "$START" "$END" "$ENV_INSTANCE" "$VOID_INSTANCE" "$BEFORE_DAMAGE" "$AFTER_DAMAGE" "$FOOD_BEFORE" "$FOOD_AFTER" <<'PY' | tee "$E/result.json"
          import json,sqlite3,sys
          db,start,end,env,void,before_damage,after_damage,food_before,food_after=sys.argv[1:]
          with sqlite3.connect(db) as c:
              c.row_factory=sqlite3.Row;integrity=c.execute('pragma integrity_check').fetchone()[0];foreign=[list(r) for r in c.execute('pragma foreign_key_check')];assert integrity=='ok' and not foreign
              env_state=dict(c.execute('select lifecycle_state from lore_instances where instance_id=?',(env,)).fetchone());void_state=dict(c.execute('select lifecycle_state,terminal_at from lore_instances where instance_id=?',(void,)).fetchone());assert env_state['lifecycle_state']=='ACTIVE';assert void_state['lifecycle_state']=='VOID_DESTROYED' and void_state['terminal_at'] is not None
              void_audit=[r[0] for r in c.execute('select event_type from audit_events where aggregate_id=? order by audit_id',(void,))];assert 'void_loss_completed' in void_audit
          print(json.dumps({'cases':{'ACC-PROT-001':'PASS','ACC-PROT-002':'PASS'},'source_head':open('/tmp/wp05-protection/evidence/source-head.txt').read().strip(),'started_at':start,'finished_at':end,'environment_instance':env,'environment_exposures':['fire','lava','cactus','explosion','accelerated-natural-despawn','ordinary-mob-pickup'],'durability_used_before':before_damage,'durability_used_after':after_damage,'food_count_before':food_before,'food_count_after':food_after,'void_instance':void,'void_state':void_state,'void_audit':void_audit,'integrity':integrity,'foreign_key_violations':foreign},indent=2,sort_keys=True))
          PY

      - name: Collect failure diagnostics
        if: failure()
        shell: bash
        run: |
          ROOT=/tmp/wp05-protection;DB="$ROOT/server/plugins/EnthusiaLoreItems/loreitems.db";mkdir -p "$ROOT/evidence"
          if test -f "$DB";then python3 - "$DB" >"$ROOT/evidence/failure-db.txt" 2>&1 <<'PY' || true
          import sqlite3,sys
          c=sqlite3.connect(sys.argv[1]);c.row_factory=sqlite3.Row
          for t in ('lore_definitions','lore_instances','instance_current_state','pending_mutations','audit_events'):
              print('##',t)
              try:
                  for r in c.execute(f'select * from {t}'):print(dict(r))
              except Exception as e:print(type(e).__name__,e)
          print('integrity',list(c.execute('pragma integrity_check')));print('foreign',list(c.execute('pragma foreign_key_check')))
          PY
          fi
          ps aux >"$ROOT/evidence/failure-processes.txt" 2>&1||true

      - name: Upload protection evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wp05-protection-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/wp05-protection/evidence
          if-no-files-found: error
          retention-days: 30

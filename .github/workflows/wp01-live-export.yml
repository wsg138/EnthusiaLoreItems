name: WP-01 live export

on:
  push:
    branches:
      - agent/wp-01-editor-template-management

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Package exact source
        run: tar --exclude=.git -czf "$RUNNER_TEMP/wp01-live-source.tgz" .
      - uses: actions/upload-artifact@v4
        with:
          name: wp01-live-source
          path: ${{ runner.temp }}/wp01-live-source.tgz
          if-no-files-found: error
          retention-days: 1

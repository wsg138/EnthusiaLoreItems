name: Apply WP-01 Codacy remediation v2

on:
  push:
    branches:
      - agent/wp-01-editor-template-management

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: "8.14.3"
      - name: Apply resilient Codacy patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          workflow = Path('.github/workflows/wp01-codacy-remediation.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          body = workflow.split(marker, 1)[1].split('\n          PY', 1)[0]
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in body.splitlines())
          start = script.index("specialized = Path(base + 'PaperTemplateSpecializedEditor.java')")
          end = script.index(
              "annotate_class(\n    tests + 'PaperEntityTemplateUpdateScannerTest.java'",
              start)
          Path('/tmp/wp01-codacy.py').write_text(script[:start] + script[end:])
          subprocess.run(['python3', '/tmp/wp01-codacy.py'], check=True)

          specialized = Path(
              'adapters-paper/src/main/java/net/enthusia/loreitems/paper/'
              'PaperTemplateSpecializedEditor.java')
          source = specialized.read_text()
          source = source.replace(
              '            default -> null;',
              '            default -> throw new IllegalArgumentException('
              '"Unsupported editor action");',
              1)
          result_start = source.index('            return detail == null')
          catch_start = source.index('        } catch (IllegalArgumentException exception) {', result_start)
          accepted = '''            return PaperTemplateEditResult.accepted(
                      PaperTemplateEditorSupport.normalized(item), detail);
          '''
          specialized.write_text(source[:result_start] + accepted + source[catch_start:])
          PY
      - name: Run full verification
        run: gradle --no-daemon clean check
      - name: Commit verified remediation
        shell: bash
        run: |
          rm -f .github/workflows/wp01-codacy-remediation.yml
          rm -f .github/workflows/wp01-codacy-remediation-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No Codacy remediation changes to commit.'
            exit 0
          fi
          git commit -m 'fix: remediate WP-01 Codacy findings'
          git push origin HEAD:agent/wp-01-editor-template-management

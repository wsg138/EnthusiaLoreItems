name: Apply final WP-01 Codacy fixes

on:
  push:
    branches:
      - agent/wp-01-editor-template-management

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: "8.14.3"
      - name: Apply resilient deterministic source changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          previous = subprocess.run(
              ['git', 'show', 'HEAD^:.github/workflows/wp01-final-codacy.yml'],
              check=True,
              capture_output=True,
              text=True).stdout
          marker = "          python3 - <<'PY'\n"
          body = previous.split(marker, 1)[1].split('\n          PY', 1)[0]
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in body.splitlines())
          loader_start = script.index("loader = 'adapters-paper/src/main/java/net/enthusia/loreitems/paper/PaperTemplateManagementLoader.java'")
          loader_end = script.index("planner_test = 'adapters-paper/src/test/java/net/enthusia/loreitems/paper/PaperTemplateRevisionPlannerWorkerTest.java'", loader_start)
          Path('/tmp/wp01-final.py').write_text(script[:loader_start] + script[loader_end:])
          subprocess.run(['python3', '/tmp/wp01-final.py'], check=True)

          loader = Path(
              'adapters-paper/src/main/java/net/enthusia/loreitems/paper/'
              'PaperTemplateManagementLoader.java')
          source = loader.read_text()

          def one(old, new):
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'loader expected one match, found {count}: {old!r}')
              source = source.replace(old, new, 1)

          one(
              '    private static final int MAX_QUERIES = 32;\n'
              '    private static final long QUERY_TIMEOUT_SECONDS = 10L;',
              '    private static final int MAX_QUERIES = 32;\n'
              '    private static final int MINIMUM_QUERY_CAPACITY = 1;\n'
              '    private static final long QUERY_TIMEOUT_SECONDS = 10L;\n'
              '    private static final long MINIMUM_QUERY_TIMEOUT = 1L;')
          one('if (maximumQueries < 1)',
              'if (maximumQueries < MINIMUM_QUERY_CAPACITY)')
          one('if (queryTimeout < 1L)',
              'if (queryTimeout < MINIMUM_QUERY_TIMEOUT)')
          one(
              'stage.thenApply(snapshot -> snapshot)\n'
              '                .toCompletableFuture()',
              'stage.toCompletableFuture()\n'
              '                .copy()')
          loader.write_text(source)
          PY
      - name: Run full verification
        run: gradle --no-daemon clean check
      - name: Commit verified fixes
        shell: bash
        run: |
          rm -f .github/workflows/wp01-final-codacy.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No final Codacy changes to commit.'
            exit 0
          fi
          git commit -m 'fix: clear remaining WP-01 analysis findings'
          git push origin HEAD:agent/wp-01-editor-template-management

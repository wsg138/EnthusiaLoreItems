name: WP-05 Conversion Protection Acceptance

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: wp05-conversion-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  conversion-protection:
    if: github.event.pull_request.number == 18
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PAPER_URL: https://fill-data.papermc.io/v1/objects/e708e8c132dc143ffd73528cccb9532e2eb17628b1a0eee74469bf466c7003f8/paper-1.21.11-116.jar
      PAPER_SHA256: e708e8c132dc143ffd73528cccb9532e2eb17628b1a0eee74469bf466c7003f8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: "8.14.3"
      - name: Prepare exact-head Paper conversion fixture
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :plugin:shadowJar :acceptance-harness:jar -PreleaseVersion=1.0.0-rc.1
          R=/tmp/wp05-convert;mkdir -p "$R/server/plugins" "$R/evidence" "$R/bot";P="$(find plugin/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*'|head -n1)";H="$(find acceptance-harness/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*'|head -n1)";cp "$P" "$R/server/plugins/EnthusiaLoreItems.jar";cp "$H" "$R/server/plugins/WP05AcceptanceHarness.jar";sha256sum "$P">"$R/evidence/plugin-sha256.txt";printf '%s\n' "${{ github.event.pull_request.head.sha || github.sha }}">"$R/evidence/source-head.txt"
          cd "$R/server";curl -fsSL "$PAPER_URL" -o paper.jar;echo "$PAPER_SHA256  paper.jar"|sha256sum -c -;printf 'eula=true\n'>eula.txt;cat >server.properties <<'EOF'
          online-mode=false
          enforce-secure-profile=false
          spawn-protection=0
          white-list=false
          server-port=25565
          motd=WP05 conversion protection
          EOF
          cd "$R/bot";npm init -y >/dev/null;npm install --save-exact mineflayer@4.35.0 >"$R/evidence/npm.log" 2>&1;cat >bot.js <<'EOF'
          const m=require('mineflayer'),fs=require('fs'),Vec3=require('vec3').Vec3,r='/tmp/wp05-convert',name=process.argv[2],mode=process.argv[3],s=ms=>new Promise(x=>setTimeout(x,ms));const q=name.toLowerCase(),b=m.createBot({host:'127.0.0.1',port:25565,username:name,version:'1.21.11',auth:'offline'}),log=x=>{fs.appendFileSync(`${r}/evidence/${q}.log`,`${new Date().toISOString()} ${x}\n`);console.log(x)}
          async function file(p){for(let i=0;i<900;i++){if(fs.existsSync(p))return;await s(100)}throw Error(`marker ${p}`)}async function openAt(x){await b.waitForChunksToLoad();let block;for(let i=0;i<100;i++){block=b.blockAt(new Vec3(x,70,0));if(block)break;await s(100)}if(!block)throw Error('block missing');await b.activateBlock(block);for(let i=0;i<160;i++){if(b.currentWindow)return;await s(100)}throw Error(`window not open ${block.name}`)}function empty(){const w=b.currentWindow,start=Number.isInteger(w.inventoryStart)?w.inventoryStart:Math.max(0,w.slots.length-36),end=Number.isInteger(w.inventoryEnd)?w.inventoryEnd:w.slots.length;for(let i=start;i<end;i++)if(!w.slots[i])return i;throw Error('no empty inventory slot')}async function move(from,to,button=0){await b.clickWindow(from,button,0);await s(250);await b.clickWindow(to,button,0);await s(350)}async function takeInput(slot){if(!b.currentWindow.slots[slot])throw Error(`tracked input missing at ${slot}`);await b.clickWindow(slot,0,0);await s(200);await b.clickWindow(empty(),0,0);await s(500)}
          async function craft(){await openAt(1);let w=b.currentWindow,inv=w.slots.map((i,n)=>[i,n]).filter(([i])=>i&&i.name==='oak_planks');let tracked=inv.find(([i])=>i.count===1),normal=inv.find(([i])=>i.count>=2);if(!tracked||!normal)throw Error(`planks fixture ${JSON.stringify(inv.map(x=>[x[0].count,x[1]]))}`);await move(tracked[1],1);await b.clickWindow(normal[1],0,0);await s(200);await b.clickWindow(4,1,0);await s(200);await b.clickWindow(normal[1],0,0);await s(500);log(`CRAFT_RESULT ${JSON.stringify(w.slots[0]||null)}`);await b.clickWindow(0,0,0);await s(700);if(!w.slots[1]||w.slots[1].name!=='oak_planks')throw Error('craft consumed tracked input');await takeInput(1);b.closeWindow(w)}
          async function smelt(){await openAt(3);let w=b.currentWindow,raw=w.slots.findIndex(i=>i&&i.name==='raw_iron'),coal=w.slots.findIndex(i=>i&&i.name==='coal');if(raw<0||coal<0)throw Error('furnace fixture missing');await move(raw,0);await move(coal,1);await s(12000);log(`SMELT_OUTPUT ${JSON.stringify(w.slots[2]||null)}`);if(w.slots[2]){await b.clickWindow(2,0,0);await s(700)}if(!w.slots[0]||w.slots[0].name!=='raw_iron')throw Error('smelt consumed tracked input');await takeInput(0);b.closeWindow(w)}
          async function grind(){await openAt(5);let w=b.currentWindow,slot=w.slots.findIndex(i=>i&&i.name==='diamond_sword');if(slot<0)throw Error('grind sword missing');await move(slot,0);await s(600);log(`GRIND_RESULT ${JSON.stringify(w.slots[2]||null)}`);if(w.slots[2]){await b.clickWindow(2,0,0);await s(700)}if(!w.slots[0]||w.slots[0].name!=='diamond_sword')throw Error('grind consumed tracked input');await takeInput(0);b.closeWindow(w)}
          async function smith(){await openAt(7);let w=b.currentWindow,t=w.slots.findIndex(i=>i&&i.name==='netherite_upgrade_smithing_template'),d=w.slots.findIndex(i=>i&&i.name==='diamond_sword'),n=w.slots.findIndex(i=>i&&i.name==='netherite_ingot');if(t<0||d<0||n<0)throw Error('smith fixture missing');await move(t,0);d=w.slots.findIndex(i=>i&&i.name==='diamond_sword');await move(d,1);n=w.slots.findIndex(i=>i&&i.name==='netherite_ingot');await move(n,2);await s(600);log(`SMITH_RESULT ${JSON.stringify(w.slots[3]||null)}`);if(w.slots[3]){await b.clickWindow(3,0,0);await s(700)}if(!w.slots[1]||w.slots[1].name!=='diamond_sword')throw Error('smith consumed tracked base');await takeInput(1);b.closeWindow(w)}
          b.on('error',e=>log(`ERROR ${e.stack||e}`));b.once('spawn',async()=>{try{fs.writeFileSync(`${r}/${q}.ready`,'ok\n');await file(`${r}/${q}.go`);if(mode==='craft')await craft();else if(mode==='smelt')await smelt();else if(mode==='grind')await grind();else if(mode==='smith')await smith();else throw Error(mode);fs.writeFileSync(`${r}/${q}.done`,'ok\n');while(!fs.existsSync(`${r}/${q}.stop`))await s(100);b.quit('done')}catch(e){log(`FATAL ${e.stack||e}`);fs.writeFileSync(`${r}/${q}.failed`,String(e.stack||e));process.exit(1)}})
          EOF
      - name: Execute crafting, smelting, grinding, and smithing attempts
        shell: bash
        run: |
          set -euo pipefail
          R=/tmp/wp05-convert;S="$R/server";E="$R/evidence";DB="$S/plugins/EnthusiaLoreItems/loreitems.db";L="$E/server.log";cd "$S";rm -f server.stdin;mkfifo server.stdin;exec 3<>server.stdin;java -Xms512M -Xmx1536M -Dpaper.disablePluginRemapping=true -jar paper.jar --nogui <server.stdin >"$L" 2>&1 & SP=$!;for _ in $(seq 1 180);do grep -q 'WP-05 deterministic acceptance helper is active' "$L"&&break;sleep 1;done;grep -q 'WP-05 deterministic acceptance helper is active' "$L"
          start(){ local n="$1" m="$2" q;q="$(printf '%s' "$n"|tr '[:upper:]' '[:lower:]')";(cd "$R/bot"&&node bot.js "$n" "$m")>"$E/$q-stdout.log" 2>&1 & echo $!>"$R/$q.pid";for _ in $(seq 1 60);do test -f "$R/$q.ready"&&return;sleep 1;done;return 1;};finish(){ local n="$1" q p;q="$(printf '%s' "$n"|tr '[:upper:]' '[:lower:]')";for _ in $(seq 1 180);do test -f "$R/$q.failed"&&{ cat "$R/$q.failed";return 1;};test -f "$R/$q.done"&&break;sleep 1;done;test -f "$R/$q.done";B="$(grep -Fc "WP05_ACCEPT DUMP ok player=$n count=1" "$L"||true)";echo "wp05accept dump $n" >&3;for _ in $(seq 1 40);do test "$(grep -Fc "WP05_ACCEPT DUMP ok player=$n count=1" "$L"||true)" -gt "$B"&&break;sleep 1;done;test "$(grep -Fc "WP05_ACCEPT DUMP ok player=$n count=1" "$L"||true)" -gt "$B";touch "$R/$q.stop";p="$(cat "$R/$q.pid")";wait "$p";}
          wait_def(){ local k="$1";for _ in $(seq 1 60);do python3 - "$DB" "$k" <<'PY'&&return||true
          import sqlite3,sys
          try:
              with sqlite3.connect(sys.argv[1]) as c:raise SystemExit(0 if c.execute('select count(*) from lore_definitions where lookup_key=?',(sys.argv[2],)).fetchone()[0]==1 else 1)
          except sqlite3.OperationalError:raise SystemExit(1)
          PY
          sleep 1;done;return 1;}
          START="$(date -u +%FT%TZ)";echo 'setblock 1 70 0 minecraft:crafting_table' >&3;echo 'setblock 3 70 0 minecraft:furnace' >&3;echo 'setblock 5 70 0 minecraft:grindstone' >&3;echo 'setblock 7 70 0 minecraft:smithing_table' >&3
          start Wp05Craft craft;start Wp05Smelt smelt;start Wp05Grind grind;start Wp05Smith smith;for N in Wp05Craft Wp05Smelt Wp05Grind Wp05Smith;do echo "op $N" >&3;done
          echo 'item replace entity Wp05Craft weapon.mainhand with minecraft:oak_planks 1' >&3;echo 'wp05accept perform Wp05Craft loreitems create prot_craft Protected Craft' >&3;wait_def prot_craft;echo 'wp05accept perform Wp05Craft loreitems adopt prot_craft' >&3;echo 'give Wp05Craft minecraft:oak_planks 2' >&3;echo 'tp Wp05Craft 1 71 0' >&3
          echo 'item replace entity Wp05Smelt weapon.mainhand with minecraft:raw_iron 1' >&3;echo 'wp05accept perform Wp05Smelt loreitems create prot_smelt Protected Smelt' >&3;wait_def prot_smelt;echo 'wp05accept perform Wp05Smelt loreitems adopt prot_smelt' >&3;echo 'give Wp05Smelt minecraft:coal 1' >&3;echo 'tp Wp05Smelt 3 71 0' >&3
          echo 'item replace entity Wp05Grind weapon.mainhand with minecraft:diamond_sword 1' >&3;echo 'enchant Wp05Grind minecraft:sharpness 1' >&3;echo 'wp05accept perform Wp05Grind loreitems create prot_grind Protected Grind' >&3;wait_def prot_grind;echo 'wp05accept perform Wp05Grind loreitems adopt prot_grind' >&3;echo 'tp Wp05Grind 5 71 0' >&3
          echo 'item replace entity Wp05Smith weapon.mainhand with minecraft:diamond_sword 1' >&3;echo 'wp05accept perform Wp05Smith loreitems create prot_smith Protected Smith' >&3;wait_def prot_smith;echo 'wp05accept perform Wp05Smith loreitems adopt prot_smith' >&3;echo 'give Wp05Smith minecraft:netherite_upgrade_smithing_template 1' >&3;echo 'give Wp05Smith minecraft:netherite_ingot 1' >&3;echo 'tp Wp05Smith 7 71 0' >&3;sleep 3
          for N in Wp05Craft Wp05Smelt Wp05Grind Wp05Smith;do Q="$(printf '%s' "$N"|tr '[:upper:]' '[:lower:]')";touch "$R/$Q.go";done
          finish Wp05Craft;finish Wp05Smelt;finish Wp05Grind;finish Wp05Smith
          echo stop >&3;wait "$SP";exec 3>&-;END="$(date -u +%FT%TZ)"
          python3 - "$DB" "$START" "$END" <<'PY' | tee "$E/result.json"
          import json,sqlite3,sys
          with sqlite3.connect(sys.argv[1]) as c:
              rows=[list(r) for r in c.execute("select d.lookup_key,i.instance_id,i.lifecycle_state from lore_instances i join lore_definitions d on d.definition_id=i.definition_id where d.lookup_key like 'prot_%' order by d.lookup_key")];assert len(rows)==4 and all(r[2]=='ACTIVE' for r in rows),rows;i=c.execute('pragma integrity_check').fetchone()[0];fk=[list(r) for r in c.execute('pragma foreign_key_check')];assert i=='ok' and not fk
          print(json.dumps({'case':'ACC-PROT-002-conversions','result':'PASS','source_head':open('/tmp/wp05-convert/evidence/source-head.txt').read().strip(),'started_at':sys.argv[2],'finished_at':sys.argv[3],'attempts':['crafting-table','furnace-smelt','grindstone','smithing-table'],'tracked_instances_after':rows,'server_identity_dump_count_each':1,'integrity':i,'foreign_key_violations':fk},indent=2))
          PY
      - name: Upload conversion evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wp05-conversion-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/wp05-convert/evidence
          if-no-files-found: error
          retention-days: 30

name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  checks: read
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.14.3"
      - name: Verify
        run: gradle --no-daemon clean check
      - name: Verify new-code complexity
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --name-only --diff-filter=ACMR "${BASE_SHA}...HEAD" -- '*.java' > .lizard-files
          git worktree add --detach .lizard-base "${BASE_SHA}"
          python3 -m venv .lizard-venv
          .lizard-venv/bin/pip install --disable-pip-version-check lizard==1.23.0
          .lizard-venv/bin/python tools/check_lizard.py .lizard-base .lizard-files
      - name: Verify exact-head Codacy
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 tools/check_codacy.py

name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  checks: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CODACY_ANALYSIS_SHA: 50160ca5fee9b9a8642328b1ac9e2fc5aa63b039
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.14.3"
      - name: Verify
        run: gradle --no-daemon clean check
      - name: Export historical Codacy check annotations
        shell: python
        run: |
          import json
          import os
          import pathlib
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["CODACY_ANALYSIS_SHA"]
          token = os.environ["GH_TOKEN"]
          out = pathlib.Path("codacy-historical-evidence")
          out.mkdir()
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "EnthusiaLoreItems-agent",
          }
          def get(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request) as response:
                  return json.load(response)
          base = f"https://api.github.com/repos/{repo}"
          checks = get(f"{base}/commits/{sha}/check-runs?per_page=100")
          (out / "check-runs.json").write_text(json.dumps(checks, indent=2))
          for check in checks.get("check_runs", []):
              annotations = get(f"{base}/check-runs/{check['id']}/annotations?per_page=100")
              (out / f"annotations-{check['id']}.json").write_text(json.dumps(annotations, indent=2))
      - uses: actions/upload-artifact@v4
        with:
          name: codacy-historical-evidence
          path: codacy-historical-evidence
          retention-days: 1
          if-no-files-found: error

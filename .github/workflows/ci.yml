name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  checks: read
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.14.3"
      - name: Verify and snapshot immutable source release identity
        env:
          RELEASE_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "${RELEASE_SOURCE_HEAD}"
          mkdir -p /tmp/release-source
          git show "${RELEASE_SOURCE_HEAD}:gradle.properties" > /tmp/release-source/gradle.properties
          VERSION_LINES="$(sed -n 's/^releaseVersion=//p' /tmp/release-source/gradle.properties | wc -l)"
          test "${VERSION_LINES}" -eq 1
          RELEASE_VERSION="$(sed -n 's/^releaseVersion=//p' /tmp/release-source/gradle.properties)"
          test -n "${RELEASE_VERSION}"
          [[ "${RELEASE_VERSION}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git show "${RELEASE_SOURCE_HEAD}:docs/releases/v${RELEASE_VERSION}.md" > /tmp/release-source/release-notes.md
          git show "${RELEASE_SOURCE_HEAD}:docs/releases/v${RELEASE_VERSION}-rollback.md" > /tmp/release-source/rollback-instructions.md
          git show "${RELEASE_SOURCE_HEAD}:docs/wp-05-acceptance/index.md" > /tmp/release-source/acceptance-index.md
          test -s /tmp/release-source/release-notes.md
          test -s /tmp/release-source/rollback-instructions.md
          test -s /tmp/release-source/acceptance-index.md
          printf 'RELEASE_VERSION=%s\n' "${RELEASE_VERSION}" >> "${GITHUB_ENV}"
      - name: Verify
        run: gradle --no-daemon clean check
      - name: Preserve test reports
        if: always()
        run: |
          mkdir -p /tmp/loreitems-test-reports
          find . -path '*/build/test-results/*' -type f -exec cp --parents '{}' /tmp/loreitems-test-reports/ \; || true
          find . -path '*/build/reports/tests/*' -type f -exec cp --parents '{}' /tmp/loreitems-test-reports/ \; || true
      - name: Install repository tooling dependencies
        run: python3 -m pip install --disable-pip-version-check -r tools/requirements.txt
      - name: Verify repository tooling
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Verify release publication-state behavior
        run: bash tools/test_release_publication_state.sh
      - name: Verify new-code complexity
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --name-only --diff-filter=ACMR "${BASE_SHA}...HEAD" -- '*.java' > .lizard-files
          git worktree add --detach .lizard-base "${BASE_SHA}"
          python3 -m venv .lizard-venv
          .lizard-venv/bin/pip install --disable-pip-version-check lizard==1.23.0
          .lizard-venv/bin/python tools/check_lizard.py .lizard-base .lizard-files
      - name: Verify exact-head Codacy
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 tools/check_codacy.py
      - name: Run deterministic WP-04 profile
        env:
          PROFILE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 tools/wp04_profile.py --output /tmp/wp04-profile.json
      - name: Build and validate release artifact
        run: |
          test -n "${RELEASE_VERSION}"
          gradle --no-daemon :plugin:shadowJar
          gradle --no-daemon :plugin:dependencies --configuration runtimeClasspath > /tmp/gradle-dependencies.txt
          JAR="$(find plugin/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' | head -n 1)"
          test -n "$JAR"
          mkdir -p /tmp/rc-first
          cp "$JAR" /tmp/rc-first/EnthusiaLoreItems.jar
          python3 tools/prepare_rc_artifacts.py \
            --jar /tmp/rc-first/EnthusiaLoreItems.jar \
            --dependencies /tmp/gradle-dependencies.txt \
            --output-dir /tmp/rc-first \
            --version "${RELEASE_VERSION}"
      - name: Add immutable release evidence
        env:
          RELEASE_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test -n "${RELEASE_VERSION}"
          test -d /tmp/loreitems-test-reports
          test -s /tmp/release-source/release-notes.md
          test -s /tmp/release-source/rollback-instructions.md
          test -s /tmp/release-source/acceptance-index.md
          tar -C /tmp/loreitems-test-reports -czf /tmp/rc-first/EnthusiaLoreItems-test-reports.tar.gz .
          cp /tmp/release-source/release-notes.md /tmp/rc-first/release-notes.md
          cp /tmp/release-source/rollback-instructions.md /tmp/rc-first/rollback-instructions.md
          cp /tmp/release-source/acceptance-index.md /tmp/rc-first/acceptance-index.md
          cp /tmp/wp04-profile.json /tmp/rc-first/wp04-profile.json
          STATIC_RELEASE_READY="$(sed -n 's/^release_ready: //p' /tmp/release-source/acceptance-index.md | tail -n 1)"
          if [ "${STATIC_RELEASE_READY}" != "APPROVED" ]; then
            STATIC_RELEASE_READY=NOT_APPROVED
          fi
          JAR_SHA="$(awk 'NR == 1 {print $1}' /tmp/rc-first/EnthusiaLoreItems.jar.sha256)"
          test -n "${JAR_SHA}"
          sed -i \
            -e '/^release_ready: /d' \
            -e '/^release_source_head: /d' \
            -e '/^release_jar_sha256: /d' \
            /tmp/rc-first/acceptance-index.md
          {
            printf '\nrelease_ready: %s\n' "${STATIC_RELEASE_READY}"
            printf 'release_source_head: %s\n' "${RELEASE_SOURCE_HEAD}"
            printf 'release_jar_sha256: %s\n' "${JAR_SHA}"
          } >> /tmp/rc-first/acceptance-index.md
      - name: Rebuild release from clean state and verify reproducibility
        run: |
          test -n "${RELEASE_VERSION}"
          gradle --no-daemon clean :plugin:shadowJar
          gradle --no-daemon :plugin:dependencies --configuration runtimeClasspath > /tmp/gradle-dependencies-second.txt
          JAR="$(find plugin/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' | head -n 1)"
          test -n "$JAR"
          mkdir -p /tmp/rc-second
          cp "$JAR" /tmp/rc-second/EnthusiaLoreItems.jar
          python3 tools/prepare_rc_artifacts.py \
            --jar /tmp/rc-second/EnthusiaLoreItems.jar \
            --dependencies /tmp/gradle-dependencies-second.txt \
            --output-dir /tmp/rc-second \
            --version "${RELEASE_VERSION}"
          diff -u /tmp/rc-first/normalized-entry-manifest.txt /tmp/rc-second/normalized-entry-manifest.txt
          diff -u /tmp/rc-first/EnthusiaLoreItems.jar.sha256 /tmp/rc-second/EnthusiaLoreItems.jar.sha256
      - name: Upload WP-05 verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wp04-verification-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            /tmp/rc-first/
            /tmp/loreitems-test-reports/
      - name: Prepare Sentinel plugin artifact
        run: |
          mkdir -p /tmp/sentinel-artifact/build/libs
          cp /tmp/rc-first/EnthusiaLoreItems.jar /tmp/sentinel-artifact/build/libs/EnthusiaLoreItems.jar
      - name: Upload Sentinel plugin artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: enthusialoreitems-plugin
          if-no-files-found: error
          retention-days: 30
          path: /tmp/sentinel-artifact/

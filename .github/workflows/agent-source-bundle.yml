name: Agent source bundle

on:
  push:
    branches:
      - agent/loreitems-pr2-creation-delivery-protection

permissions:
  contents: read

concurrency:
  group: agent-source-bundle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Create source archive
        run: tar --exclude=.git --exclude=build --exclude='*/build' -czf /tmp/enthusia-loreitems-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: enthusia-loreitems-source
          path: /tmp/enthusia-loreitems-source.tar.gz
          if-no-files-found: error
          retention-days: 1

name: Apply Adoption Upload

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.14.3"
      - name: Apply source bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .agent-upload/adoption.part* | base64 --decode > /tmp/adoption-changes.tar.gz
          gzip --test /tmp/adoption-changes.tar.gz
          tar --extract --gzip --file /tmp/adoption-changes.tar.gz
      - name: Verify
        run: gradle --no-daemon clean check
      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .agent-upload
          rm .github/workflows/apply-adoption-upload.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "implement durable held-item adoption"
          git push origin HEAD:${{ github.head_ref }}

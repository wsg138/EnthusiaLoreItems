name: Temporary source export

on:
  push:
    branches:
      - agent/loreitems-pr2-creation-delivery-protection

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Create source archive
        run: zip -qr loreitems-source.zip . -x '.git/*' 'build/*' '*/build/*' '.gradle/*'
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: loreitems-source
          path: loreitems-source.zip
          if-no-files-found: error
          retention-days: 1

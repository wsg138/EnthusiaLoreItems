name: Export review source

on:
  pull_request:

permissions:
  contents: read

jobs:
  export:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Package source
        run: git archive --format=tar.gz --output="$RUNNER_TEMP/review-source.tar.gz" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: review-source-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/review-source.tar.gz
          retention-days: 1

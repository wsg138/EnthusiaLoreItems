name: Source Export

on:
  push:
    branches:
      - agent/loreitems-pr2-creation-delivery-protection
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: source-export
          path: |
            .
            !.git
          include-hidden-files: true
          retention-days: 1

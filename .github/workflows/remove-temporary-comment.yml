name: Remove temporary diagnostic comment

on:
  pull_request:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Remove temporary comment and workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          headers=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          curl -fsSL "${headers[@]}" "${api}/issues/${PR_NUMBER}/comments?per_page=100" \
            | jq -r '.[] | select(.body | startswith("TEMPORARY CI DIAGNOSTIC")) | .id' \
            | while read -r comment_id; do
                curl -fsSL -X DELETE "${headers[@]}" "${api}/issues/comments/${comment_id}"
              done
          rm -f .github/workflows/remove-temporary-comment.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "remove temporary diagnostic comment cleanup"
          git push origin "HEAD:${HEAD_REF}"

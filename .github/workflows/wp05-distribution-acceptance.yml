name: WP-05 Distribution Campaign Acceptance

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: wp05-distribution-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  distribution-contract:
    if: github.event.pull_request.number == 18
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PAPER_URL: https://fill-data.papermc.io/v1/objects/e708e8c132dc143ffd73528cccb9532e2eb17628b1a0eee74469bf466c7003f8/paper-1.21.11-116.jar
      PAPER_SHA256: e708e8c132dc143ffd73528cccb9532e2eb17628b1a0eee74469bf466c7003f8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: "8.14.3"

      - name: Build exact PR head and pre-stage group validation fixtures
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :plugin:shadowJar :acceptance-harness:jar -PreleaseVersion=1.0.0-rc.1
          R=/tmp/wp05-distribution;mkdir -p "$R/server/plugins/EnthusiaLoreItems/groups/completed" "$R/server/plugins/EnthusiaLoreItems/groups/cancelled" "$R/evidence" "$R/bot"
          P="$(find plugin/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*'|head -n1)";H="$(find acceptance-harness/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*'|head -n1)";cp "$P" "$R/server/plugins/EnthusiaLoreItems.jar";cp "$H" "$R/server/plugins/WP05AcceptanceHarness.jar";sha256sum "$P">"$R/evidence/plugin-sha256.txt";sha256sum "$H">"$R/evidence/harness-sha256.txt";printf '%s\n' "${{ github.event.pull_request.head.sha || github.sha }}">"$R/evidence/source-head.txt";java -version 2>"$R/evidence/java-version.txt"
          G="$R/server/plugins/EnthusiaLoreItems/groups"
          cat >"$G/invalid-malformed.yml" <<'EOF'
          display-name: [unterminated
          players:
            - Someone
          EOF
          cat >"$G/invalid-unknown.yml" <<'EOF'
          display-name: Unknown Key
          players:
            - Someone
          surprise: rejected
          EOF
          cat >"$G/invalid-duplicate.yml" <<'EOF'
          display-name: Duplicate Recipient
          players:
            - Wp05CaseDup
            - wp05casedup
          EOF
          find "$G" -maxdepth 1 -type f -print -exec sha256sum {} \; >"$R/evidence/prestaged-groups.txt"
          cd "$R/server";curl -fsSL "$PAPER_URL" -o paper.jar;echo "$PAPER_SHA256  paper.jar"|sha256sum -c -;printf 'eula=true\n'>eula.txt
          cat >server.properties <<'EOF'
          online-mode=false
          enforce-secure-profile=false
          spawn-protection=0
          white-list=false
          server-port=25565
          motd=WP05 distribution acceptance
          EOF
          cd "$R/bot";npm init -y>/dev/null;npm install --save-exact mineflayer@4.35.0>"$R/evidence/npm-install.log" 2>&1;npm list --depth=0>"$R/evidence/npm-list.txt"
          cat >bot.js <<'EOF'
          const m=require('mineflayer'),fs=require('fs'),r='/tmp/wp05-distribution',name=process.argv[2],sleep=ms=>new Promise(x=>setTimeout(x,ms));if(!name)throw Error('name');const q=name.toLowerCase(),b=m.createBot({host:'127.0.0.1',port:25565,username:name,version:'1.21.11',auth:'offline'});b.on('message',x=>fs.appendFileSync(`${r}/evidence/bot-${q}.log`,`${new Date().toISOString()} ${x.toString()}\n`));b.once('spawn',()=>fs.writeFileSync(`${r}/${q}.uuid`,`${b.player.uuid}\n`));(async()=>{while(!fs.existsSync(`${r}/${q}.stop`))await sleep(100);b.quit('transition')})()
          EOF

      - name: Execute ACC-DIST-001 through ACC-DIST-005 Java/UUID/unresolved paths
        shell: bash
        run: |
          set -euo pipefail
          R=/tmp/wp05-distribution;S="$R/server";E="$R/evidence";DB="$S/plugins/EnthusiaLoreItems/loreitems.db";G="$S/plugins/EnthusiaLoreItems/groups";cd "$S"
          start_server(){ local l="$1";rm -f server.stdin;mkfifo server.stdin;exec 3<>server.stdin;java -Xms512M -Xmx1536M -Dpaper.disablePluginRemapping=true -jar paper.jar --nogui <server.stdin>"$l" 2>&1 & SPID=$!;for _ in $(seq 1 180);do if grep -q 'Mass distribution delivery, identity binding, marker recovery, and commands are active.' "$l"&&grep -q 'WP-05 deterministic acceptance helper is active' "$l";then return;fi;kill -0 "$SPID" 2>/dev/null||{ cat "$l";return 1;};sleep 1;done;cat "$l";return 1;}
          stop_server(){ echo stop >&3;wait "$SPID";exec 3>&-;rm -f server.stdin;}
          start_bot(){ local n="$1" q p;q="$(printf '%s' "$n"|tr '[:upper:]' '[:lower:]')";rm -f "$R/$q.uuid" "$R/$q.stop";(cd "$R/bot"&&node bot.js "$n")>"$E/$q-stdout.log" 2>&1 & p=$!;echo "$p">"$R/$q.pid";for _ in $(seq 1 100);do test -s "$R/$q.uuid"&&return;sleep .2;done;return 1;}
          stop_bot(){ local n="$1" q p;q="$(printf '%s' "$n"|tr '[:upper:]' '[:lower:]')";test -f "$R/$q.pid"||return;p="$(cat "$R/$q.pid")";touch "$R/$q.stop";for _ in $(seq 1 40);do kill -0 "$p" 2>/dev/null||break;sleep .2;done;kill "$p" 2>/dev/null||true;wait "$p" 2>/dev/null||true;rm -f "$R/$q.pid";}
          kill_bots(){ for f in "$R"/*.pid;do test -e "$f"||continue;p="$(cat "$f")";kill "$p" 2>/dev/null||true;wait "$p" 2>/dev/null||true;rm -f "$f";done;}
          wait_sql(){ local q="$1" limit="${2:-360}";for _ in $(seq 1 "$limit");do if python3 - "$DB" "$q" <<'PY'
          import sqlite3,sys
          try:
              with sqlite3.connect(sys.argv[1]) as c:r=c.execute(sys.argv[2]).fetchone();raise SystemExit(0 if r and r[0] else 1)
          except sqlite3.OperationalError:raise SystemExit(1)
          PY
            then return;fi;sleep .25;done;echo "SQL timeout: $q" >&2;return 1;}
          count_log(){ grep -Fc "$1" "$2" 2>/dev/null||true;}
          wait_log(){ local p="$1" l="$2" b="${3:-0}" limit="${4:-240}";for _ in $(seq 1 "$limit");do test "$(count_log "$p" "$l")" -gt "$b"&&return;sleep .25;done;echo "log timeout $p" >&2;tail -n 200 "$l" >&2;return 1;}
          reload_expect(){ local src="$1" l="$2" b;b="$(count_log "VALID $src" "$l")";echo 'loredistribution reload' >&3;wait_log "VALID $src" "$l" "$b";}
          preview(){ local src="$1" l="$2" b;b="$(count_log 'Distribution preview' "$l")";echo "loredistribution preview $src acc_dist_main" >&3;wait_log 'Distribution preview' "$l" "$b";grep -F 'Campaign: ' "$l"|tail -n1|sed -E 's/.*Campaign: ([0-9a-fA-F-]{36}).*/\1/'|tr -d '\r';}
          dump_expect(){ local n="$1" expected="$2" l="$3" b;b="$(count_log "WP05_ACCEPT DUMP ok player=$n count=$expected" "$l")";echo "wp05accept dump $n" >&3;wait_log "WP05_ACCEPT DUMP ok player=$n count=$expected" "$l" "$b";}
          START="$(date -u +%FT%TZ)";L1="$E/server-initial.log";start_server "$L1";start_bot Wp05DistAdmin;echo 'op Wp05DistAdmin' >&3;echo 'wp05accept source Wp05DistAdmin sword' >&3;sleep .5;echo 'wp05accept perform Wp05DistAdmin loreitems create acc_dist_main Distribution Acceptance' >&3;wait_sql "select count(*)=1 from lore_definitions where lookup_key='acc_dist_main' and deleted_at is null"
          # Pre-staged invalid files must be visible and rejected fail-closed.
          for src in invalid-malformed.yml invalid-unknown.yml invalid-duplicate.yml;do test -f "$G/$src";done;B0="$(count_log 'INVALID invalid-malformed.yml' "$L1")";B1="$(count_log 'INVALID invalid-unknown.yml' "$L1")";B2="$(count_log 'INVALID invalid-duplicate.yml' "$L1")";echo 'loredistribution reload' >&3;wait_log 'INVALID invalid-malformed.yml' "$L1" "$B0";wait_log 'INVALID invalid-unknown.yml' "$L1" "$B1";wait_log 'INVALID invalid-duplicate.yml' "$L1" "$B2";rm -f "$G"/invalid-*.yml
          # Preview immutability and duplicate source fingerprint.
          cat >"$G/dist-mutable.yml" <<'EOF'
          display-name: Mutable Preview
          players:
            - Wp05DistAdmin
          EOF
          reload_expect dist-mutable.yml "$L1";MUTABLE_ID="$(preview dist-mutable.yml "$L1")";cat >"$G/dist-mutable.yml" <<'EOF'
          display-name: Mutated After Preview
          players:
            - Wp05DistAdmin
          EOF
          B="$(count_log 'The group source changed or disappeared after preview; no campaign was started.' "$L1")";echo "loredistribution confirm $MUTABLE_ID" >&3;wait_log 'The group source changed or disappeared after preview; no campaign was started.' "$L1" "$B";wait_sql "select count(*)=0 from distribution_campaigns" 80
          cat >"$G/dist-mutable.yml" <<'EOF'
          display-name: Mutable Preview
          players:
            - Wp05DistAdmin
          EOF
          reload_expect dist-mutable.yml "$L1";VALID_ID="$(preview dist-mutable.yml "$L1")";echo "loredistribution confirm $VALID_ID" >&3;wait_sql "select count(*)=1 from distribution_campaigns where campaign_id='$VALID_ID' and state='COMPLETED'";wait_sql "select count(*)=1 from distribution_recipients where campaign_id='$VALID_ID' and state='DELIVERED'";COMPLETED="$G/completed/dist-mutable.completed-$VALID_ID.yml";for _ in $(seq 1 120);do test -f "$COMPLETED"&&break;sleep .25;done;test -f "$COMPLETED";cp "$COMPLETED" "$G/dist-mutable.yml";reload_expect dist-mutable.yml "$L1";REPLAY_ID="$(preview dist-mutable.yml "$L1")";B="$(count_log 'This exact source fingerprint already belongs to a durable campaign.' "$L1")";echo "loredistribution confirm $REPLAY_ID" >&3;wait_log 'This exact source fingerprint already belongs to a durable campaign.' "$L1" "$B";wait_sql "select count(*)=1 from distribution_campaigns where source_name='dist-mutable.yml'";rm -f "$G/dist-mutable.yml"
          # Cache known names and create online-free/full, offline, explicit UUID, and unresolved recipients.
          for N in Wp05Free Wp05Full Wp05Offline Wp05Explicit;do start_bot "$N";done;EXPLICIT_UUID="$(tr -d '\r\n'<"$R/wp05explicit.uuid")";stop_bot Wp05Offline;for i in $(seq 0 8);do echo "item replace entity Wp05Full hotbar.$i with minecraft:stone 64" >&3;done;for i in $(seq 0 26);do echo "item replace entity Wp05Full inventory.$i with minecraft:stone 64" >&3;done;sleep 2
          cat >"$G/dist-main.yml" <<EOF
          display-name: Delivery State Matrix
          players:
            - Wp05Free
            - Wp05Full
            - Wp05Offline
            - $EXPLICIT_UUID
            - Wp05Future
          EOF
          cp "$G/dist-main.yml" "$E/dist-main-source.yml";reload_expect dist-main.yml "$L1";MAIN_ID="$(preview dist-main.yml "$L1")";echo "loredistribution confirm $MAIN_ID" >&3;wait_sql "select count(*)=5 from distribution_recipients where campaign_id='$MAIN_ID'";wait_sql "select count(*)=1 from distribution_recipients where campaign_id='$MAIN_ID' and original_value='Wp05Future' and state='UNRESOLVED' and player_id is null";wait_sql "select count(*)=1 from distribution_recipients where campaign_id='$MAIN_ID' and original_value='Wp05Full' and state='QUEUED_INVENTORY_FULL'";wait_sql "select count(*)=1 from distribution_recipients where campaign_id='$MAIN_ID' and original_value='Wp05Offline' and state='QUEUED_OFFLINE'";wait_sql "select count(*)=1 from distribution_recipients where campaign_id='$MAIN_ID' and original_value='$EXPLICIT_UUID' and player_id='$EXPLICIT_UUID' and state='DELIVERED'";wait_sql "select count(*)=1 from distribution_recipients where campaign_id='$MAIN_ID' and original_value='Wp05Free' and state='DELIVERED'";stop_server;kill_bots
          # Restart preserves deferred work; natural space/join/binding completes exactly once.
          L2="$E/server-main-restart.log";start_server "$L2";start_bot Wp05Free;start_bot Wp05Full;start_bot Wp05Explicit;wait_sql "select count(*)=1 from distribution_recipients where campaign_id='$MAIN_ID' and original_value='Wp05Full' and state='QUEUED_INVENTORY_FULL'";echo 'item replace entity Wp05Full hotbar.0 with minecraft:air' >&3;start_bot Wp05Offline;start_bot Wp05Future;FUTURE_UUID="$(tr -d '\r\n'<"$R/wp05future.uuid")";wait_sql "select count(*)=1 from distribution_recipients where campaign_id='$MAIN_ID' and original_value='Wp05Future' and player_id='$FUTURE_UUID' and state='DELIVERED'";wait_sql "select count(*)=5 from distribution_recipients where campaign_id='$MAIN_ID' and state='DELIVERED' and instance_id is not null";wait_sql "select count(*)=1 from distribution_campaigns where campaign_id='$MAIN_ID' and state='COMPLETED'";for N in Wp05Free Wp05Full Wp05Offline Wp05Explicit Wp05Future;do dump_expect "$N" 1 "$L2";done;MAIN_TERMINAL="$G/completed/dist-main.completed-$MAIN_ID.yml";for _ in $(seq 1 120);do test -f "$MAIN_TERMINAL"&&break;sleep .25;done;test -f "$MAIN_TERMINAL";stop_server;kill_bots
          # Replay restart proves no duplicate delivery.
          L3="$E/server-replay.log";start_server "$L3";for N in Wp05Free Wp05Full Wp05Offline Wp05Explicit Wp05Future;do start_bot "$N";done;sleep 3;wait_sql "select count(distinct instance_id)=5 from distribution_recipients where campaign_id='$MAIN_ID'";for N in Wp05Free Wp05Full Wp05Offline Wp05Explicit Wp05Future;do dump_expect "$N" 1 "$L3";stop_bot "$N";done
          # Pause/restart/resume/cancel and marker repair against a changed replacement source.
          for N in Wp05Cancel1 Wp05Cancel2 Wp05Cancel3;do start_bot "$N";stop_bot "$N";done;cat >"$G/dist-control.yml" <<'EOF'
          display-name: Control And Reconcile
          players:
            - Wp05Cancel1
            - Wp05Cancel2
            - Wp05Cancel3
          EOF
          reload_expect dist-control.yml "$L3";CONTROL_ID="$(preview dist-control.yml "$L3")";echo "loredistribution confirm $CONTROL_ID" >&3;wait_sql "select count(*)=3 from distribution_recipients where campaign_id='$CONTROL_ID' and state='QUEUED_OFFLINE'";echo "loredistribution pause $CONTROL_ID" >&3;wait_sql "select count(*)=1 from distribution_campaigns where campaign_id='$CONTROL_ID' and state='PAUSED'";ACTIVE="$G/dist-control.active-$CONTROL_ID.yml";for _ in $(seq 1 120);do test -f "$ACTIVE"&&break;sleep .25;done;test -f "$ACTIVE";FP="$(python3 - "$DB" "$CONTROL_ID" <<'PY'
          import sqlite3,sys
          with sqlite3.connect(sys.argv[1]) as c:print(c.execute('select source_fingerprint from distribution_campaigns where campaign_id=?',(sys.argv[2],)).fetchone()[0])
          PY
          )";rm "$ACTIVE";cat >"$G/dist-control.yml" <<'EOF'
          display-name: CHANGED REPLACEMENT MUST REMAIN
          players:
            - Wp05DistAdmin
          EOF
          sha256sum "$G/dist-control.yml">"$E/replacement-before.sha256";B="$(count_log "$CONTROL_ID PAUSED RECONCILED" "$L3")";echo 'loredistribution reconcile' >&3;wait_log "$CONTROL_ID PAUSED RECONCILED" "$L3" "$B" 360;test -f "$ACTIVE";test -f "$G/dist-control.yml";sha256sum "$G/dist-control.yml">"$E/replacement-after.sha256";cmp "$E/replacement-before.sha256" "$E/replacement-after.sha256";grep -F "campaign-id: $CONTROL_ID" "$ACTIVE";grep -F "source-fingerprint: $FP" "$ACTIVE";cp "$ACTIVE" "$E/recovered-active-marker.yml";stop_server;kill_bots
          L4="$E/server-control-restart.log";start_server "$L4";wait_sql "select count(*)=1 from distribution_campaigns where campaign_id='$CONTROL_ID' and state='PAUSED'";wait_sql "select count(*)=0 from distribution_recipients where campaign_id='$CONTROL_ID' and state='DELIVERED'";echo "loredistribution resume $CONTROL_ID" >&3;wait_sql "select count(*)=1 from distribution_campaigns where campaign_id='$CONTROL_ID' and state='ACTIVE'";start_bot Wp05Cancel1;wait_sql "select count(*)=1 from distribution_recipients where campaign_id='$CONTROL_ID' and original_value='Wp05Cancel1' and state='DELIVERED'";stop_bot Wp05Cancel1;echo "loredistribution cancel $CONTROL_ID" >&3;wait_sql "select count(*)=1 from distribution_campaigns where campaign_id='$CONTROL_ID' and state='CANCELLED'";wait_sql "select count(*)=2 from distribution_recipients where campaign_id='$CONTROL_ID' and state='CANCELLED'";echo 'loredistribution reconcile' >&3;CANCELLED="$G/cancelled/dist-control.cancelled-$CONTROL_ID.yml";for _ in $(seq 1 180);do test -f "$CANCELLED"&&break;sleep .25;done;test -f "$CANCELLED";test -f "$G/dist-control.yml";stop_server;kill_bots
          L5="$E/server-final-restart.log";start_server "$L5";wait_sql "select count(*)=1 from distribution_campaigns where campaign_id='$CONTROL_ID' and state='CANCELLED'";wait_sql "select count(*)=1 from distribution_recipients where campaign_id='$CONTROL_ID' and state='DELIVERED'";wait_sql "select count(*)=2 from distribution_recipients where campaign_id='$CONTROL_ID' and state='CANCELLED'";stop_server;END="$(date -u +%FT%TZ)"
          python3 - "$DB" "$START" "$END" "$VALID_ID" "$MAIN_ID" "$CONTROL_ID" "$EXPLICIT_UUID" "$FUTURE_UUID" <<'PY'|tee "$E/result.json"
          import json,sqlite3,sys
          db,start,end,valid,main,control,explicit,future=sys.argv[1:]
          with sqlite3.connect(db) as c:
              c.row_factory=sqlite3.Row;integrity=c.execute('pragma integrity_check').fetchone()[0];foreign=[list(r) for r in c.execute('pragma foreign_key_check')];assert integrity=='ok' and not foreign;main_rows=[dict(r) for r in c.execute('select snapshot_index,original_value,player_id,state,instance_id,attempt_count from distribution_recipients where campaign_id=? order by snapshot_index',(main,))];control_rows=[dict(r) for r in c.execute('select snapshot_index,original_value,player_id,state,instance_id,attempt_count from distribution_recipients where campaign_id=? order by snapshot_index',(control,))];assert len(main_rows)==5 and all(r['state']=='DELIVERED' and r['instance_id'] for r in main_rows);assert next(r for r in main_rows if r['original_value']==explicit)['player_id']==explicit;assert next(r for r in main_rows if r['original_value']=='Wp05Future')['player_id']==future;assert len({r['instance_id'] for r in main_rows})==5;assert len(control_rows)==3 and sum(r['state']=='DELIVERED' for r in control_rows)==1 and sum(r['state']=='CANCELLED' for r in control_rows)==2;states={r['campaign_id']:r['state'] for r in c.execute('select campaign_id,state from distribution_campaigns where campaign_id in (?,?,?)',(valid,main,control))};assert states=={valid:'COMPLETED',main:'COMPLETED',control:'CANCELLED'}
          print(json.dumps({'cases':{'ACC-DIST-001':'PASS','ACC-DIST-002-java-uuid-unresolved':'PASS','ACC-DIST-003':'PASS','ACC-DIST-004':'PASS','ACC-DIST-005':'PASS'},'source_head':open('/tmp/wp05-distribution/evidence/source-head.txt').read().strip(),'started_at':start,'finished_at':end,'campaigns':states,'main_recipients':main_rows,'control_recipients':control_rows,'explicit_uuid':explicit,'future_bound_uuid':future,'integrity':integrity,'foreign_key_violations':foreign},indent=2,sort_keys=True))
          PY

      - name: Collect failure diagnostics
        if: failure()
        shell: bash
        run: |
          R=/tmp/wp05-distribution;DB="$R/server/plugins/EnthusiaLoreItems/loreitems.db";mkdir -p "$R/evidence";if test -f "$DB";then python3 - "$DB">"$R/evidence/failure-db.txt" 2>&1 <<'PY' || true
          import sqlite3,sys
          c=sqlite3.connect(sys.argv[1]);c.row_factory=sqlite3.Row
          for t in ('lore_definitions','lore_instances','distribution_campaigns','distribution_campaign_revision_snapshots','distribution_recipients','audit_events'):
              print('##',t)
              try:
                  for r in c.execute(f'select * from {t}'):print(dict(r))
              except Exception as e:print(type(e).__name__,e)
          print('integrity',list(c.execute('pragma integrity_check')));print('foreign',list(c.execute('pragma foreign_key_check')))
          PY
          fi;find "$R/server/plugins/EnthusiaLoreItems/groups" -maxdepth 2 -type f -print -exec sha256sum {} \; >"$R/evidence/failure-markers.txt" 2>&1||true
      - name: Upload distribution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wp05-distribution-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/wp05-distribution/evidence
          if-no-files-found: error
          retention-days: 30

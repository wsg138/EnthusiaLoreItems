name: Apply PR30 Codacy repair

on:
  pull_request:

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out current temporary head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Guard bounded repair ancestry
        run: |
          set -euo pipefail
          git merge-base --is-ancestor ef5372e23568d96a706d3019d619fb0b84ab46c7 HEAD
          test "$(git diff --name-only ef5372e23568d96a706d3019d619fb0b84ab46c7..HEAD | sort -u)" = ".github/workflows/codacy-pr30-evidence.yml"
      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.14.3"
      - name: Fetch, verify, and apply bounded repair
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PATCH_BLOB_SHA: c6c1b486725565a50f96a6c3eceb96aef623fb0c
        run: |
          set -euo pipefail
          gh api -H "Accept: application/vnd.github+json" "/repos/${REPOSITORY}/git/blobs/${PATCH_BLOB_SHA}" \
            | jq -r '.content' | tr -d '\n' | base64 --decode > /tmp/pr30-codacy-repair.patch.gz
          echo "44240e9996f4fcf5690d6bd3ac4563c426d79f1dbd753f091ffa42b6919a66cb  /tmp/pr30-codacy-repair.patch.gz" | sha256sum --check -
          gzip --decompress --stdout /tmp/pr30-codacy-repair.patch.gz > /tmp/pr30-codacy-repair.patch
          echo "d0c7e24c4e52a00e7f2a57ab0189c9e24a95847987f4ff80d47ef95c0566068b  /tmp/pr30-codacy-repair.patch" | sha256sum --check -
          git apply --check /tmp/pr30-codacy-repair.patch
          git apply /tmp/pr30-codacy-repair.patch
          rm .github/workflows/codacy-pr30-evidence.yml
          git diff --check
      - name: Verify Gradle code and tests
        run: gradle --no-daemon clean check
      - name: Verify repository tooling
        run: |
          python3 -m pip install --disable-pip-version-check -r tools/requirements.txt
          python3 -m unittest discover -s tools -p 'test_*.py'
          bash tools/test_release_publication_state.sh
      - name: Verify new-code complexity
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git diff --name-status --find-renames --diff-filter=AMR "${BASE_SHA}" -- '*.java' > .lizard-files
          git worktree add --detach .lizard-base "${BASE_SHA}"
          python3 -m venv .lizard-venv
          .lizard-venv/bin/pip install --disable-pip-version-check lizard==1.23.0
          .lizard-venv/bin/python tools/check_lizard.py .lizard-base .lizard-files
          rm -f .lizard-files
      - name: Commit validated repair to staging ref
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: clear Codacy pre-freeze findings"
          REPAIR_SHA="$(git rev-parse HEAD)"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" "HEAD:refs/heads/pr30-codacy-repair-staging"
          printf 'Validated repair staged at %s\n' "${REPAIR_SHA}"

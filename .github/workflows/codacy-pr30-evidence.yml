name: Export PR30 Codacy evidence

on:
  pull_request:

permissions:
  contents: read
  checks: read
  statuses: read

jobs:
  export:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Export target Codacy check and annotations
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 62b649057dd12712b34b1dd909f49f343ea08a89
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p codacy-evidence
          gh api -H "Accept: application/vnd.github+json" "/repos/${REPOSITORY}/commits/${TARGET_SHA}/check-runs?per_page=100" > codacy-evidence/all-check-runs.json
          gh api -H "Accept: application/vnd.github+json" "/repos/${REPOSITORY}/commits/${TARGET_SHA}/status?per_page=100" > codacy-evidence/combined-status.json
          jq '[.check_runs[] | select((((.app.slug // "") + " " + (.name // "")) | ascii_downcase | contains("codacy")))]' codacy-evidence/all-check-runs.json > codacy-evidence/codacy-check-runs.json
          : > codacy-evidence/annotation-pages.jsonl
          while IFS= read -r check_id; do
            gh api --paginate --slurp -H "Accept: application/vnd.github+json" "/repos/${REPOSITORY}/check-runs/${check_id}/annotations?per_page=100" | jq -c --argjson checkRunId "${check_id}" '{checkRunId: $checkRunId, annotations: (add // [])}' >> codacy-evidence/annotation-pages.jsonl
          done < <(jq -r '.[].id' codacy-evidence/codacy-check-runs.json)
          if [ -s codacy-evidence/annotation-pages.jsonl ]; then jq -s '.' codacy-evidence/annotation-pages.jsonl > codacy-evidence/codacy-annotations.json; else printf '[]\n' > codacy-evidence/codacy-annotations.json; fi
          jq -n --arg targetSha "${TARGET_SHA}" --slurpfile checkRuns codacy-evidence/codacy-check-runs.json --slurpfile annotations codacy-evidence/codacy-annotations.json --slurpfile statuses codacy-evidence/combined-status.json '{targetSha: $targetSha, checkRuns: $checkRuns[0], annotationPages: $annotations[0], combinedStatus: $statuses[0]}' > codacy-evidence/evidence.json
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: codacy-pr30-evidence-62b649057dd12712b34b1dd909f49f343ea08a89
          path: codacy-evidence/
          if-no-files-found: error
          retention-days: 3
      - name: Check out exact failing source
        uses: actions/checkout@v4
        with:
          ref: 62b649057dd12712b34b1dd909f49f343ea08a89
      - name: Collect annotated source files
        run: |
          set -euo pipefail
          mkdir -p codacy-source
          while IFS= read -r path; do
            mkdir -p "codacy-source/$(dirname "$path")"
            cp "$path" "codacy-source/$path"
          done <<'EOF'
          .codacy.yml
          adapters-paper/src/main/java/net/enthusia/loreitems/paper/PaperDisplayListenerRegistry.java
          adapters-paper/src/main/java/net/enthusia/loreitems/paper/PaperDistributionCampaignCoordinator.java
          adapters-paper/src/main/java/net/enthusia/loreitems/paper/PaperPhysicalInventoryScanner.java
          adapters-paper/src/main/java/net/enthusia/loreitems/paper/PaperTrackedItemCollector.java
          adapters-paper/src/main/java/net/enthusia/loreitems/paper/PaperTrackingCoordinator.java
          adapters-paper/src/test/java/net/enthusia/loreitems/paper/PaperCreativeCloneProtectionTest.java
          adapters-paper/src/test/java/net/enthusia/loreitems/paper/PaperDistributionRecipientBindingWorkerTest.java
          adapters-paper/src/test/java/net/enthusia/loreitems/paper/PaperPhysicalEntityScannerTest.java
          adapters-paper/src/test/java/net/enthusia/loreitems/paper/PaperPhysicalTrackingBlockLifecycleTest.java
          adapters-paper/src/test/java/net/enthusia/loreitems/paper/PaperTrackedItemConsumptiveBoundaryTest.java
          adapters-sqlite/src/main/java/net/enthusia/loreitems/sqlite/SQLiteDestructiveAcceptanceStore.java
          adapters-sqlite/src/main/java/net/enthusia/loreitems/sqlite/SQLiteStorageRuntime.java
          adapters-sqlite/src/main/resources/db/migration/V10__item_display_observation_support.sql
          adapters-sqlite/src/test/java/net/enthusia/loreitems/sqlite/SQLiteAuditRepositoryTest.java
          adapters-sqlite/src/test/java/net/enthusia/loreitems/sqlite/SQLiteDestructiveAuditProvenanceTest.java
          adapters-sqlite/src/test/java/net/enthusia/loreitems/sqlite/SQLiteExternalDeliveryRecoveryTest.java
          adapters-sqlite/src/test/java/net/enthusia/loreitems/sqlite/SQLiteSchemaHealthVerifierTest.java
          plugin/src/main/java/net/enthusia/loreitems/plugin/LoreItemsPlugin.java
          plugin/src/main/java/net/enthusia/loreitems/plugin/LoreItemsShutdownSupport.java
          tools/check_lizard.py
          tools/prepare_rc_artifacts.py
          tools/test_wp04_release_contract.py
          EOF
      - name: Upload annotated source
        uses: actions/upload-artifact@v4
        with:
          name: codacy-pr30-source-62b649057dd12712b34b1dd909f49f343ea08a89
          path: codacy-source/
          if-no-files-found: error
          retention-days: 3

name: Temporary CI diagnostics

on:
  pull_request:

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Print failed verification output
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: 30868215670
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}/actions/runs/${RUN_ID}/logs" \
            -o logs.zip
          unzip -q logs.zip -d logs
          grep -R -n -E "error:|FAILURE:|FAILED|What went wrong|Compilation failed" logs || true
          find logs -type f -maxdepth 2 -print -exec tail -n 120 {} \;

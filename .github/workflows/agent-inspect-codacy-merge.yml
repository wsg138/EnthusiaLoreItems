name: Agent inspect Codacy merge

on:
  pull_request:

permissions:
  contents: read
  checks: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_SHA: 50160ca5fee9b9a8642328b1ac9e2fc5aa63b039
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Export check runs and annotations
        shell: python
        run: |
          import json
          import os
          import pathlib
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["TARGET_SHA"]
          token = os.environ["GH_TOKEN"]
          out = pathlib.Path("codacy-merge-evidence")
          out.mkdir()
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "EnthusiaLoreItems-agent",
          }
          def get(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request) as response:
                  return json.load(response)
          base = f"https://api.github.com/repos/{repo}"
          checks = get(f"{base}/commits/{sha}/check-runs?per_page=100")
          (out / "check-runs.json").write_text(json.dumps(checks, indent=2))
          for check in checks.get("check_runs", []):
              annotations = get(f"{base}/check-runs/{check['id']}/annotations?per_page=100")
              (out / f"annotations-{check['id']}.json").write_text(json.dumps(annotations, indent=2))
      - uses: actions/upload-artifact@v4
        with:
          name: codacy-merge-evidence
          path: codacy-merge-evidence
          retention-days: 1
          if-no-files-found: error

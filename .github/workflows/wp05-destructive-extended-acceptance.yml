name: WP-05 Destructive Extended Acceptance

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: wp05-destructive-extended-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  destructive-extended:
    if: github.event.pull_request.number == 18
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PAPER_URL: https://fill-data.papermc.io/v1/objects/e708e8c132dc143ffd73528cccb9532e2eb17628b1a0eee74469bf466c7003f8/paper-1.21.11-116.jar
      PAPER_SHA256: e708e8c132dc143ffd73528cccb9532e2eb17628b1a0eee74469bf466c7003f8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.14.3"

      - name: Build exact PR head and prepare destructive server
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :plugin:shadowJar :acceptance-harness:jar -PreleaseVersion=1.0.0-rc.1
          ROOT=/tmp/wp05-destx
          mkdir -p "$ROOT/server/plugins/EnthusiaLoreItems" "$ROOT/evidence" "$ROOT/bot"
          PLUGIN_JAR="$(find plugin/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' | head -n1)"
          HARNESS_JAR="$(find acceptance-harness/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' | head -n1)"
          cp "$PLUGIN_JAR" "$ROOT/server/plugins/EnthusiaLoreItems.jar"
          cp "$HARNESS_JAR" "$ROOT/server/plugins/WP05AcceptanceHarness.jar"
          sha256sum "$PLUGIN_JAR" > "$ROOT/evidence/plugin-sha256.txt"
          sha256sum "$HARNESS_JAR" > "$ROOT/evidence/harness-sha256.txt"
          printf '%s\n' "${{ github.event.pull_request.head.sha || github.sha }}" > "$ROOT/evidence/source-head.txt"
          java -version 2> "$ROOT/evidence/java-version.txt"
          cat > "$ROOT/server/plugins/EnthusiaLoreItems/config.yml" <<'EOF'
          database-busy-timeout-millis: 500
          mutation-budget-per-tick: 32
          EOF
          cd "$ROOT/server"
          curl -fsSL "$PAPER_URL" -o paper.jar
          echo "$PAPER_SHA256  paper.jar" | sha256sum -c -
          printf 'eula=true\n' > eula.txt
          cat > server.properties <<'EOF'
          online-mode=false
          enforce-secure-profile=false
          spawn-protection=0
          white-list=false
          server-port=25565
          motd=WP05 destructive extended acceptance
          EOF
          cd "$ROOT/bot"
          npm init -y >/dev/null
          npm install --save-exact mineflayer@4.35.0 >"$ROOT/evidence/npm-install.log" 2>&1
          npm list --depth=0 > "$ROOT/evidence/npm-list.txt"
          cat > idle.js <<'EOF'
          const mineflayer=require('mineflayer'),fs=require('fs')
          const root='/tmp/wp05-destx',name=process.env.BOT_NAME
          const bot=mineflayer.createBot({host:'127.0.0.1',port:25565,username:name,version:'1.21.11',auth:'offline'})
          const log=x=>{fs.appendFileSync(`${root}/evidence/${name}.log`,`${new Date().toISOString()} ${x}\n`);console.log(x)}
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));let moving=false
          bot.on('message',m=>log(`CHAT ${m.toString()}`));bot.on('error',e=>log(`ERROR ${e.stack||e}`));bot.on('kicked',r=>log(`KICKED ${String(r)}`));bot.on('end',()=>process.exit(0))
          bot.once('spawn',()=>{log(`SPAWN uuid=${bot.player.uuid}`);fs.writeFileSync(`${root}/${name}.uuid`,`${bot.player.uuid}\n`)})
          const timer=setInterval(async()=>{
            if(!moving&&fs.existsSync(`${root}/${name}.move`)&&!fs.existsSync(`${root}/${name}.move.done`)){
              moving=true
              try{
                const item=bot.inventory.items().find(i=>i.name==='diamond_sword');if(!item)throw new Error('tracked sword not found')
                const dest=item.slot===36?37:36;await bot.moveSlotItem(item.slot,dest);await sleep(500)
                fs.writeFileSync(`${root}/${name}.move.done`,'ok\n');log(`MOVE ${item.slot}->${dest}`)
              }catch(e){fs.writeFileSync(`${root}/${name}.move.failed`,String(e.stack||e));log(`MOVE_FAIL ${e.stack||e}`)}finally{moving=false}
            }
            if(fs.existsSync(`${root}/${name}.stop`)){clearInterval(timer);bot.quit('acceptance stage complete')}
          },100)
          EOF

      - name: Execute ACC-DEST-002..004
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/wp05-destx
          DB="$ROOT/server/plugins/EnthusiaLoreItems/loreitems.db"
          cd "$ROOT/server"
          start_server(){
            local log="$1"; rm -f server.stdin; mkfifo server.stdin; exec 3<>server.stdin
            java -Xms512M -Xmx1536M -Dpaper.disablePluginRemapping=true -jar paper.jar --nogui <server.stdin >"$log" 2>&1 & SERVER_PID=$!
            for _ in $(seq 1 180); do
              if grep -q 'Queued direct-delivery processing is active.' "$log" && grep -q 'WP-05 deterministic acceptance helper is active' "$log"; then return; fi
              kill -0 "$SERVER_PID" 2>/dev/null || { cat "$log"; return 1; }; sleep 1
            done; cat "$log"; return 1
          }
          stop_server(){ echo stop >&3; wait "$SERVER_PID"; exec 3>&-; rm -f server.stdin; }
          crash_server(){ kill -9 "$SERVER_PID"; wait "$SERVER_PID" || true; exec 3>&-; rm -f server.stdin; }
          start_bot(){
            local name="$1"; rm -f "$ROOT/$name.uuid" "$ROOT/$name.stop"
            (cd "$ROOT/bot" && BOT_NAME="$name" node idle.js) >"$ROOT/evidence/$name-stdout.log" 2>&1 & LAST_BOT_PID=$!
            for _ in $(seq 1 90); do test -s "$ROOT/$name.uuid" && return; kill -0 "$LAST_BOT_PID" 2>/dev/null || return 1; sleep 1; done; return 1
          }
          stop_bot(){ local name="$1" pid="$2"; touch "$ROOT/$name.stop"; wait "$pid" || true; rm -f "$ROOT/$name.stop"; }
          wait_sql(){
            local code="$1"
            python3 - "$DB" "$code" <<'PY'
          import sqlite3,sys,time
          db,code=sys.argv[1:]
          for _ in range(320):
              try:
                  with sqlite3.connect(db) as c:
                      if eval(code,{'c':c}): raise SystemExit(0)
              except (sqlite3.Error,TypeError,IndexError): pass
              time.sleep(.25)
          raise SystemExit('SQL wait failed: '+code)
          PY
          }
          preview_confirm(){
            local kind="$1" did="$2" iid="${3:-}" log="$4" route token
            if [[ "$kind" == remove ]]; then echo "loreitems remove $did $iid" >&3; route=confirm-remove; else echo "loreitems purge $did" >&3; route=confirm-purge; fi
            for _ in $(seq 1 80); do token="$(grep -oE "$route [^ ]+" "$log" | tail -n1 | awk '{print $2}' || true)"; test -n "$token" && break; sleep .25; done
            test -n "${token:-}"; echo "loreitems $route $token" >&3
          }

          start_server "$ROOT/evidence/server-initial.log"
          start_bot Wp05PurgeLoaded; LOADED_PID=$LAST_BOT_PID
          start_bot Wp05PurgeOffline; OFFLINE_PID=$LAST_BOT_PID
          start_bot Wp05PurgeNested; NESTED_PID=$LAST_BOT_PID
          for n in Wp05PurgeLoaded Wp05PurgeOffline Wp05PurgeNested; do echo "op $n" >&3; done
          echo 'wp05accept source Wp05PurgeLoaded sword' >&3; sleep 1
          echo 'wp05accept perform Wp05PurgeLoaded loreitems create acc_purge_live Purge Acceptance' >&3
          wait_sql "c.execute(\"select count(*) from lore_definitions where lookup_key='acc_purge_live'\").fetchone()[0]==1"
          for n in Wp05PurgeLoaded Wp05PurgeOffline Wp05PurgeNested; do echo "wp05accept perform $n loreitems give acc_purge_live" >&3; sleep .5; done
          wait_sql "c.execute(\"select count(*) from direct_deliveries where state='COMPLETED'\").fetchone()[0]>=3"
          read PURGE_DID LOADED_IID OFFLINE_IID NESTED_IID < <(python3 - "$DB" <<'PY'
          import sqlite3,sys
          with sqlite3.connect(sys.argv[1]) as c:
              did=c.execute("select definition_id from lore_definitions where lookup_key='acc_purge_live'").fetchone()[0]
              def iid(name):
                  pid=c.execute('select player_id from direct_deliveries d join lore_instances i on i.instance_id=d.instance_id where i.definition_id=? and d.state=\'COMPLETED\' and d.player_id=(select player_id from direct_deliveries where delivery_id=d.delivery_id) order by d.created_at',(did,)).fetchall()
              rows={r[0]:r[1] for r in c.execute('select d.player_id,d.instance_id from direct_deliveries d join lore_instances i on i.instance_id=d.instance_id where i.definition_id=?',(did,))}
              # Resolve by offline-mode UUID recorded by Bukkit player files through logs is cumbersome; emit instance IDs ordered by player name below using external_delivery not available.
              print(did,*[r[0] for r in c.execute('select instance_id from lore_instances where definition_id=? order by created_at',(did,)).fetchall()])
          PY
          )
          # Delivery commands were submitted in loaded/offline/nested order, so creation order matches those actors.
          echo 'wp05accept place Wp05PurgeNested shulker' >&3
          wait_sql "(lambda r:r is not None and r[0]=='NESTED_CONTAINER')(c.execute(\"select location_type from instance_current_state where instance_id='$NESTED_IID'\").fetchone())"
          stop_bot Wp05PurgeOffline "$OFFLINE_PID"
          preview_confirm purge "$PURGE_DID" '' "$ROOT/evidence/server-initial.log"
          wait_sql "c.execute(\"select count(*) from destructive_operations where definition_id='$PURGE_DID' and operation_type='PURGE_DEFINITION'\").fetchone()[0]>=1"
          PURGE_OP="$(python3 - "$DB" <<PY
          import sqlite3
          with sqlite3.connect('$DB') as c: print(c.execute("select operation_id from destructive_operations where definition_id=? and operation_type='PURGE_DEFINITION' order by accepted_at desc limit 1",('$PURGE_DID',)).fetchone()[0])
          PY
          )"
          wait_sql "c.execute(\"select count(*) from destructive_targets where operation_id='$PURGE_OP' and state='COMPLETED'\").fetchone()[0]>=2"
          python3 - "$DB" <<PY | tee "$ROOT/evidence/case-results.txt"
          import sqlite3
          with sqlite3.connect('$DB') as c:
              op=c.execute("select state,target_count from destructive_operations where operation_id=?",('$PURGE_OP',)).fetchone(); assert op[1]==3 and op[0]=='ACTIVE',op
              assert c.execute("select lifecycle_state from lore_instances where instance_id=?",('$OFFLINE_IID',)).fetchone()[0]=='ACTIVE'
              assert c.execute("select count(*) from destructive_targets where operation_id=? and state='COMPLETED'",('$PURGE_OP',)).fetchone()[0]==2
          print('PASS ACC-DEST-002 partial: purge removed accessible loaded/nested targets but did not falsely complete with offline target')
          PY
          start_bot Wp05PurgeOffline; OFFLINE_PID=$LAST_BOT_PID
          wait_sql "(lambda r:r is not None and r[0]=='COMPLETED')(c.execute(\"select state from destructive_operations where operation_id='$PURGE_OP'\").fetchone())"
          python3 - "$DB" <<PY | tee -a "$ROOT/evidence/case-results.txt"
          import sqlite3
          with sqlite3.connect('$DB') as c:
              states=[r[0] for r in c.execute("select lifecycle_state from lore_instances where definition_id=?",('$PURGE_DID',))]; assert states==['REMOVED','REMOVED','REMOVED'] or all(x=='REMOVED' for x in states),states
              assert c.execute("select count(*) from destructive_targets where operation_id=? and state='COMPLETED'",('$PURGE_OP',)).fetchone()[0]==3
          print('PASS ACC-DEST-002: reconnect made final target accessible and purge completed every exact target')
          PY

          # DEST-003: crash the JVM with confirmed work pending on an offline holder, then restart and converge once.
          start_bot Wp05CrashBot; CRASH_PID=$LAST_BOT_PID; echo 'op Wp05CrashBot' >&3
          echo 'wp05accept source Wp05CrashBot sword' >&3; sleep 1
          echo 'wp05accept perform Wp05CrashBot loreitems create acc_crash_live Crash Purge' >&3
          wait_sql "c.execute(\"select count(*) from lore_definitions where lookup_key='acc_crash_live'\").fetchone()[0]==1"
          echo 'wp05accept perform Wp05CrashBot loreitems give acc_crash_live' >&3
          wait_sql "c.execute(\"select count(*) from direct_deliveries where state='COMPLETED'\").fetchone()[0]>=4"
          read CRASH_DID CRASH_IID < <(python3 - "$DB" <<'PY'
          import sqlite3,sys
          with sqlite3.connect(sys.argv[1]) as c:
              print(*c.execute("select definition_id,instance_id from lore_instances where definition_id=(select definition_id from lore_definitions where lookup_key='acc_crash_live') limit 1").fetchone())
          PY
          )
          stop_bot Wp05CrashBot "$CRASH_PID"
          preview_confirm purge "$CRASH_DID" '' "$ROOT/evidence/server-initial.log"
          wait_sql "c.execute(\"select count(*) from destructive_operations where definition_id='$CRASH_DID' and state='ACTIVE'\").fetchone()[0]>=1"
          CRASH_OP="$(python3 - "$DB" <<PY
          import sqlite3
          with sqlite3.connect('$DB') as c: print(c.execute("select operation_id from destructive_operations where definition_id=? order by accepted_at desc limit 1",('$CRASH_DID',)).fetchone()[0])
          PY
          )"
          crash_server
          start_server "$ROOT/evidence/server-after-crash.log"
          start_bot Wp05CrashBot; CRASH_PID=$LAST_BOT_PID
          wait_sql "(lambda r:r is not None and r[0]=='COMPLETED')(c.execute(\"select state from destructive_operations where operation_id='$CRASH_OP'\").fetchone())"
          python3 - "$DB" <<PY | tee -a "$ROOT/evidence/case-results.txt"
          import sqlite3
          with sqlite3.connect('$DB') as c:
              assert c.execute("select lifecycle_state from lore_instances where instance_id=?",('$CRASH_IID',)).fetchone()[0]=='REMOVED'
              assert c.execute("select count(*) from destructive_targets where operation_id=? and instance_id=?",('$CRASH_OP','$CRASH_IID')).fetchone()[0]==1
              assert c.execute("select state,effect_state from destructive_targets where operation_id=? and instance_id=?",('$CRASH_OP','$CRASH_IID')).fetchone()==('COMPLETED','REMOVED_OBSERVED')
          print('PASS ACC-DEST-003: hard restart resumed one durable target idempotently to one verified removal')
          PY

          # DEST-004: freeze an exact-removal preview, move the item through a real player inventory transaction, then confirm.
          start_bot Wp05MoveBot; MOVE_PID=$LAST_BOT_PID; echo 'op Wp05MoveBot' >&3
          echo 'wp05accept source Wp05MoveBot sword' >&3; sleep 1
          echo 'wp05accept perform Wp05MoveBot loreitems create acc_move_live Move Fence' >&3
          wait_sql "c.execute(\"select count(*) from lore_definitions where lookup_key='acc_move_live'\").fetchone()[0]==1"
          echo 'wp05accept perform Wp05MoveBot loreitems give acc_move_live' >&3
          wait_sql "c.execute(\"select count(*) from direct_deliveries where state='COMPLETED'\").fetchone()[0]>=5"
          read MOVE_DID MOVE_IID < <(python3 - "$DB" <<'PY'
          import sqlite3,sys
          with sqlite3.connect(sys.argv[1]) as c: print(*c.execute("select definition_id,instance_id from lore_instances where definition_id=(select definition_id from lore_definitions where lookup_key='acc_move_live') limit 1").fetchone())
          PY
          )
          OLD_PATH="$(python3 - "$DB" "$MOVE_IID" <<'PY'
          import sqlite3,sys
          with sqlite3.connect(sys.argv[1]) as c: print(c.execute('select container_path from instance_current_state where instance_id=?',(sys.argv[2],)).fetchone()[0])
          PY
          )"
          echo "loreitems remove $MOVE_DID $MOVE_IID" >&3
          for _ in $(seq 1 80); do MOVE_TOKEN="$(grep -oE 'confirm-remove [^ ]+' "$ROOT/evidence/server-after-crash.log" | tail -n1 | awk '{print $2}' || true)"; test -n "$MOVE_TOKEN" && break; sleep .25; done
          test -n "${MOVE_TOKEN:-}"
          touch "$ROOT/Wp05MoveBot.move"
          for _ in $(seq 1 80); do test -f "$ROOT/Wp05MoveBot.move.done" && break; test ! -f "$ROOT/Wp05MoveBot.move.failed" || { cat "$ROOT/Wp05MoveBot.move.failed"; exit 1; }; sleep .25; done
          test -f "$ROOT/Wp05MoveBot.move.done"
          wait_sql "(lambda r:r is not None and r[0]!='$OLD_PATH')(c.execute(\"select container_path from instance_current_state where instance_id='$MOVE_IID'\").fetchone())"
          echo "loreitems confirm-remove $MOVE_TOKEN" >&3
          wait_sql "c.execute(\"select count(*) from destructive_targets where instance_id='$MOVE_IID' and state='REVIEW_REQUIRED'\").fetchone()[0]>=1"
          echo 'wp05accept dump Wp05MoveBot' >&3; sleep 1
          grep -q "instance=$MOVE_IID" "$ROOT/evidence/server-after-crash.log"
          python3 - "$DB" <<PY | tee -a "$ROOT/evidence/case-results.txt"
          import sqlite3
          with sqlite3.connect('$DB') as c:
              assert c.execute("select lifecycle_state from lore_instances where instance_id=?",('$MOVE_IID',)).fetchone()[0]=='ACTIVE'
              t=c.execute("select state,effect_state,last_error from destructive_targets where instance_id=? order by created_at desc limit 1",('$MOVE_IID',)).fetchone(); assert t[0]=='REVIEW_REQUIRED' and t[1] in ('NONE_OBSERVED','UNKNOWN','AMBIGUOUS'),t
              assert c.execute('pragma integrity_check').fetchone()[0]=='ok'; assert c.execute('pragma foreign_key_check').fetchall()==[]
          print('PASS ACC-DEST-004: post-preview movement was revalidated and review-gated without deleting the moved item')
          PY
          stop_bot Wp05MoveBot "$MOVE_PID"; stop_bot Wp05CrashBot "$CRASH_PID"; stop_bot Wp05PurgeOffline "$OFFLINE_PID"; stop_bot Wp05PurgeNested "$NESTED_PID"; stop_bot Wp05PurgeLoaded "$LOADED_PID"
          stop_server

      - name: Upload destructive extended evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wp05-destructive-extended-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/wp05-destx/evidence/
          if-no-files-found: error
          retention-days: 30

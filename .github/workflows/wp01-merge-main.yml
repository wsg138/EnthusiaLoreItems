name: Merge current main into WP-01

on:
  push:
    branches:
      - agent/wp-01-editor-template-management

permissions:
  contents: write

jobs:
  merge-main:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Merge and reconcile routing documents
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-ff --no-commit origin/main || true
          conflicts="$(git diff --name-only --diff-filter=U)"
          if [ -n "$conflicts" ]; then
            while IFS= read -r file; do
              case "$file" in
                ai-agents/*)
                  git checkout --theirs -- "$file"
                  git add -- "$file"
                  ;;
                *)
                  echo "Unexpected non-coordination conflict: $file" >&2
                  exit 1
                  ;;
              esac
            done <<< "$conflicts"
          fi
          test -z "$(git diff --name-only --diff-filter=U)"
          rm -f .github/workflows/wp01-merge-main.yml
          git add -A
          git commit -m 'Merge current main into WP-01 branch'
          git push origin HEAD:agent/wp-01-editor-template-management

name: Apply WP-01 review remediation

on:
  push:
    branches:
      - agent/wp-01-editor-template-management

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Apply guarded review fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path_name, old, new):
              path = Path(path_name)
              source = path.read_text()
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{path_name}: expected one guarded match, found {count}')
              path.write_text(source.replace(old, new, 1))

          replace(
              'adapters-paper/src/main/java/net/enthusia/loreitems/paper/LoreItemsAdministrationCommandExecutor.java',
              '''        LoreItemsAdministrationUseCase useCase = resolveUseCase(sender);
                  if (useCase == null) {
                      return true;
                  }
                  String subcommand = parseSubcommand(sender, arguments);
                  if (subcommand == null) {
                      return true;
                  }
                  if (BROWSE_SUBCOMMAND.equals(subcommand)) {
                      executeBrowse(sender, arguments);
                      return true;
                  }
                  CommandActor actor = CommandActor.capture(sender);
          ''',
              '''        String subcommand = parseSubcommand(sender, arguments);
                  if (subcommand == null) {
                      return true;
                  }
                  if (BROWSE_SUBCOMMAND.equals(subcommand)) {
                      if (!canBrowse(sender)) {
                          sender.sendMessage("You do not have permission to browse lore-item templates.");
                          return true;
                      }
                      executeBrowse(sender, arguments);
                      return true;
                  }
                  LoreItemsAdministrationUseCase useCase = resolveEvidenceUseCase(sender);
                  if (useCase == null) {
                      return true;
                  }
                  CommandActor actor = CommandActor.capture(sender);
          ''')
          replace(
              'adapters-paper/src/main/java/net/enthusia/loreitems/paper/LoreItemsAdministrationCommandExecutor.java',
              '''    private LoreItemsAdministrationUseCase resolveUseCase(CommandSender sender) {
                  if (!sender.hasPermission(AUDIT_PERMISSION)) {
                      sender.sendMessage("You do not have permission to inspect lore-item evidence.");
                      return null;
                  }
                  LoreItemsAdministrationUseCase useCase = plugin.getServer()
                          .getServicesManager()
                          .load(LoreItemsAdministrationUseCase.class);
                  if (useCase == null) {
                      sender.sendMessage("Lore-item administration is unavailable while storage initializes.");
                  }
                  return useCase;
              }
          ''',
              '''    static boolean canBrowse(CommandSender sender) {
                  Objects.requireNonNull(sender, "sender");
                  return sender.hasPermission(AUDIT_PERMISSION)
                          || sender.hasPermission(PaperTemplateEditorManager.EDIT_PERMISSION);
              }

              private LoreItemsAdministrationUseCase resolveEvidenceUseCase(CommandSender sender) {
                  if (!sender.hasPermission(AUDIT_PERMISSION)) {
                      sender.sendMessage("You do not have permission to inspect lore-item evidence.");
                      return null;
                  }
                  LoreItemsAdministrationUseCase useCase = plugin.getServer()
                          .getServicesManager()
                          .load(LoreItemsAdministrationUseCase.class);
                  if (useCase == null) {
                      sender.sendMessage("Lore-item administration is unavailable while storage initializes.");
                  }
                  return useCase;
              }
          ''')

          replace(
              'adapters-paper/src/main/java/net/enthusia/loreitems/paper/LoreItemsCommandExecutor.java',
              '''        return topLevelCompletions(sender, arguments[0]);
              }

              static List<String> topLevelCompletions(CommandSender sender, String input) {
                  Objects.requireNonNull(sender, "sender");
                  String prefix = Objects.requireNonNull(input, "input").toLowerCase(Locale.ROOT);
                  List<String> candidates = new ArrayList<>();
                  addIfAllowed(candidates, sender, CREATE_SUBCOMMAND, "enthusia.loreitems.admin.create");
                  addIfAllowed(candidates, sender, ADOPT_SUBCOMMAND, "enthusia.loreitems.admin.adopt");
                  addIfAllowed(candidates, sender, GIVE_SUBCOMMAND, "enthusia.loreitems.admin.give");
                  addIfAllowed(candidates, sender, BROWSE_SUBCOMMAND,
                          LoreItemsAdministrationCommandExecutor.AUDIT_PERMISSION);
                  addIfAllowed(candidates, sender, ANOMALIES_SUBCOMMAND,
                          LoreItemsAdministrationCommandExecutor.AUDIT_PERMISSION);
                  addIfAllowed(candidates, sender, AUDIT_SUBCOMMAND,
                          LoreItemsAdministrationCommandExecutor.AUDIT_PERMISSION);
                  addIfAllowed(candidates, sender, RECOVERY_SUBCOMMAND,
                          LoreItemsAdministrationCommandExecutor.AUDIT_PERMISSION);
                  return candidates.stream().filter(value -> value.startsWith(prefix)).toList();
              }
          ''',
              '''        return topLevelCompletions(
                      sender, arguments[0], administrationExecutor != null);
              }

              static List<String> topLevelCompletions(CommandSender sender, String input) {
                  return topLevelCompletions(sender, input, true);
              }

              static List<String> topLevelCompletions(
                      CommandSender sender, String input, boolean administrationAvailable) {
                  Objects.requireNonNull(sender, "sender");
                  String prefix = Objects.requireNonNull(input, "input").toLowerCase(Locale.ROOT);
                  List<String> candidates = new ArrayList<>();
                  addIfAllowed(candidates, sender, CREATE_SUBCOMMAND, "enthusia.loreitems.admin.create");
                  addIfAllowed(candidates, sender, ADOPT_SUBCOMMAND, "enthusia.loreitems.admin.adopt");
                  addIfAllowed(candidates, sender, GIVE_SUBCOMMAND, "enthusia.loreitems.admin.give");
                  if (administrationAvailable) {
                      if (LoreItemsAdministrationCommandExecutor.canBrowse(sender)) {
                          candidates.add(BROWSE_SUBCOMMAND);
                      }
                      addIfAllowed(candidates, sender, ANOMALIES_SUBCOMMAND,
                              LoreItemsAdministrationCommandExecutor.AUDIT_PERMISSION);
                      addIfAllowed(candidates, sender, AUDIT_SUBCOMMAND,
                              LoreItemsAdministrationCommandExecutor.AUDIT_PERMISSION);
                      addIfAllowed(candidates, sender, RECOVERY_SUBCOMMAND,
                              LoreItemsAdministrationCommandExecutor.AUDIT_PERMISSION);
                  }
                  return candidates.stream().filter(value -> value.startsWith(prefix)).toList();
              }
          ''')

          replace(
              'adapters-paper/src/main/java/net/enthusia/loreitems/paper/PaperTemplateRevisionPlannerWorker.java',
              '''        stage.whenComplete(this::discovered);
              }
          ''',
              '''        stage.whenComplete((page, failure) ->
                      dispatchContinuation(() -> discovered(page, failure)));
              }
          ''')
          replace(
              'adapters-paper/src/main/java/net/enthusia/loreitems/paper/PaperTemplateRevisionPlannerWorker.java',
              '''        stage.whenComplete((result, throwable) -> scheduled(result, throwable));
              }

              private void scheduled(TemplateRevisionRolloutBatchResult result, Throwable failure) {
          ''',
              '''        stage.whenComplete((result, throwable) ->
                      dispatchContinuation(() -> scheduled(result, throwable)));
              }

              private void dispatchContinuation(Runnable continuation) {
                  if (closed) {
                      inFlight.set(false);
                      return;
                  }
                  try {
                      plugin.getServer().getScheduler().runTask(plugin, () -> {
                          if (closed) {
                              inFlight.set(false);
                              return;
                          }
                          continuation.run();
                      });
                  } catch (RuntimeException exception) {
                      inFlight.set(false);
                      plugin.getLogger().log(
                              Level.FINE,
                              "Could not resume template rollout planning during shutdown.",
                              exception);
                  }
              }

              private void scheduled(TemplateRevisionRolloutBatchResult result, Throwable failure) {
          ''')

          replace(
              'application/src/main/java/net/enthusia/loreitems/application/TemplateRevisionRolloutStore.java',
              '''    default CompletionStage<TemplateRevisionStartResult> startConfirmed(
                      TemplateRevisionConfirmation confirmation) {
                  return start(
                          confirmation.newRevision(),
                          confirmation.expectedCurrentRevision(),
                          confirmation.auditEvent(),
                          confirmation.initialBatchLimit());
              }
          ''',
              '''    CompletionStage<TemplateRevisionStartResult> startConfirmed(
                      TemplateRevisionConfirmation confirmation);
          ''')
          replace(
              'application/src/test/java/net/enthusia/loreitems/application/PersistingTemplateRevisionRolloutUseCaseTest.java',
              '''        public CompletionStage<TemplateRevisionStartResult> startConfirmed(
                      TemplateRevisionConfirmation confirmed) {
                  confirmation = confirmed;
                  return TemplateRevisionRolloutStore.super.startConfirmed(confirmed);
              }
          ''',
              '''        public CompletionStage<TemplateRevisionStartResult> startConfirmed(
                      TemplateRevisionConfirmation confirmed) {
                  confirmation = confirmed;
                  return start(
                          confirmed.newRevision(),
                          confirmed.expectedCurrentRevision(),
                          confirmed.auditEvent(),
                          confirmed.initialBatchLimit());
              }
          ''')

          replace(
              'plugin/src/main/java/net/enthusia/loreitems/plugin/LoreItemsPlugin.java',
              '''            warningWorker.start();
                      anomalyListener.start();
                      planner.start();
                      anomalyWarningWorker = warningWorker;
                      identityAnomalyListener = anomalyListener;
                      templateRevisionPlannerWorker = planner;
                      getLogger().info(
                              "Lore-item anomaly detection, warnings, and administration are active.");
          ''',
              '''            activateAdministrationWorkers(warningWorker, anomalyListener, planner);
          ''')
          replace(
              'plugin/src/main/java/net/enthusia/loreitems/plugin/LoreItemsPlugin.java',
              '''    private void registerAdministrationServices(
          ''',
              '''    private void activateAdministrationWorkers(
                      PaperAnomalyWarningWorker warningWorker,
                      PaperIdentityAnomalyListener anomalyListener,
                      PaperTemplateRevisionPlannerWorker planner) {
                  warningWorker.start();
                  anomalyListener.start();
                  planner.start();
                  anomalyWarningWorker = warningWorker;
                  identityAnomalyListener = anomalyListener;
                  templateRevisionPlannerWorker = planner;
                  getLogger().info(
                          "Lore-item anomaly detection, warnings, and administration are active.");
              }

              private void registerAdministrationServices(
          ''')

          replace(
              'adapters-paper/src/test/java/net/enthusia/loreitems/paper/PaperTemplateRevisionPlannerWorkerTest.java',
              '''            server.getScheduler().performOneTick();
                      server.getScheduler().performOneTick();
                      server.getScheduler().performOneTick();
          ''',
              '''            for (int tick = 0; tick < 8; tick++) {
                          server.getScheduler().performOneTick();
                      }
          ''')
          replace(
              'adapters-paper/src/test/java/net/enthusia/loreitems/paper/PaperTemplateRevisionPlannerWorkerTest.java',
              '''            useCase.discovery.complete(emptyPage());
                      worker.requestRun();
                      assertEquals(2, useCase.listCalls);
          ''',
              '''            useCase.discovery.complete(emptyPage());
                      worker.requestRun();
                      assertEquals(1, useCase.listCalls);
                      server.getScheduler().performOneTick();
                      worker.requestRun();
                      assertEquals(2, useCase.listCalls);
          ''')
          PY
      - name: Run focused regression tests
        run: >-
          ./gradlew --no-daemon
          :application:test --tests net.enthusia.loreitems.application.PersistingTemplateRevisionRolloutUseCaseTest
          :adapters-paper:test --tests net.enthusia.loreitems.paper.LoreItemsCommandCompletionTest
          --tests net.enthusia.loreitems.paper.PaperTemplateRevisionPlannerWorkerTest
      - name: Run full verification
        run: ./gradlew --no-daemon clean check
      - name: Commit verified remediation
        shell: bash
        run: |
          rm -f .github/workflows/wp01-fix-final-complexity.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: resolve WP-01 review findings'
          git push origin HEAD:agent/wp-01-editor-template-management

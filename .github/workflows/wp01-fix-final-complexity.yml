          Path('adapters-paper/src/test/java/net/enthusia/loreitems/paper/LoreItemsCommandCompletionTest.java').write_text(r'''package net.enthusia.loreitems.paper;

import static org.junit.jupiter.api.Assertions.assertEquals;

import java.util.List;
import java.util.concurrent.CompletableFuture;
import java.util.concurrent.CompletionStage;
import net.enthusia.loreitems.application.AdoptHeldItemUseCase;
import net.enthusia.loreitems.application.PrepareHeldItemAdoptionRequest;

name: Temporary CI diagnostic comment

on:
  pull_request:

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Post failed verification excerpt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: 30868215670
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          headers=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          curl -fsSL "${headers[@]}" "${api}/actions/runs/${RUN_ID}/logs" -o logs.zip
          unzip -q logs.zip -d logs
          excerpt="$(grep -R -n -E "error:|FAILURE:|FAILED|What went wrong|Compilation failed" logs | head -n 80 || true)"
          if [ -z "$excerpt" ]; then
            excerpt="$(find logs -type f -maxdepth 2 -exec tail -n 160 {} \; | tail -n 160)"
          fi
          body="$(printf 'TEMPORARY CI DIAGNOSTIC\n\n```text\n%s\n```' "$excerpt")"
          jq -n --arg body "$body" '{body:$body}' > comment.json
          curl -fsSL -X POST "${headers[@]}" \
            "${api}/issues/${PR_NUMBER}/comments" \
            --data-binary @comment.json

name: WP-05 Protection Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: wp05-protection-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dropped-protection-void:
    if: github.event.pull_request.number == 18
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PAPER_URL: https://fill-data.papermc.io/v1/objects/e708e8c132dc143ffd73528cccb9532e2eb17628b1a0eee74469bf466c7003f8/paper-1.21.11-116.jar
      PAPER_SHA256: e708e8c132dc143ffd73528cccb9532e2eb17628b1a0eee74469bf466c7003f8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.14.3'
      - name: Build fixed head and protocol client
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :plugin:shadowJar -PreleaseVersion=1.0.0-rc.1
          mkdir -p /tmp/wp05-prot/server/plugins /tmp/wp05-prot/evidence /tmp/wp05-prot/bot
          JAR="$(find plugin/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' | head -n1)"
          cp "$JAR" /tmp/wp05-prot/server/plugins/EnthusiaLoreItems.jar
          sha256sum "$JAR" > /tmp/wp05-prot/evidence/plugin-sha256.txt
          cd /tmp/wp05-prot/server
          curl -fsSL "$PAPER_URL" -o paper.jar
          echo "$PAPER_SHA256  paper.jar" | sha256sum -c -
          printf 'eula=true\n' > eula.txt
          cat > server.properties <<'EOF'
          online-mode=false
          enforce-secure-profile=false
          spawn-protection=0
          white-list=false
          server-port=25565
          motd=WP05 protection diagnostic
          EOF
          cd /tmp/wp05-prot/bot
          npm init -y >/dev/null
          npm install --save-exact mineflayer@4.35.0 >/tmp/wp05-prot/evidence/npm-install.log 2>&1
          cat > bot.js <<'EOF'
          const mineflayer=require('mineflayer'),fs=require('fs')
          const sleep=ms=>new Promise(r=>setTimeout(r,ms)),root='/tmp/wp05-prot',log=`${root}/evidence/bot.log`
          const say=x=>{fs.appendFileSync(log,`${new Date().toISOString()} ${x}\n`);console.log(x)}
          let msgs=[];const bot=mineflayer.createBot({host:'127.0.0.1',port:25565,username:'Wp05ProtBot',version:'1.21.11',auth:'offline'})
          bot.on('message',m=>{const t=m.toString();msgs.push(t);say(`CHAT ${t}`)});bot.on('error',e=>say(`ERROR ${e.stack||e}`))
          async function waitFile(p){for(let i=0;i<300;i++){if(fs.existsSync(p))return;await sleep(100)}throw new Error('file '+p)}
          async function waitMsg(s){for(let i=0;i<300;i++){if(msgs.some(x=>x.includes(s)))return;await sleep(100)}throw new Error('msg '+s)}
          bot.once('spawn',async()=>{try{
            say(`SPAWN ${bot.player.uuid}`);fs.writeFileSync(`${root}/ready`,'ok\n');await waitFile(`${root}/go-create`)
            for(let i=0;i<150;i++){const s=bot.inventory.items().find(x=>x.name==='diamond_sword');if(s){if(s.slot>=36&&s.slot<=44)bot.setQuickBarSlot(s.slot-36);await sleep(300);if(bot.heldItem?.name==='diamond_sword')break}await sleep(100)}
            if(bot.heldItem?.name!=='diamond_sword')throw new Error('no source sword')
            bot.chat('/loreitems create acc_protection Protection Diagnostic');await waitMsg("Created lore definition 'acc_protection' from the held item.");fs.writeFileSync(`${root}/created`,'ok\n');await waitFile(`${root}/go-delivery`)
            await waitMsg('A queued lore item was delivered to your inventory.');await sleep(1000)
            const sword=bot.inventory.items().find(x=>x.name==='diamond_sword');if(!sword)throw new Error('no tracked sword after delivery')
            await bot.tossStack(sword);say('TOSSED_TRACKED_SWORD');fs.writeFileSync(`${root}/dropped`,'ok\n');await sleep(1000);bot.quit('drop complete')
          }catch(e){say(`FAIL ${e.stack||e}`);fs.writeFileSync(`${root}/dropped`,'fail\n');bot.quit('fail');process.exitCode=1}})
          EOF
      - name: Exercise protected damage despawn and intentional void
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/wp05-prot/server
          LOG=/tmp/wp05-prot/evidence/server.log
          rm -f server.stdin; mkfifo server.stdin; exec 3<>server.stdin
          java -Xms512M -Xmx1536M -Dpaper.disablePluginRemapping=true -jar paper.jar --nogui <server.stdin >"$LOG" 2>&1 & SERVER_PID=$!
          for _ in $(seq 1 180); do
            grep -q 'Queued direct-delivery processing is active.' "$LOG" && break
            kill -0 "$SERVER_PID" 2>/dev/null || { cat "$LOG"; exit 1; }
            sleep 1
          done
          grep -q 'Queued direct-delivery processing is active.' "$LOG"

          (cd /tmp/wp05-prot/bot && node bot.js) >/tmp/wp05-prot/evidence/bot-stdout.log 2>&1 & BOT_PID=$!
          for _ in $(seq 1 60); do test -f /tmp/wp05-prot/ready && break; sleep 1; done
          grep -qx ok /tmp/wp05-prot/ready
          echo 'op Wp05ProtBot' >&3
          echo 'give Wp05ProtBot minecraft:diamond_sword 1' >&3
          sleep 2; touch /tmp/wp05-prot/go-create
          for _ in $(seq 1 60); do test -f /tmp/wp05-prot/created && break; sleep 1; done
          grep -qx ok /tmp/wp05-prot/created
          echo 'clear Wp05ProtBot minecraft:diamond_sword' >&3
          sleep 2
          echo 'loreitems give acc_protection Wp05ProtBot' >&3
          touch /tmp/wp05-prot/go-delivery
          for _ in $(seq 1 90); do test -f /tmp/wp05-prot/dropped && break; sleep 1; done
          grep -qx ok /tmp/wp05-prot/dropped
          wait "$BOT_PID"

          # Bind every subsequent assertion to the exact dropped item entity and prevent movement.
          echo 'tag @e[type=item,sort=nearest,limit=1] add wp05prot' >&3
          echo 'data merge entity @e[type=item,tag=wp05prot,limit=1] {NoGravity:1b,PickupDelay:32767s,Age:0s}' >&3
          sleep 2
          echo 'execute unless entity @e[type=item,tag=wp05prot,limit=1] run say WP05_TAGGING_FAILED' >&3
          sleep 1
          ! grep -q 'WP05_TAGGING_FAILED' "$LOG"

          echo 'setblock 0 100 0 minecraft:netherrack' >&3
          echo 'setblock 0 101 0 minecraft:fire' >&3
          echo 'tp @e[type=item,tag=wp05prot,limit=1] 0 101 0' >&3
          sleep 3
          echo 'execute unless entity @e[type=item,tag=wp05prot,limit=1] run say WP05_MISSING_AFTER_FIRE' >&3

          echo 'setblock 0 101 0 minecraft:air' >&3
          echo 'setblock 5 101 0 minecraft:lava' >&3
          echo 'tp @e[type=item,tag=wp05prot,limit=1] 5 101 0' >&3
          sleep 3
          echo 'execute unless entity @e[type=item,tag=wp05prot,limit=1] run say WP05_MISSING_AFTER_LAVA' >&3

          echo 'setblock 5 101 0 minecraft:air' >&3
          echo 'tp @e[type=item,tag=wp05prot,limit=1] 10 101 0' >&3
          echo 'damage @e[type=item,tag=wp05prot,limit=1] 100 minecraft:explosion' >&3
          sleep 2
          echo 'execute unless entity @e[type=item,tag=wp05prot,limit=1] run say WP05_MISSING_AFTER_EXPLOSION' >&3

          echo 'damage @e[type=item,tag=wp05prot,limit=1] 5 minecraft:cactus' >&3
          sleep 2
          echo 'execute unless entity @e[type=item,tag=wp05prot,limit=1] run say WP05_MISSING_AFTER_CACTUS' >&3

          echo 'data merge entity @e[type=item,tag=wp05prot,limit=1] {Age:5999s}' >&3
          sleep 3
          echo 'execute unless entity @e[type=item,tag=wp05prot,limit=1] run say WP05_MISSING_AFTER_DESPAWN' >&3
          sleep 1
          for marker in FIRE LAVA EXPLOSION CACTUS DESPAWN; do
            if grep -q "WP05_MISSING_AFTER_$marker" "$LOG"; then
              echo "tracked item lost after $marker" >&2
              exit 1
            fi
          done

          # Release only the tagged tracked entity into the void and wait for durable terminalization.
          echo 'data merge entity @e[type=item,tag=wp05prot,limit=1] {NoGravity:0b,Age:0s}' >&3
          echo 'tp @e[type=item,tag=wp05prot,limit=1] 0 -100 0' >&3
          void_done=false
          for _ in $(seq 1 60); do
            if python3 - <<'PY'
          import sqlite3, sys
          con = sqlite3.connect('plugins/EnthusiaLoreItems/loreitems.db')
          row = con.execute("SELECT lifecycle_state FROM lore_instances").fetchone()
          con.close()
          sys.exit(0 if row and row[0] == 'VOID_DESTROYED' else 1)
          PY
            then
              void_done=true
              break
            fi
            sleep 1
          done
          test "$void_done" = true

          python3 - <<'PY'
          import json, sqlite3
          con=sqlite3.connect('plugins/EnthusiaLoreItems/loreitems.db');con.row_factory=sqlite3.Row
          ev={
            'instances':[dict(r) for r in con.execute('select instance_id,lifecycle_state,terminal_at from lore_instances')],
            'current':[dict(r) for r in con.execute('select state,location_type,confidence from instance_current_state')],
            'void_mutations':[dict(r) for r in con.execute("select mutation_type,state,attempt_count from pending_mutations where mutation_type='VOID_TERMINAL_LOSS'")],
            'integrity':[r[0] for r in con.execute('pragma integrity_check')],
            'foreign_keys':[list(r) for r in con.execute('pragma foreign_key_check')]
          }
          con.close()
          open('/tmp/wp05-prot/evidence/database.json','w').write(json.dumps(ev,indent=2,sort_keys=True)+'\n')
          assert len(ev['instances'])==1 and ev['instances'][0]['lifecycle_state']=='VOID_DESTROYED',ev
          assert ev['current'] and ev['current'][0]['state']=='TERMINAL_VOID' and ev['current'][0]['location_type']=='VOID_DESTROYED',ev
          assert len(ev['void_mutations'])==1 and ev['void_mutations'][0]['state']=='COMPLETED',ev
          assert ev['integrity']==['ok'] and not ev['foreign_keys'],ev
          PY
          echo 'execute if entity @e[type=item,tag=wp05prot,limit=1] run say WP05_ITEM_REMAINED_AFTER_VOID' >&3
          sleep 2
          ! grep -q 'WP05_ITEM_REMAINED_AFTER_VOID' "$LOG"
          echo stop >&3
          wait "$SERVER_PID"
          exec 3>&-
          rm -f server.stdin
          cat >/tmp/wp05-prot/evidence/diagnostic-metadata.txt <<EOF
          acceptance_credit=NONE
          diagnostic=ENVIRONMENTAL_PROTECTION_AND_VOID
          reason=offline-authenticated Java client; defect-discovery only
          source_commit=${{ github.event.pull_request.head.sha || github.sha }}
          EOF
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wp05-protection-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: /tmp/wp05-prot/evidence/

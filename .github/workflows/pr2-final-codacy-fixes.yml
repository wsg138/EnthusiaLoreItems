name: Apply final PR 2 Codacy fixes

on:
  push:
    branches:
      - agent/loreitems-pr1-foundation

permissions:
  contents: write

jobs:
  fix-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/loreitems-pr1-foundation
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.14.3'

      - name: Apply exact retrieved findings
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('adapters-sqlite/src/test/java/net/enthusia/loreitems/sqlite/SQLiteDefinitionRepositoryTest.java'): (
                  '''        private final String statementText;

                  SqlFixture(String statementText) {
                      this.statementText = statementText;
                  }

                  String statementText() {
                      return statementText;
                  }''',
                  '''        private final String sqlText;

                  SqlFixture(String sqlText) {
                      this.sqlText = sqlText;
                  }

                  String statementText() {
                      return sqlText;
                  }'''),
              Path('adapters-sqlite/src/test/java/net/enthusia/loreitems/sqlite/SQLiteDeletedDefinitionMarkerRepositoryTest.java'): (
                  '''        private final String statementText;

                  MarkerMutation(String statementText) {
                      this.statementText = statementText;
                  }

                  String statementText() {
                      return statementText;
                  }''',
                  '''        private final String sqlText;

                  MarkerMutation(String sqlText) {
                      this.sqlText = sqlText;
                  }

                  String statementText() {
                      return sqlText;
                  }'''),
              Path('adapters-sqlite/src/test/java/net/enthusia/loreitems/sqlite/SQLiteDirectDeliveryRepositoryTest.java'): (
                  '''        private final String statementText;

                  CountTable(String statementText) {
                      this.statementText = statementText;
                  }

                  String statementText() {
                      return statementText;
                  }''',
                  '''        private final String sqlText;

                  CountTable(String sqlText) {
                      this.sqlText = sqlText;
                  }

                  String statementText() {
                      return sqlText;
                  }'''),
          }

          for path, (before, after) in replacements.items():
              text = path.read_text(encoding='utf-8')
              if text.count(before) != 1:
                  raise SystemExit(f'Expected one exact replacement in {path}, found {text.count(before)}')
              path.write_text(text.replace(before, after), encoding='utf-8')

          anomaly = Path('domain/src/main/java/net/enthusia/loreitems/domain/InstanceAnomaly.java')
          text = anomaly.read_text(encoding='utf-8')
          before = '''            case RESOLVED -> validateResolvedMetadata(resolvedAtEpochMillis, resolutionDetail);
              }
          }'''
          after = '''            case RESOLVED -> validateResolvedMetadata(resolvedAtEpochMillis, resolutionDetail);
                  default -> throw new IllegalStateException("Unsupported anomaly status: " + status);
              }
          }'''
          if text.count(before) != 1:
              raise SystemExit(f'Expected one exact switch replacement, found {text.count(before)}')
          anomaly.write_text(text.replace(before, after), encoding='utf-8')
          PY

          rm -f .github/workflows/codacy-final-doc-evidence.yml
          rm -f .github/workflows/pr2-final-codacy-fixes.yml

      - name: Run full verification
        run: gradle --no-daemon clean check --rerun-tasks

      - name: Commit and push focused fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            adapters-sqlite/src/test/java/net/enthusia/loreitems/sqlite/SQLiteDefinitionRepositoryTest.java \
            adapters-sqlite/src/test/java/net/enthusia/loreitems/sqlite/SQLiteDeletedDefinitionMarkerRepositoryTest.java \
            adapters-sqlite/src/test/java/net/enthusia/loreitems/sqlite/SQLiteDirectDeliveryRepositoryTest.java \
            domain/src/main/java/net/enthusia/loreitems/domain/InstanceAnomaly.java \
            .github/workflows/codacy-final-doc-evidence.yml \
            .github/workflows/pr2-final-codacy-fixes.yml
          git diff --cached --check
          git commit -m 'resolve final Codacy findings'
          git push origin HEAD:agent/loreitems-pr1-foundation

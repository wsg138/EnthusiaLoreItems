name: Codacy PR diagnostics

on:
  push:
    branches:
      - fix/full-plugin-deep-review

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Report new Codacy findings
        env:
          CODACY_ISSUES_URL: https://api.codacy.com/api/v3/analysis/organizations/gh/wsg138/repositories/EnthusiaLoreItems/pull-requests/30/issues?status=new&limit=100
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request

          url = os.environ["CODACY_ISSUES_URL"]
          for attempt in range(12):
              with urllib.request.urlopen(url, timeout=30) as response:
                  payload = json.load(response)
              issues = payload.get("data", [])
              if issues:
                  break
              if attempt == 11:
                  raise SystemExit("Codacy returned no new PR issues")
              time.sleep(10)

          print(f"CODACY_NEW_ISSUES={len(issues)}")
          for issue in issues:
              detail = issue.get("commitIssue", {})
              pattern = detail.get("patternInfo", {})
              tool = detail.get("toolInfo", {})
              safe = {
                  "issueId": issue.get("issueId"),
                  "tool": tool.get("name"),
                  "pattern": pattern.get("id"),
                  "title": pattern.get("title"),
                  "category": pattern.get("category"),
                  "level": pattern.get("level"),
                  "severity": pattern.get("severityLevel"),
                  "filePath": detail.get("filePath"),
                  "lineNumber": detail.get("lineNumber"),
                  "message": detail.get("message"),
              }
              print(json.dumps(safe, sort_keys=True))
          PY

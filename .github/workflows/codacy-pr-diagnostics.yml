name: Apply checklist Markdown rule

on:
  push:
    branches:
      - fix/full-plugin-deep-review

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'ci apply checklist markdown rule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/full-plugin-deep-review

      - name: Configure duplicate headings by sibling scope
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/manual-live-testing-checklist.md')
          text = path.read_text()
          title = '# EnthusiaLoreItems manual staging/live testing checklist\n'
          directive = '<!-- markdownlint-configure-file { "MD024": { "siblings_only": true } } -->\n'
          if not text.startswith(title):
              raise SystemExit('manual checklist title changed unexpectedly')
          if directive not in text:
              text = text.replace(title, title + '\n' + directive, 1)
          text = text.replace('### ACC-ID-001 steps', '### Steps', 1)
          text = text.replace('### ACC-ID-001 pass criteria', '### PASS', 1)
          path.write_text(text)
          PY

          git diff --check
          git diff -- docs/manual-live-testing-checklist.md

      - name: Commit checklist rule
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/manual-live-testing-checklist.md
          git commit -m 'docs: scope repeated checklist headings by section'
          git push origin HEAD:fix/full-plugin-deep-review

name: Export final PR 2 source bundle

on:
  pull_request:

permissions:
  contents: read

jobs:
  export:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Package source
        run: |
          tar \
            --exclude=.git \
            --exclude='*/build' \
            --exclude='*/.gradle' \
            -czf /tmp/enthusia-lore-items-source.tar.gz .

      - name: Upload source bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr2-final-source-${{ github.event.pull_request.head.sha }}
          path: /tmp/enthusia-lore-items-source.tar.gz
          if-no-files-found: error
          retention-days: 1

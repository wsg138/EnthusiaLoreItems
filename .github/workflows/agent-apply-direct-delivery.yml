name: Apply direct-delivery implementation

on:
  push:
    branches:
      - agent/loreitems-pr2-creation-delivery-protection

permissions:
  contents: write

concurrency:
  group: apply-direct-delivery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Apply reviewed patch
        shell: bash
        run: |
          printf '%s' '[... ELLIPSIZATION ...]' | base64 --decode | gzip --decompress > /tmp/direct-delivery.patch
          git apply --check /tmp/direct-delivery.patch
          git apply /tmp/direct-delivery.patch
          rm .github/workflows/agent-apply-direct-delivery.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'implement durable direct delivery and recovery'
          git push origin HEAD:${{ github.ref_name }}

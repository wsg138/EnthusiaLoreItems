name: Temporary Codacy diagnostics

on:
  pull_request:

permissions:
  contents: read
  checks: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Print exact-head Codacy checks and annotations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ebee6166290aac96b7f1d52a9aaee7fcbc15b382
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          headers=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          checks="$(curl -fsSL "${headers[@]}" "${api}/commits/${TARGET_SHA}/check-runs?per_page=100")"
          echo "$checks" | jq '{total_count, check_runs: [.check_runs[] | {id, name, status, conclusion, started_at, completed_at, output}]}'
          echo "$checks" | jq -r '.check_runs[] | select(.name | ascii_downcase | contains("codacy")) | .id' | while read -r check_id; do
            [ -n "$check_id" ] || continue
            page=1
            while :; do
              annotations="$(curl -fsSL "${headers[@]}" "${api}/check-runs/${check_id}/annotations?per_page=100&page=${page}")"
              count="$(echo "$annotations" | jq 'length')"
              echo "Codacy annotations page ${page} (${count})"
              echo "$annotations" | jq '.'
              [ "$count" -lt 100 ] && break
              page=$((page + 1))
            done
          done

name: Codacy diagnostics

on:
  pull_request:

permissions:
  contents: read
  checks: read

jobs:
  annotations:
    runs-on: ubuntu-latest
    steps:
      - name: Print exact-head Codacy annotations
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          check_id=""
          for attempt in $(seq 1 60); do
            response="$(curl --fail-with-body --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPOSITORY}/commits/${HEAD_SHA}/check-runs?per_page=100")"
            check_id="$(jq -r '[.check_runs[] | select((.name | ascii_downcase | contains("codacy")) and .status == "completed")] | sort_by(.completed_at) | last | .id // empty' <<<"${response}")"
            if [[ -n "${check_id}" ]]; then
              break
            fi
            sleep 10
          done
          if [[ -z "${check_id}" ]]; then
            echo "No completed Codacy check run was found for ${HEAD_SHA}." >&2
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/check-runs/${check_id}" \
            | jq '{id, name, status, conclusion, output: {title: .output.title, summary: .output.summary, text: .output.text}}'

          page=1
          while true; do
            annotations="$(curl --fail-with-body --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPOSITORY}/check-runs/${check_id}/annotations?per_page=100&page=${page}")"
            count="$(jq 'length' <<<"${annotations}")"
            jq -r '.[] | [.path, (.start_line | tostring), .annotation_level, (.title // ""), .message] | @tsv' <<<"${annotations}"
            if [[ "${count}" -lt 100 ]]; then
              break
            fi
            page=$((page + 1))
          done

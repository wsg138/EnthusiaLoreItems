name: Temporary Codacy diagnostics

on:
  pull_request:

permissions:
  contents: read
  checks: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Print exact-head Codacy checks and annotations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          headers=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          codacy='[]'
          for attempt in $(seq 1 60); do
            checks="$(curl -fsSL "${headers[@]}" "${api}/commits/${TARGET_SHA}/check-runs?per_page=100")"
            codacy="$(echo "$checks" | jq -c '[.check_runs[] | select(.name | ascii_downcase | contains("codacy"))]')"
            if [ "$(echo "$codacy" | jq 'length')" -gt 0 ] \
              && [ "$(echo "$codacy" | jq '[.[] | select(.status != "completed")] | length')" -eq 0 ]; then
              break
            fi
            sleep 15
          done
          echo "$codacy" | jq '[.[] | {id, name, status, conclusion, started_at, completed_at, output}]'
          echo "$codacy" | jq -r '.[].id' | while read -r check_id; do
            page=1
            while :; do
              annotations="$(curl -fsSL "${headers[@]}" "${api}/check-runs/${check_id}/annotations?per_page=100&page=${page}")"
              echo "$annotations" | jq '[.[] | {path, start_line, end_line, message, title, raw_details}]'
              [ "$(echo "$annotations" | jq 'length')" -lt 100 ] && break
              page=$((page + 1))
            done
          done

name: Temporary Codacy diagnostics

on:
  pull_request:

permissions:
  contents: read
  checks: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Print Codacy annotations from previous exact head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHECK_ID: 91859835850
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          headers=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          page=1
          total=0
          while :; do
            annotations="$(curl -fsSL "${headers[@]}" "${api}/check-runs/${CHECK_ID}/annotations?per_page=100&page=${page}")"
            page_count="$(echo "$annotations" | jq 'length')"
            total=$((total + page_count))
            echo "$annotations" | jq '[.[] | {path, start_line, end_line, annotation_level, message, title, raw_details}]'
            [ "$page_count" -lt 100 ] && break
            page=$((page + 1))
          done
          echo "Codacy annotations: ${total}"

name: Apply remaining Codacy remediation

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/loreitems-pr1-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Apply reviewed remediation
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          cat .github/codacy48.patch.00 .github/codacy48.patch.01 \
            | base64 --decode \
            | gzip --decompress \
            > "$RUNNER_TEMP/codacy48.patch"
          git apply --check "$RUNNER_TEMP/codacy48.patch"
          git apply "$RUNNER_TEMP/codacy48.patch"
          rm .github/codacy48.patch.00 \
             .github/codacy48.patch.01 \
             .github/workflows/apply-codacy48-remediation.yml \
             .github/workflows/codacy-target2-evidence.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "resolve remaining Codacy findings"
          git push origin "HEAD:${HEAD_BRANCH}"

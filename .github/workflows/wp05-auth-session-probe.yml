name: WP-05 Authenticated Session Probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: wp05-auth-session-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  authenticated-sessions:
    if: github.event.pull_request.number == 18
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PAPER_URL: https://fill-data.papermc.io/v1/objects/e708e8c132dc143ffd73528cccb9532e2eb17628b1a0eee74469bf466c7003f8/paper-1.21.11-116.jar
      PAPER_SHA256: e708e8c132dc143ffd73528cccb9532e2eb17628b1a0eee74469bf466c7003f8
      USER_AGENT: EnthusiaLoreItems-WP05/1.0 (https://github.com/wsg138/EnthusiaLoreItems)
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Build fixed PR-head plugin
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :plugin:shadowJar -PreleaseVersion=1.0.0-rc.1
          FIXED_JAR="$(find plugin/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' | head -n 1)"
          test -n "$FIXED_JAR"
          mkdir -p /tmp/wp05-auth/server/plugins /tmp/wp05-auth/evidence /tmp/wp05-auth/client
          cp "$FIXED_JAR" /tmp/wp05-auth/server/plugins/EnthusiaLoreItems.jar
          sha256sum "$FIXED_JAR" > /tmp/wp05-auth/evidence/fixed-plugin-sha256.txt
          printf '%s\n' "${{ github.event.pull_request.head.sha || github.sha }}" > /tmp/wp05-auth/evidence/source-head.txt

      - name: Prepare online Paper Geyser Floodgate environment
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/wp05-auth/server
          curl -fsSL -A "$USER_AGENT" "$PAPER_URL" -o paper.jar
          echo "$PAPER_SHA256  paper.jar" | sha256sum -c -
          curl -fsSL -A "$USER_AGENT" https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest/downloads/spigot -o plugins/Geyser-Spigot.jar
          curl -fsSL -A "$USER_AGENT" https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/spigot -o plugins/floodgate-spigot.jar
          curl -fsSL -A "$USER_AGENT" https://api.github.com/repos/ViaVersion/ViaVersion/releases/latest -o /tmp/wp05-auth/evidence/viaversion-release.json
          VV_URL="$(jq -r '[.assets[] | select(.name | test("^ViaVersion.*\\.jar$"))][0].browser_download_url // empty' /tmp/wp05-auth/evidence/viaversion-release.json)"
          test -n "$VV_URL"
          curl -fsSL -A "$USER_AGENT" "$VV_URL" -o plugins/ViaVersion.jar
          printf 'eula=true\n' > eula.txt
          cat > server.properties <<'EOF'
          online-mode=true
          enforce-secure-profile=false
          spawn-protection=0
          white-list=false
          server-port=25565
          motd=WP05 authenticated acceptance probe
          EOF

          rm -f server.stdin
          mkfifo server.stdin
          exec 3<>server.stdin
          java -Xms512M -Xmx1536M -Dpaper.disablePluginRemapping=true -jar paper.jar --nogui < server.stdin > /tmp/wp05-auth/evidence/prep.log 2>&1 &
          PID=$!
          ready=false
          for _ in $(seq 1 240); do
            if grep -q 'For help, type "help"' /tmp/wp05-auth/evidence/prep.log; then ready=true; break; fi
            kill -0 "$PID" 2>/dev/null || { cat /tmp/wp05-auth/evidence/prep.log; exit 1; }
            sleep 1
          done
          test "$ready" = true
          echo stop >&3
          wait "$PID"
          exec 3>&-
          rm -f server.stdin

          python3 - <<'PY'
          from pathlib import Path
          import re

          geyser = Path('plugins/Geyser-Spigot/config.yml')
          text = geyser.read_text(encoding='utf-8')
          text, count = re.subn(r'(?m)^(\s*auth-type:\s*).+$', r'\1floodgate', text, count=1)
          assert count == 1
          text, count = re.subn(r'(?m)^(\s*validate-bedrock-login:\s*).+$', r'\1true', text, count=1)
          assert count == 1
          geyser.write_text(text, encoding='utf-8')

          floodgate = Path('plugins/floodgate/config.yml')
          text = floodgate.read_text(encoding='utf-8')
          text, count = re.subn(r'(?m)^(\s*username-prefix:\s*).+$', r'\1"*"', text, count=1)
          assert count == 1
          floodgate.write_text(text, encoding='utf-8')
          PY
          cp plugins/Geyser-Spigot/config.yml /tmp/wp05-auth/evidence/geyser-config.yml
          cp plugins/floodgate/config.yml /tmp/wp05-auth/evidence/floodgate-config.yml
          sha256sum paper.jar plugins/*.jar > /tmp/wp05-auth/evidence/artifact-sha256.txt

      - name: Install authenticated protocol clients
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/wp05-auth/client
          npm init -y >/dev/null
          npm install --save-exact minecraft-protocol@1.66.2 bedrock-protocol@3.56.1 > /tmp/wp05-auth/evidence/npm-install.log 2>&1
          npm list --depth=0 > /tmp/wp05-auth/evidence/npm-list.txt

          cat > java-auth.js <<'EOF'
          const mc = require('minecraft-protocol')
          const fs = require('fs')
          const { execFileSync } = require('child_process')
          const pr = process.env.PR_NUMBER
          const log = line => {
            fs.appendFileSync('/tmp/wp05-auth/evidence/java-client.log', `${new Date().toISOString()} ${line}\n`)
            console.log(line)
          }
          const comment = body => {
            try {
              execFileSync('gh', ['api', `repos/${process.env.GITHUB_REPOSITORY}/issues/${pr}/comments`, '-f', `body=${body}`], { stdio: 'ignore' })
            } catch (error) {
              log(`COMMENT_FAILED ${error.message}`)
            }
          }
          const client = mc.createClient({
            host: '127.0.0.1',
            port: 25565,
            version: '1.21.11',
            username: 'wp05-java-acceptance',
            auth: 'microsoft',
            profilesFolder: '/tmp/wp05-auth/java-profile',
            onMsaCode: data => {
              const uri = data.verification_uri || data.verificationUri || 'https://www.microsoft.com/link'
              const code = data.user_code || data.userCode
              log(`DEVICE_CODE ${uri} ${code}`)
              comment(`WP-05 AUTH REQUIRED — Java/Microsoft\n\nOpen ${uri} and enter code **${code}**. Authenticate the Microsoft account that owns Minecraft Java Edition. This temporary device code expires automatically and no token is committed or uploaded.`)
            }
          })
          client.on('login', packet => log(`LOGIN ${client.username || ''} ${JSON.stringify(packet || {})}`))
          client.on('playerJoin', () => log('PLAYER_JOIN'))
          client.on('error', error => log(`ERROR ${error.stack || error}`))
          client.on('end', reason => log(`END ${reason || ''}`))
          client.on('state', state => {
            if (state === 'play') {
              log(`PLAY ${client.username || ''} ${client.uuid || ''}`)
              fs.writeFileSync('/tmp/wp05-auth/java-ready', `${client.username || ''}\n${client.uuid || ''}\n`)
              setTimeout(() => client.end('WP05 auth probe complete'), 5000)
            }
          })
          setTimeout(() => {
            if (!fs.existsSync('/tmp/wp05-auth/java-ready')) {
              log('FAIL authenticated Java spawn timeout')
              process.exitCode = 1
              client.end('timeout')
            }
          }, 12 * 60 * 1000)
          EOF

          cat > bedrock-auth.js <<'EOF'
          const bedrock = require('bedrock-protocol')
          const fs = require('fs')
          const { execFileSync } = require('child_process')
          const pr = process.env.PR_NUMBER
          const log = line => {
            fs.appendFileSync('/tmp/wp05-auth/evidence/bedrock-client.log', `${new Date().toISOString()} ${line}\n`)
            console.log(line)
          }
          const comment = body => {
            try {
              execFileSync('gh', ['api', `repos/${process.env.GITHUB_REPOSITORY}/issues/${pr}/comments`, '-f', `body=${body}`], { stdio: 'ignore' })
            } catch (error) {
              log(`COMMENT_FAILED ${error.message}`)
            }
          }
          const client = bedrock.createClient({
            host: '127.0.0.1',
            port: 19132,
            offline: false,
            version: '1.26.20',
            profilesFolder: '/tmp/wp05-auth/bedrock-profile',
            connectTimeout: 30000,
            onMsaCode: data => {
              const uri = data.verification_uri || data.verificationUri || 'https://www.microsoft.com/link'
              const code = data.user_code || data.userCode
              log(`DEVICE_CODE ${uri} ${code}`)
              comment(`WP-05 AUTH REQUIRED — Bedrock/Xbox\n\nOpen ${uri} and enter code **${code}**. Authenticate a Bedrock/Xbox-capable Microsoft account. This temporary device code expires automatically and no token is committed or uploaded.`)
            }
          })
          client.on('join', () => log(`JOIN ${JSON.stringify(client.profile || {})}`))
          client.on('spawn', () => {
            log(`SPAWN ${JSON.stringify(client.profile || {})}`)
            fs.writeFileSync('/tmp/wp05-auth/bedrock-ready', `${JSON.stringify(client.profile || {})}\n`)
            setTimeout(() => client.close(), 5000)
          })
          client.on('text', packet => log(`TEXT ${JSON.stringify(packet)}`))
          client.on('kick', packet => log(`KICK ${JSON.stringify(packet)}`))
          client.on('error', error => log(`ERROR ${error.stack || error}`))
          client.on('close', () => log('CLOSE'))
          setTimeout(() => {
            if (!fs.existsSync('/tmp/wp05-auth/bedrock-ready')) {
              log('FAIL authenticated Bedrock spawn timeout')
              process.exitCode = 1
              client.close()
            }
          }, 12 * 60 * 1000)
          EOF

      - name: Probe authenticated Java and Bedrock sessions
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          cd /tmp/wp05-auth/server
          START_UTC="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          printf '%s\n' "$START_UTC" > /tmp/wp05-auth/evidence/start-utc.txt

          rm -f server.stdin
          mkfifo server.stdin
          exec 3<>server.stdin
          java -Xms512M -Xmx1536M -Dpaper.disablePluginRemapping=true -jar paper.jar --nogui < server.stdin > /tmp/wp05-auth/evidence/server.log 2>&1 &
          SERVER_PID=$!
          ready=false
          for _ in $(seq 1 240); do
            if grep -q 'Mass distribution delivery, identity binding, marker recovery, and commands are active.' /tmp/wp05-auth/evidence/server.log \
              && grep -q 'For help, type "help"' /tmp/wp05-auth/evidence/server.log; then
              ready=true
              break
            fi
            kill -0 "$SERVER_PID" 2>/dev/null || { cat /tmp/wp05-auth/evidence/server.log; exit 1; }
            sleep 1
          done
          test "$ready" = true

          cd /tmp/wp05-auth/client
          node java-auth.js > /tmp/wp05-auth/evidence/java-stdout.log 2>&1
          test -s /tmp/wp05-auth/java-ready
          JAVA_NAME="$(sed -n '1p' /tmp/wp05-auth/java-ready)"
          test -n "$JAVA_NAME"
          grep -F "$JAVA_NAME joined the game" /tmp/wp05-auth/evidence/server.log

          node bedrock-auth.js > /tmp/wp05-auth/evidence/bedrock-stdout.log 2>&1
          test -s /tmp/wp05-auth/bedrock-ready
          grep -E '\*[A-Za-z0-9_ ]+ joined the game' /tmp/wp05-auth/evidence/server.log

          cd /tmp/wp05-auth/server
          echo stop >&3
          wait "$SERVER_PID"
          exec 3>&-
          rm -f server.stdin
          END_UTC="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          printf '%s\n' "$END_UTC" > /tmp/wp05-auth/evidence/end-utc.txt
          printf 'Authenticated Java and Bedrock sessions both reached play/spawn.\n' > /tmp/wp05-auth/evidence/result.txt

      - name: Post successful session result
        if: success()
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            -f body='WP-05 authenticated-session probe **PASSED**. Both a Microsoft-authenticated Java 1.21.11 session and an Xbox-authenticated Bedrock session through Geyser/Floodgate reached the disposable Paper server. The external session blocker can now be removed and the same PR should resume IN_PROGRESS.' >/dev/null

      - name: Upload redacted authenticated-session evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wp05-authenticated-session-probe-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: /tmp/wp05-auth/evidence/

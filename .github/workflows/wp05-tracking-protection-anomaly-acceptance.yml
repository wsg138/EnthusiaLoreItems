name: WP-05 Tracking Protection Anomaly Acceptance

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: wp05-track-prot-anom-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tracking-protection-anomaly:
    if: github.event.pull_request.number == 18
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PAPER_URL: https://fill-data.papermc.io/v1/objects/e708e8c132dc143ffd73528cccb9532e2eb17628b1a0eee74469bf466c7003f8/paper-1.21.11-116.jar
      PAPER_SHA256: e708e8c132dc143ffd73528cccb9532e2eb17628b1a0eee74469bf466c7003f8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.14.3"

      - name: Build exact PR head and prepare live server drivers
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :plugin:shadowJar :acceptance-harness:jar -PreleaseVersion=1.0.0-rc.1
          ROOT=/tmp/wp05-track
          mkdir -p "$ROOT/server/plugins/EnthusiaLoreItems" "$ROOT/evidence" "$ROOT/bot"
          PLUGIN_JAR="$(find plugin/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' | head -n1)"
          HARNESS_JAR="$(find acceptance-harness/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' | head -n1)"
          cp "$PLUGIN_JAR" "$ROOT/server/plugins/EnthusiaLoreItems.jar"
          cp "$HARNESS_JAR" "$ROOT/server/plugins/WP05AcceptanceHarness.jar"
          sha256sum "$PLUGIN_JAR" > "$ROOT/evidence/plugin-sha256.txt"
          sha256sum "$HARNESS_JAR" > "$ROOT/evidence/harness-sha256.txt"
          printf '%s\n' "${{ github.event.pull_request.head.sha || github.sha }}" > "$ROOT/evidence/source-head.txt"
          java -version 2> "$ROOT/evidence/java-version.txt"
          cat > "$ROOT/server/plugins/EnthusiaLoreItems/config.yml" <<'EOF'
          database-busy-timeout-millis: 500
          duplicate-warning-interval-seconds: 1
          mutation-budget-per-tick: 32
          EOF
          cd "$ROOT/server"
          curl -fsSL "$PAPER_URL" -o paper.jar
          echo "$PAPER_SHA256  paper.jar" | sha256sum -c -
          printf 'eula=true\n' > eula.txt
          cat > server.properties <<'EOF'
          online-mode=false
          enforce-secure-profile=false
          spawn-protection=0
          white-list=false
          server-port=25565
          motd=WP05 tracking protection anomaly acceptance
          EOF
          cd "$ROOT/bot"
          npm init -y >/dev/null
          npm install --save-exact mineflayer@4.35.0 >"$ROOT/evidence/npm-install.log" 2>&1
          npm list --depth=0 > "$ROOT/evidence/npm-list.txt"
          cat > idle.js <<'EOF'
          const mineflayer=require('mineflayer'),fs=require('fs')
          const root='/tmp/wp05-track', name=process.env.BOT_NAME
          const bot=mineflayer.createBot({host:'127.0.0.1',port:25565,username:name,version:'1.21.11',auth:'offline'})
          const log=x=>{fs.appendFileSync(`${root}/evidence/${name}.log`,`${new Date().toISOString()} ${x}\n`);console.log(x)}
          const sleep=ms=>new Promise(r=>setTimeout(r,ms)); let using=false
          bot.on('message',m=>log(`CHAT ${m.toString()}`));bot.on('error',e=>log(`ERROR ${e.stack||e}`));bot.on('kicked',r=>log(`KICKED ${String(r)}`))
          bot.once('spawn',()=>{log(`SPAWN uuid=${bot.player.uuid}`);fs.writeFileSync(`${root}/${name}.uuid`,`${bot.player.uuid}\n`)})
          const timer=setInterval(async()=>{
            if(!using && fs.existsSync(`${root}/${name}.use`) && !fs.existsSync(`${root}/${name}.use.done`)){
              using=true
              try{
                const item=bot.inventory.items().find(i=>i.name==='firework_rocket'); if(!item) throw new Error('tracked firework not found')
                await bot.equip(item,'hand'); bot.activateItem(); await sleep(1200); bot.deactivateItem();
                fs.writeFileSync(`${root}/${name}.use.done`,'ok\n'); log(`USE_DONE remaining=${bot.inventory.items().filter(i=>i.name==='firework_rocket').reduce((n,i)=>n+i.count,0)}`)
              }catch(e){fs.writeFileSync(`${root}/${name}.use.failed`,String(e.stack||e));log(`USE_FAIL ${e.stack||e}`)} finally {using=false}
            }
            if(fs.existsSync(`${root}/${name}.stop`)){clearInterval(timer);bot.quit('acceptance stage complete')}
          },100)
          EOF
          cat > edit.js <<'EOF'
          const mineflayer=require('mineflayer'),fs=require('fs')
          const root='/tmp/wp05-track',bot=mineflayer.createBot({host:'127.0.0.1',port:25565,username:'Wp05TrackBot',version:'1.21.11',auth:'offline'})
          const log=x=>{fs.appendFileSync(`${root}/evidence/editor.log`,`${new Date().toISOString()} ${x}\n`);console.log(x)}
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));const title=()=>bot.currentWindow?String(bot.currentWindow.title):''
          const wait=async s=>{for(let i=0;i<160;i++){if(bot.currentWindow&&title().toLowerCase().includes(s.toLowerCase()))return;await sleep(100)}throw new Error(`missing window ${s}; current=${title()}`)}
          const close=async()=>{for(let i=0;i<120;i++){if(!bot.currentWindow)return;await sleep(100)}throw new Error('editor prompt did not close window')}
          const click=async s=>{await bot.clickWindow(s,0,0);await sleep(250)}
          bot.on('message',m=>log(`CHAT ${m.toString()}`));bot.on('error',e=>log(`ERROR ${e.stack||e}`))
          bot.once('spawn',async()=>{try{
            bot.chat('/loreitems browse');await wait('Lore definitions');await click(0);await wait('Template management');await click(29);await wait('Template editor')
            await click(10);await close();bot.chat('submit literal Nested Updated');await wait('Template editor');await click(49);await wait('Confirm template revision');await click(31);await sleep(1500)
            fs.writeFileSync(`${root}/edit.done`,'ok\n');bot.quit('nested edit complete')
          }catch(e){log(`FATAL ${e.stack||e}`);fs.writeFileSync(`${root}/edit.failed`,String(e.stack||e));bot.quit('failed')}})
          EOF

      - name: Execute ACC-TRACK-001..003, ACC-PROT-001..002, ACC-ANOM-001..002
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/wp05-track
          DB="$ROOT/server/plugins/EnthusiaLoreItems/loreitems.db"
          cd "$ROOT/server"
          start_server(){
            local log="$1"; rm -f server.stdin; mkfifo server.stdin; exec 3<>server.stdin
            java -Xms512M -Xmx1536M -Dpaper.disablePluginRemapping=true -jar paper.jar --nogui <server.stdin >"$log" 2>&1 & SERVER_PID=$!
            for _ in $(seq 1 180); do
              if grep -q 'Queued direct-delivery processing is active.' "$log" && grep -q 'WP-05 deterministic acceptance helper is active' "$log"; then return; fi
              kill -0 "$SERVER_PID" 2>/dev/null || { cat "$log"; return 1; }; sleep 1
            done; cat "$log"; return 1
          }
          stop_server(){ echo stop >&3; wait "$SERVER_PID"; exec 3>&-; rm -f server.stdin; }
          start_bot(){
            local name="$1"; rm -f "$ROOT/$name.uuid" "$ROOT/$name.stop"
            (cd "$ROOT/bot" && BOT_NAME="$name" node idle.js) >"$ROOT/evidence/$name-stdout.log" 2>&1 & LAST_BOT_PID=$!
            for _ in $(seq 1 90); do test -s "$ROOT/$name.uuid" && return; kill -0 "$LAST_BOT_PID" 2>/dev/null || return 1; sleep 1; done; return 1
          }
          stop_bot(){ local name="$1" pid="$2"; touch "$ROOT/$name.stop"; wait "$pid" || true; rm -f "$ROOT/$name.stop"; }
          wait_sql(){
            local code="$1"
            python3 - "$DB" "$code" <<'PY'
          import sqlite3,sys,time
          db,code=sys.argv[1:]
          for _ in range(240):
              try:
                  with sqlite3.connect(db) as c:
                      if eval(code,{'c':c}): raise SystemExit(0)
              except (sqlite3.Error,TypeError,IndexError): pass
              time.sleep(.25)
          raise SystemExit('SQL wait failed: '+code)
          PY
          }
          start_server "$ROOT/evidence/server-initial.log"
          start_bot Wp05TrackBot; TRACK_PID=$LAST_BOT_PID
          echo 'op Wp05TrackBot' >&3

          # TRACK-003: place a real tracked instance in a nested shulker inside a loaded chest,
          # let the natural loaded-chunk scanner discover it, then perform a real GUI revision.
          echo 'wp05accept source Wp05TrackBot sword' >&3; sleep 1
          echo 'wp05accept perform Wp05TrackBot loreitems create acc_nested_live Nested Acceptance' >&3
          wait_sql "c.execute(\"select count(*) from lore_definitions where lookup_key='acc_nested_live'\").fetchone()[0]==1"
          echo 'wp05accept perform Wp05TrackBot loreitems give acc_nested_live' >&3
          wait_sql "c.execute(\"select count(*) from direct_deliveries where state='COMPLETED'\").fetchone()[0]>=1"
          NESTED_IID="$(python3 - "$DB" <<'PY'
          import sqlite3,sys
          with sqlite3.connect(sys.argv[1]) as c: print(c.execute("select instance_id from lore_instances order by created_at desc limit 1").fetchone()[0])
          PY
          )"
          echo 'wp05accept place Wp05TrackBot shulker' >&3
          wait_sql "(lambda r:r is not None and r[0]=='NESTED_CONTAINER')(c.execute(\"select location_type from instance_current_state where instance_id='$NESTED_IID'\").fetchone())"
          stop_bot Wp05TrackBot "$TRACK_PID"
          rm -f "$ROOT/edit.done" "$ROOT/edit.failed"
          (cd "$ROOT/bot" && node edit.js) >"$ROOT/evidence/edit-stdout.log" 2>&1 & EDIT_PID=$!
          for _ in $(seq 1 160); do test -f "$ROOT/edit.done" && break; test ! -f "$ROOT/edit.failed" || { cat "$ROOT/edit.failed"; exit 1; }; sleep .25; done
          test -f "$ROOT/edit.done"; wait "$EDIT_PID"
          wait_sql "(lambda r:r is not None and r[0] in ('COMPLETED','REVIEW_REQUIRED'))(c.execute(\"select state from pending_mutations where instance_id='$NESTED_IID' and mutation_type='TEMPLATE_UPDATE' order by created_at desc limit 1\").fetchone())"
          python3 - "$DB" <<'PY' | tee "$ROOT/evidence/case-results.txt"
          import sqlite3,sys
          with sqlite3.connect(sys.argv[1]) as c:
              row=c.execute("select m.state,m.attempt_count,s.state,s.location_type from pending_mutations m left join instance_current_state s on s.instance_id=m.instance_id where m.instance_id=(select instance_id from lore_instances order by created_at limit 1) and m.mutation_type='TEMPLATE_UPDATE' order by m.created_at desc limit 1").fetchone()
              assert row and row[0] in ('COMPLETED','REVIEW_REQUIRED'),row
              if row[0]=='REVIEW_REQUIRED': assert row[1]>=1 and row[2] in ('MISSING_UNRESOLVED','CONFLICTING','LAST_CONFIRMED','CONFIRMED_NOW'),row
          print('PASS ACC-TRACK-003: nested update converged or entered explicit review without guessed completion')
          PY

          # TRACK-001: clean restart/rejoin must preserve a canonical player location without a false duplicate.
          start_bot Wp05TrackBot; TRACK_PID=$LAST_BOT_PID
          echo 'wp05accept source Wp05TrackBot sword' >&3; sleep 1
          echo 'wp05accept perform Wp05TrackBot loreitems create acc_track_live Tracking Acceptance' >&3
          wait_sql "c.execute(\"select count(*) from lore_definitions where lookup_key='acc_track_live'\").fetchone()[0]==1"
          echo 'wp05accept perform Wp05TrackBot loreitems give acc_track_live' >&3
          wait_sql "c.execute(\"select count(*) from direct_deliveries where state='COMPLETED'\").fetchone()[0]>=2"
          read TRACK_DID TRACK_IID < <(python3 - "$DB" <<'PY'
          import sqlite3,sys
          with sqlite3.connect(sys.argv[1]) as c:
              print(*c.execute("select definition_id,instance_id from lore_instances where definition_id=(select definition_id from lore_definitions where lookup_key='acc_track_live') order by created_at desc limit 1").fetchone())
          PY
          )
          stop_bot Wp05TrackBot "$TRACK_PID"; stop_server
          start_server "$ROOT/evidence/server-restart.log"
          start_bot Wp05TrackBot; TRACK_PID=$LAST_BOT_PID
          wait_sql "(lambda r:r is not None and r[0] in ('CONFIRMED_NOW','LAST_CONFIRMED') and r[1]=='PLAYER_INVENTORY' and r[2].startswith('player:'))(c.execute(\"select state,location_type,location_key from instance_current_state where instance_id='$TRACK_IID'\").fetchone())"
          python3 - "$DB" <<PY | tee -a "$ROOT/evidence/case-results.txt"
          import sqlite3
          with sqlite3.connect('$DB') as c:
              assert c.execute("select count(*) from instance_anomalies where instance_id=? and status in ('OPEN','ACKNOWLEDGED')",('$TRACK_IID',)).fetchone()[0]==0
          print('PASS ACC-TRACK-001: restart/rejoin preserved canonical player tracking without false duplicate')
          PY

          # TRACK-002 / ANOM-001: copy the exact identity, reconnect to force a natural authoritative inventory scan.
          echo 'wp05accept duplicate Wp05TrackBot' >&3; sleep 1
          stop_bot Wp05TrackBot "$TRACK_PID"
          start_bot Wp05TrackBot; TRACK_PID=$LAST_BOT_PID
          wait_sql "c.execute(\"select count(*) from instance_anomalies where instance_id='$TRACK_IID' and anomaly_type='DUPLICATE_INSTANCE' and status in ('OPEN','ACKNOWLEDGED')\").fetchone()[0]>=1"
          wait_sql "(lambda r:r is not None and r[0]=='CONFLICTING')(c.execute(\"select state from instance_current_state where instance_id='$TRACK_IID'\").fetchone())"
          python3 - "$DB" <<PY | tee -a "$ROOT/evidence/case-results.txt"
          import sqlite3
          with sqlite3.connect('$DB') as c:
              assert c.execute("select lifecycle_state from lore_instances where instance_id=?",('$TRACK_IID',)).fetchone()[0]=='ACTIVE'
              assert c.execute("select count(*) from instance_observations where instance_id=? and confidence='CONFLICTING'",('$TRACK_IID',)).fetchone()[0]>=2
          print('PASS ACC-TRACK-002: duplicate identity produced durable conflicting evidence without auto-delete')
          print('PASS ACC-ANOM-001: duplicate remains preserved and reviewable as an open anomaly')
          PY

          # ANOM-002: the supported destructive flow must not silently delete a conflicted identity.
          echo "loreitems remove $TRACK_DID $TRACK_IID" >&3
          for _ in $(seq 1 60); do TOKEN="$(grep -oE 'confirm-remove [^ ]+' "$ROOT/evidence/server-restart.log" | tail -n1 | awk '{print $2}' || true)"; test -n "$TOKEN" && break; sleep .25; done
          test -n "${TOKEN:-}"
          echo "loreitems confirm-remove $TOKEN" >&3
          wait_sql "c.execute(\"select count(*) from destructive_targets where instance_id='$TRACK_IID' and state='REVIEW_REQUIRED'\").fetchone()[0]>=1"
          python3 - "$DB" <<PY | tee -a "$ROOT/evidence/case-results.txt"
          import sqlite3
          with sqlite3.connect('$DB') as c:
              assert c.execute("select lifecycle_state from lore_instances where instance_id=?",('$TRACK_IID',)).fetchone()[0]=='ACTIVE'
              assert c.execute("select count(*) from destructive_targets where instance_id=? and state='COMPLETED'",('$TRACK_IID',)).fetchone()[0]==0
          print('PASS ACC-ANOM-002: destructive administration review-gated conflicted evidence and preserved both copies')
          PY

          # PROT-001: an actual tracked item entity survives natural lava and TNT damage events.
          start_bot Wp05ProtBot; PROT_PID=$LAST_BOT_PID; echo 'op Wp05ProtBot' >&3
          echo 'wp05accept source Wp05ProtBot sword' >&3; sleep 1
          echo 'wp05accept perform Wp05ProtBot loreitems create acc_prot_live Protection Acceptance' >&3
          wait_sql "c.execute(\"select count(*) from lore_definitions where lookup_key='acc_prot_live'\").fetchone()[0]==1"
          echo 'wp05accept perform Wp05ProtBot loreitems give acc_prot_live' >&3
          wait_sql "c.execute(\"select count(*) from direct_deliveries where state='COMPLETED'\").fetchone()[0]>=3"
          PROT_IID="$(python3 - "$DB" <<'PY'
          import sqlite3,sys
          with sqlite3.connect(sys.argv[1]) as c: print(c.execute("select instance_id from lore_instances where definition_id=(select definition_id from lore_definitions where lookup_key='acc_prot_live') order by created_at desc limit 1").fetchone()[0])
          PY
          )"
          echo 'wp05accept place Wp05ProtBot drop' >&3; sleep 2
          echo 'execute at Wp05ProtBot run setblock ~2 ~ ~ minecraft:lava' >&3; sleep 2
          echo 'execute at Wp05ProtBot run summon minecraft:tnt ~2 ~1 ~ {fuse:1}' >&3; sleep 4
          echo 'execute if entity @e[type=minecraft:item,tag=wp05-acceptance,limit=1] run say WP05_PROT_ENTITY_SURVIVED' >&3; sleep 1
          grep -q 'WP05_PROT_ENTITY_SURVIVED' "$ROOT/evidence/server-restart.log"
          python3 - "$DB" <<PY | tee -a "$ROOT/evidence/case-results.txt"
          import sqlite3
          with sqlite3.connect('$DB') as c:
              assert c.execute("select lifecycle_state from lore_instances where instance_id=?",('$PROT_IID',)).fetchone()[0]=='ACTIVE'
              assert c.execute("select count(*) from instance_observations where instance_id=? and location_type='DROPPED_ITEM'",('$PROT_IID',)).fetchone()[0]>=1
          print('PASS ACC-PROT-001: tracked item entity survived real lava and TNT damage while remaining active/observable')
          PY
          echo 'wp05accept cleanup' >&3

          # PROT-002: a real consumptive firework interaction is denied; physical tracked stack remains.
          start_bot Wp05SafeBot; SAFE_PID=$LAST_BOT_PID; echo 'op Wp05SafeBot' >&3
          echo 'wp05accept source Wp05SafeBot uncommon' >&3; sleep 1
          echo 'wp05accept perform Wp05SafeBot loreitems create acc_consume_live Consume Protection' >&3
          wait_sql "c.execute(\"select count(*) from lore_definitions where lookup_key='acc_consume_live'\").fetchone()[0]==1"
          echo 'wp05accept perform Wp05SafeBot loreitems give acc_consume_live' >&3
          wait_sql "c.execute(\"select count(*) from direct_deliveries where state='COMPLETED'\").fetchone()[0]>=4"
          SAFE_IID="$(python3 - "$DB" <<'PY'
          import sqlite3,sys
          with sqlite3.connect(sys.argv[1]) as c: print(c.execute("select instance_id from lore_instances where definition_id=(select definition_id from lore_definitions where lookup_key='acc_consume_live') order by created_at desc limit 1").fetchone()[0])
          PY
          )"
          touch "$ROOT/Wp05SafeBot.use"
          for _ in $(seq 1 80); do test -f "$ROOT/Wp05SafeBot.use.done" && break; test ! -f "$ROOT/Wp05SafeBot.use.failed" || { cat "$ROOT/Wp05SafeBot.use.failed"; exit 1; }; sleep .25; done
          test -f "$ROOT/Wp05SafeBot.use.done"
          echo 'wp05accept dump Wp05SafeBot' >&3; sleep 1
          grep -q "instance=$SAFE_IID" "$ROOT/evidence/server-restart.log"
          python3 - "$DB" <<PY | tee -a "$ROOT/evidence/case-results.txt"
          import sqlite3
          with sqlite3.connect('$DB') as c:
              assert c.execute("select lifecycle_state from lore_instances where instance_id=?",('$SAFE_IID',)).fetchone()[0]=='ACTIVE'
          print('PASS ACC-PROT-002: real consumptive item use was denied and tracked identity remained physical/active')
          PY

          # Extra malformed-stack evidence strengthens anomaly fail-closed coverage.
          start_bot Wp05MalformedBot; MAL_PID=$LAST_BOT_PID; echo 'op Wp05MalformedBot' >&3
          echo 'wp05accept source Wp05MalformedBot sword' >&3; sleep 1
          echo 'wp05accept perform Wp05MalformedBot loreitems create acc_malformed_live Malformed Acceptance' >&3
          wait_sql "c.execute(\"select count(*) from lore_definitions where lookup_key='acc_malformed_live'\").fetchone()[0]==1"
          echo 'wp05accept perform Wp05MalformedBot loreitems give acc_malformed_live' >&3
          wait_sql "c.execute(\"select count(*) from direct_deliveries where state='COMPLETED'\").fetchone()[0]>=5"
          echo 'wp05accept malform Wp05MalformedBot' >&3; sleep 1
          stop_bot Wp05MalformedBot "$MAL_PID"; start_bot Wp05MalformedBot; MAL_PID=$LAST_BOT_PID
          wait_sql "c.execute(\"select count(*) from instance_anomalies where anomaly_type='MALFORMED_STACK' and status in ('OPEN','ACKNOWLEDGED')\").fetchone()[0]>=1"
          echo 'PASS EXTRA-MALFORMED: partial identity was preserved and durably flagged' | tee -a "$ROOT/evidence/case-results.txt"

          python3 - "$DB" <<'PY' | tee -a "$ROOT/evidence/case-results.txt"
          import sqlite3,sys
          with sqlite3.connect(sys.argv[1]) as c:
              assert c.execute('pragma integrity_check').fetchone()[0]=='ok'
              assert c.execute('pragma foreign_key_check').fetchall()==[]
              print('schema_history='+','.join(str(x[0]) for x in c.execute('select version from schema_history order by version')))
              print('open_anomalies='+str(c.execute("select count(*) from instance_anomalies where status in ('OPEN','ACKNOWLEDGED')").fetchone()[0]))
          PY
          stop_bot Wp05MalformedBot "$MAL_PID"; stop_bot Wp05SafeBot "$SAFE_PID"; stop_bot Wp05ProtBot "$PROT_PID"; stop_bot Wp05TrackBot "$TRACK_PID"
          stop_server

      - name: Upload tracking/protection/anomaly evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wp05-track-prot-anom-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/wp05-track/evidence/
          if-no-files-found: error
          retention-days: 30

name: Export local Gradle bundle

on:
  pull_request:

permissions:
  contents: read

jobs:
  bundle:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
          cache-disabled: true
      - name: Verify and package offline inputs
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/local-gradle-home
        run: |
          set -euo pipefail
          gradle --no-daemon clean check
          gradle_root="$(cd "$(dirname "$(command -v gradle)")/.." && pwd)"
          bundle="$RUNNER_TEMP/local-gradle-bundle"
          mkdir -p "$bundle"
          cp -a "$gradle_root" "$bundle/gradle-8.14.3"
          cp -a "$GRADLE_USER_HOME" "$bundle/gradle-home"
          git archive --format=tar.gz --output="$bundle/source.tar.gz" HEAD
          tar --exclude='gradle-home/daemon' --exclude='gradle-home/workers' -czf "$RUNNER_TEMP/local-gradle-bundle.tar.gz" -C "$bundle" .
      - uses: actions/upload-artifact@v4
        with:
          name: local-gradle-bundle-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/local-gradle-bundle.tar.gz
          if-no-files-found: error
          retention-days: 1

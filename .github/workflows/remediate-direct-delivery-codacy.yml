name: Remediate direct delivery Codacy findings

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: remediate-direct-delivery-codacy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  remediate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/loreitems-pr2-creation-delivery-protection
          fetch-depth: 0
      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.14.3"
      - name: Apply exact reviewed fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def read_lines(path: Path) -> list[str]:
              return path.read_text().splitlines()

          def write_lines(path: Path, lines: list[str]) -> None:
              path.write_text("\n".join(lines) + "\n")

          def unique_index(lines: list[str], target: str, label: str) -> int:
              matches = [index for index, line in enumerate(lines) if line == target]
              if len(matches) != 1:
                  raise SystemExit(f"{label}: expected one match, found {len(matches)}")
              return matches[0]

          def remove_unique_line(lines: list[str], target: str, label: str) -> None:
              del lines[unique_index(lines, target, label)]

          worker_path = Path("adapters-paper/src/main/java/net/enthusia/loreitems/paper/PaperDirectDeliveryWorker.java")
          worker = read_lines(worker_path)
          review_case = unique_index(
              worker,
              "            case REVIEW_REQUIRED -> requireReview(delivery, result.detail(), null);",
              "worker review case")
          if worker[review_case + 1] != "        }":
              raise SystemExit("worker switch closing brace did not follow review case")
          worker[review_case + 1:review_case + 1] = [
              "            default -> requireReview(",
              "                    delivery,",
              "                    \"Unsupported direct-delivery apply result: \" + result.status(),",
              "                    null);",
          ]
          remove_unique_line(worker, "            pollTask = null;", "worker null assignment")
          write_lines(worker_path, worker)

          plugin_path = Path("plugin/src/main/java/net/enthusia/loreitems/plugin/LoreItemsPlugin.java")
          plugin = read_lines(plugin_path)
          remove_unique_line(plugin, "            directDeliveryWorker = null;", "plugin null assignment")
          write_lines(plugin_path, plugin)

          prepared_path = Path("application/src/main/java/net/enthusia/loreitems/application/PreparedDirectDelivery.java")
          prepared = read_lines(prepared_path)
          timestamp_constant = unique_index(
              prepared,
              "    private static final long MIN_TIMESTAMP = 0L;",
              "prepared timestamp constant")
          prepared.insert(timestamp_constant + 1, "    private static final int MIN_ATTEMPT_COUNT = 1;")
          attempt_check = unique_index(
              prepared,
              "        if (attemptCount < 1) {",
              "prepared attempt conditional")
          prepared[attempt_check] = "        if (attemptCount < MIN_ATTEMPT_COUNT) {"
          write_lines(prepared_path, prepared)

          sqlite_path = Path("adapters-sqlite/src/main/java/net/enthusia/loreitems/sqlite/SQLiteDirectDeliveryRepository.java")
          sqlite = read_lines(sqlite_path)
          completed_state = unique_index(
              sqlite,
              "    private static final String COMPLETED_STATE = \"COMPLETED\";",
              "SQLite completed state constant")
          sqlite[completed_state + 1:completed_state + 1] = [
              "    private static final String DELIVERY_ID_COLUMN = \"delivery_id\";",
              "    private static final String INSTANCE_ID_COLUMN = \"instance_id\";",
              "    private static final String PLAYER_ID_COLUMN = \"player_id\";",
          ]

          method_start = unique_index(
              sqlite,
              "    private static int moveExpiredClaimsToReviewInTransaction(",
              "expired-claim method")
          query_start = next(
              index for index in range(method_start, len(sqlite))
              if sqlite[index] == "        List<ExpiredClaim> expired = new ArrayList<>();")
          update_start = next(
              index for index in range(query_start, len(sqlite))
              if sqlite[index] == "        int updated = 0;")
          sqlite[query_start:update_start] = [
              "        List<ExpiredClaim> expired = findExpiredClaims(connection, now, limit);"
          ]

          transition_start = unique_index(
              sqlite,
              "    private static boolean transitionDelivery(",
              "transitionDelivery method")
          helper = [
              "    private static List<ExpiredClaim> findExpiredClaims(",
              "            Connection connection,",
              "            long now,",
              "            int limit) throws SQLException {",
              "        List<ExpiredClaim> expired = new ArrayList<>();",
              "        try (PreparedStatement statement = connection.prepareStatement(",
              "                \"SELECT delivery_id, instance_id, player_id, state, claim_token \"",
              "                        + \"FROM direct_deliveries WHERE state IN ('RESERVED', 'APPLIED', 'VERIFIED') \"",
              "                        + \"AND claim_expires_at <= ? ORDER BY claim_expires_at, delivery_id LIMIT ?\")) {",
              "            statement.setLong(1, now);",
              "            statement.setInt(2, limit);",
              "            try (ResultSet resultSet = statement.executeQuery()) {",
              "                while (resultSet.next()) {",
              "                    expired.add(new ExpiredClaim(",
              "                            UUID.fromString(resultSet.getString(DELIVERY_ID_COLUMN)),",
              "                            UUID.fromString(resultSet.getString(INSTANCE_ID_COLUMN)),",
              "                            UUID.fromString(resultSet.getString(PLAYER_ID_COLUMN)),",
              "                            resultSet.getString(\"state\"),",
              "                            resultSet.getString(\"claim_token\")));",
              "                }",
              "            }",
              "        }",
              "        return expired;",
              "    }",
              "",
          ]
          sqlite[transition_start:transition_start] = helper

          replacements = {
              'resultSet.getString("delivery_id")': 'resultSet.getString(DELIVERY_ID_COLUMN)',
              'resultSet.getString("instance_id")': 'resultSet.getString(INSTANCE_ID_COLUMN)',
              'resultSet.getString("player_id")': 'resultSet.getString(PLAYER_ID_COLUMN)',
          }
          for old, new in replacements.items():
              count = sum(line.count(old) for line in sqlite)
              if count != 3:
                  raise SystemExit(
                      f"SQLite duplicate literal {old}: expected three remaining matches, found {count}")
              sqlite = [line.replace(old, new) for line in sqlite]
          write_lines(sqlite_path, sqlite)
          PY
          git rm .github/workflows/codacy-current-evidence.yml
          git rm .github/workflows/remediate-direct-delivery-codacy.yml
          git diff --check
          gradle --no-daemon clean check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix direct delivery static analysis findings"
          git push origin HEAD:agent/loreitems-pr2-creation-delivery-protection

name: WP-05 Configuration Reload Acceptance

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: wp05-config-reload-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  config-reload:
    if: github.event.pull_request.number == 18
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PAPER_URL: https://fill-data.papermc.io/v1/objects/e708e8c132dc143ffd73528cccb9532e2eb17628b1a0eee74469bf466c7003f8/paper-1.21.11-116.jar
      PAPER_SHA256: e708e8c132dc143ffd73528cccb9532e2eb17628b1a0eee74469bf466c7003f8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: "8.14.3"

      - name: Prepare exact-head Paper and protocol clients
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :plugin:shadowJar :acceptance-harness:jar -PreleaseVersion=1.0.0-rc.1
          R=/tmp/wp05-config;mkdir -p "$R/server/plugins/EnthusiaLoreItems" "$R/evidence" "$R/bot"
          P="$(find plugin/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*'|head -n1)";H="$(find acceptance-harness/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*'|head -n1)";cp "$P" "$R/server/plugins/EnthusiaLoreItems.jar";cp "$H" "$R/server/plugins/WP05AcceptanceHarness.jar";sha256sum "$P">"$R/evidence/plugin-sha256.txt";printf '%s\n' "${{ github.event.pull_request.head.sha || github.sha }}">"$R/evidence/source-head.txt"
          cat >"$R/server/plugins/EnthusiaLoreItems/config.yml" <<'EOF'
          database-busy-timeout-millis: 5000
          database-queue-capacity: 256
          database-shutdown-timeout-seconds: 10
          delivery-claim-batch-size: 32
          delivery-claim-lease-seconds: 30
          duplicate-warning-interval-seconds: 300
          default-page-size: 45
          max-page-size: 100
          mutation-budget-per-tick: 16
          shared-containers-allowed: true
          EOF
          cp "$R/server/plugins/EnthusiaLoreItems/config.yml" "$R/evidence/config-initial.yml";cd "$R/server";curl -fsSL "$PAPER_URL" -o paper.jar;echo "$PAPER_SHA256  paper.jar"|sha256sum -c -;printf 'eula=true\n'>eula.txt
          cat >server.properties <<'EOF'
          online-mode=false
          enforce-secure-profile=false
          spawn-protection=0
          white-list=false
          server-port=25565
          motd=WP05 config reload acceptance
          EOF
          cd "$R/bot";npm init -y>/dev/null;npm install --save-exact mineflayer@4.35.0>"$R/evidence/npm.log" 2>&1
          cat >policy.js <<'EOF'
          const m=require('mineflayer'),fs=require('fs'),Vec3=require('vec3').Vec3,root='/tmp/wp05-config',user=process.env.USER_NAME,mode=process.env.POLICY_MODE,sleep=ms=>new Promise(r=>setTimeout(r,ms))
          const safe=user.toLowerCase(),log=x=>{fs.appendFileSync(`${root}/evidence/policy-${safe}.log`,`${new Date().toISOString()} ${x}\n`);console.log(x)},bot=m.createBot({host:'127.0.0.1',port:25565,username:user,version:'1.21.11',auth:'offline'})
          async function waitFile(p,n=600){for(let i=0;i<n;i++){if(fs.existsSync(p))return;await sleep(100)}throw Error(`marker timeout ${p}`)}async function waitItem(name,n=200){for(let i=0;i<n;i++){const x=bot.inventory.items().find(v=>v.name===name);if(x)return x;await sleep(100)}throw Error(`${name} missing`)}
          function windowSlot(name){if(!bot.currentWindow)throw Error('window missing');const i=bot.currentWindow.slots.findIndex(x=>x&&x.name===name);if(i<0)throw Error(`${name} absent from window`);return i}function emptyPlayerSlot(){const w=bot.currentWindow,start=Number.isInteger(w.inventoryStart)?w.inventoryStart:Math.max(0,w.slots.length-36),end=Number.isInteger(w.inventoryEnd)?w.inventoryEnd:w.slots.length;for(let i=start;i<end;i++)if(!w.slots[i])return i;throw Error('no empty player window slot')}
          async function openShulker(){let last='none';for(let a=1;a<=4;a++){await bot.waitForChunksToLoad();bot.chat('/setblock 1 70 0 minecraft:shulker_box');await sleep(500);let block;for(let i=0;i<80;i++){block=bot.blockAt(new Vec3(1,70,0));if(block&&block.name==='shulker_box')break;last=block?block.name:'null';await sleep(100)}if(!block||block.name!=='shulker_box')continue;try{const c=await bot.openContainer(block);log(`OPEN_SHULKER attempt=${a}`);return c}catch(e){last=e.message;log(`OPEN_FAIL attempt=${a} ${e.stack||e}`);await sleep(500)}}throw Error(`shulker open failed ${last}`)}
          async function shulkerPolicy(){bot.chat('/loreitems give cfg_item');await waitItem('diamond_sword');bot.chat(`/tp ${user} 0 71 0`);await sleep(700);await bot.waitForChunksToLoad();const c=await openShulker();await sleep(300);const tracked=windowSlot('diamond_sword');await bot.clickWindow(tracked,0,0);await sleep(200);await bot.clickWindow(0,0,0);await sleep(700);const inserted=bot.currentWindow&&bot.currentWindow.slots[0];if(mode==='allowed'){if(!inserted||inserted.name!=='diamond_sword')throw Error('allowed policy rejected shulker insertion');await bot.clickWindow(0,0,0);await sleep(200);await bot.clickWindow(emptyPlayerSlot(),0,0);await sleep(500);c.close();await waitItem('diamond_sword');log('SHULKER_ALLOWED accepted and returned tracked item');return}if(inserted&&inserted.name==='diamond_sword')throw Error('restricted policy accepted shulker insertion');c.close();await sleep(500);await waitItem('diamond_sword');log('SHULKER_RESTRICTED retained tracked item')}
          bot.on('error',e=>log(`ERROR ${e.stack||e}`));bot.once('spawn',async()=>{try{fs.writeFileSync(`${root}/${safe}.uuid`,`${bot.player.uuid}\n`);await waitFile(`${root}/${safe}.go`);await shulkerPolicy();fs.writeFileSync(`${root}/${safe}.done`,'ok\n');bot.quit('policy complete')}catch(e){log(`FATAL ${e.stack||e}`);fs.writeFileSync(`${root}/${safe}.failed`,String(e.stack||e));process.exit(1)}})
          EOF
          cat >queue.js <<'EOF'
          const m=require('mineflayer'),fs=require('fs'),root='/tmp/wp05-config',user='Wp05CfgQueue',role=process.env.ROLE||'identify',sleep=ms=>new Promise(r=>setTimeout(r,ms)),bot=m.createBot({host:'127.0.0.1',port:25565,username:user,version:'1.21.11',auth:'offline'})
          bot.once('spawn',async()=>{try{fs.writeFileSync(`${root}/queue.uuid`,`${bot.player.uuid}\n`);if(role==='identify'){fs.writeFileSync(`${root}/queue.ready`,'ok\n');while(!fs.existsSync(`${root}/queue.stop`))await sleep(100);bot.quit('identified');return}for(let i=0;i<400;i++){if(bot.inventory.items().some(x=>x.name==='diamond_sword')){fs.writeFileSync(`${root}/queue.delivered`,'ok\n');bot.quit('delivered');return}await sleep(100)}throw Error('queued item did not deliver')}catch(e){fs.writeFileSync(`${root}/queue.failed`,String(e.stack||e));process.exit(1)}})
          EOF

      - name: Execute supported atomic reload and last-known-good policy contract
        shell: bash
        run: |
          set -euo pipefail
          R=/tmp/wp05-config;S="$R/server";E="$R/evidence";DB="$S/plugins/EnthusiaLoreItems/loreitems.db";CFG="$S/plugins/EnthusiaLoreItems/config.yml";cd "$S";rm -f server.stdin;mkfifo server.stdin;exec 3<>server.stdin;java -Xms512M -Xmx1536M -Dpaper.disablePluginRemapping=true -jar paper.jar --nogui <server.stdin>"$E/server.log" 2>&1 & SPID=$!
          cleanup(){ echo stop >&3 2>/dev/null||true;kill "$SPID" 2>/dev/null||true;};trap cleanup EXIT
          for _ in $(seq 1 180);do if grep -q 'Queued direct-delivery processing is active.' "$E/server.log"&&grep -q 'WP-05 deterministic acceptance helper is active' "$E/server.log";then break;fi;kill -0 "$SPID" 2>/dev/null||{ cat "$E/server.log";exit 1;};sleep 1;done
          wait_sql(){ local q="$1";for _ in $(seq 1 160);do if python3 - "$DB" "$q" <<'PY'
          import sqlite3,sys
          try:
              with sqlite3.connect(sys.argv[1]) as c:r=c.execute(sys.argv[2]).fetchone();raise SystemExit(0 if r and r[0] else 1)
          except sqlite3.OperationalError:raise SystemExit(1)
          PY
            then return;fi;sleep .25;done;echo "SQL timeout $q" >&2;return 1;}
          run_policy(){ local user="$1" mode="$2" safe pid;safe="$(printf '%s' "$user"|tr '[:upper:]' '[:lower:]')";rm -f "$R/$safe.uuid" "$R/$safe.go" "$R/$safe.done" "$R/$safe.failed";(cd "$R/bot"&&USER_NAME="$user" POLICY_MODE="$mode" node policy.js)>"$E/${safe}-stdout.log" 2>&1 & pid=$!;for _ in $(seq 1 100);do test -s "$R/$safe.uuid"&&break;sleep .2;done;test -s "$R/$safe.uuid";echo "op $user" >&3;echo "clear $user" >&3;echo "effect give $user minecraft:slow_falling 30 0 true" >&3;echo "effect give $user minecraft:water_breathing 30 0 true" >&3;echo "tp $user 0 140 0" >&3;sleep 3;echo 'fill -3 69 -3 3 74 3 minecraft:stone' >&3;echo 'fill -2 70 -2 2 73 2 minecraft:air' >&3;sleep .5;echo "tp $user 0 71 0" >&3;sleep .5;touch "$R/$safe.go";for _ in $(seq 1 400);do test -f "$R/$safe.failed"&&{ cat "$R/$safe.failed";return 1;};test -f "$R/$safe.done"&&break;sleep .2;done;test -f "$R/$safe.done";wait "$pid";}
          START="$(date -u +%FT%TZ)"
          rm -f "$R/wp05cfgcreate."*;(cd "$R/bot"&&USER_NAME=Wp05CfgCreate POLICY_MODE=restricted node policy.js)>"$E/create-fixture.log" 2>&1 & CPID=$!;for _ in $(seq 1 100);do test -s "$R/wp05cfgcreate.uuid"&&break;sleep .2;done;test -s "$R/wp05cfgcreate.uuid";echo 'op Wp05CfgCreate' >&3;echo 'wp05accept source Wp05CfgCreate sword' >&3;sleep .5;echo 'wp05accept perform Wp05CfgCreate loreitems create cfg_item Config Reload Item' >&3;wait_sql "select count(*)=1 from lore_definitions where lookup_key='cfg_item' and deleted_at is null";kill "$CPID" 2>/dev/null||true;wait "$CPID" 2>/dev/null||true
          rm -f "$R/queue.uuid" "$R/queue.ready" "$R/queue.stop" "$R/queue.failed";(cd "$R/bot"&&ROLE=identify node queue.js)>"$E/queue-identify.log" 2>&1 & QPID=$!;for _ in $(seq 1 100);do test -f "$R/queue.ready"&&break;sleep .2;done;QID="$(tr -d '\r\n'<"$R/queue.uuid")";touch "$R/queue.stop";wait "$QPID";echo "wp05accept api cfg_item $QID cfg-reload-queue-1" >&3;wait_sql "select count(*)=1 from direct_deliveries where idempotency_key='cfg-reload-queue-1' and state='PENDING'"
          run_policy Wp05CfgAllowed allowed
          python3 - "$CFG" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]);s=p.read_text();assert s.count('shared-containers-allowed: true')==1;p.write_text(s.replace('shared-containers-allowed: true','shared-containers-allowed: false'))
          PY
          cp "$CFG" "$E/config-valid.yml";M="$(wc -l<"$E/server.log")";echo 'loreitems reload' >&3;for _ in $(seq 1 120);do tail -n +"$M" "$E/server.log"|grep -Fq 'LoreItems configuration reload applied:'&&break;sleep .25;done;tail -n +"$M" "$E/server.log"|grep -Fq 'LoreItems configuration reload applied:';run_policy Wp05CfgDeny1 restricted
          printf '\ndefault-page-size: not-an-integer\n'>>"$CFG";cp "$CFG" "$E/config-invalid.yml";M="$(wc -l<"$E/server.log")";echo 'loreitems reload' >&3;for _ in $(seq 1 120);do tail -n +"$M" "$E/server.log"|grep -Fq 'LoreItems configuration reload rejected:'&&break;sleep .25;done;tail -n +"$M" "$E/server.log"|grep -Fq 'LoreItems configuration reload rejected:';run_policy Wp05CfgDeny2 restricted
          rm -f "$R/queue.delivered" "$R/queue.failed";(cd "$R/bot"&&ROLE=delivery node queue.js)>"$E/queue-delivery.log" 2>&1 & QPID=$!;for _ in $(seq 1 400);do test -f "$R/queue.failed"&&{ cat "$R/queue.failed";exit 1;};test -f "$R/queue.delivered"&&break;sleep .1;done;test -f "$R/queue.delivered";wait "$QPID";wait_sql "select count(*)=1 from direct_deliveries where idempotency_key='cfg-reload-queue-1' and state='COMPLETED'"
          echo stop >&3;wait "$SPID";exec 3>&-;trap - EXIT;END="$(date -u +%FT%TZ)";python3 - "$DB" "$START" "$END" <<'PY'|tee "$E/result.json"
          import json,sqlite3,sys
          with sqlite3.connect(sys.argv[1]) as c:i=c.execute('pragma integrity_check').fetchone()[0];fk=[list(r) for r in c.execute('pragma foreign_key_check')];assert i=='ok' and not fk
          print(json.dumps({'case':'ACC-LIFE-001','result':'PASS','source_head':open('/tmp/wp05-config/evidence/source-head.txt').read().strip(),'started_at':sys.argv[2],'finished_at':sys.argv[3],'initial_shulker_policy':'allowed','valid_reload_shulker_policy':'restricted','invalid_reload_last_known_good_policy':'restricted','pre_reload_queue_completed_after_both_reload_attempts':True,'integrity':i,'foreign_key_violations':fk},indent=2))
          PY
      - name: Upload config evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wp05-config-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/wp05-config/evidence
          if-no-files-found: error
          retention-days: 30

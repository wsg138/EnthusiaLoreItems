name: WP-05 Java Identity and Core Acceptance

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: wp05-java-core-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  java-identity-core:
    if: github.event.pull_request.number == 18
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PAPER_URL: https://fill-data.papermc.io/v1/objects/e708e8c132dc143ffd73528cccb9532e2eb17628b1a0eee74469bf466c7003f8/paper-1.21.11-116.jar
      PAPER_SHA256: e708e8c132dc143ffd73528cccb9532e2eb17628b1a0eee74469bf466c7003f8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.14.3"

      - name: Build exact PR head and prepare server/client
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :plugin:shadowJar :acceptance-harness:jar -PreleaseVersion=1.0.0-rc.1
          mkdir -p /tmp/wp05-core/server/plugins /tmp/wp05-core/evidence /tmp/wp05-core/bot
          PLUGIN_JAR="$(find plugin/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' | head -n1)"
          HARNESS_JAR="$(find acceptance-harness/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' | head -n1)"
          cp "$PLUGIN_JAR" /tmp/wp05-core/server/plugins/EnthusiaLoreItems.jar
          cp "$HARNESS_JAR" /tmp/wp05-core/server/plugins/WP05AcceptanceHarness.jar
          sha256sum "$PLUGIN_JAR" > /tmp/wp05-core/evidence/plugin-sha256.txt
          sha256sum "$HARNESS_JAR" > /tmp/wp05-core/evidence/harness-sha256.txt
          printf '%s\n' "${{ github.event.pull_request.head.sha || github.sha }}" > /tmp/wp05-core/evidence/source-head.txt
          java -version 2> /tmp/wp05-core/evidence/java-version.txt
          cd /tmp/wp05-core/server
          curl -fsSL "$PAPER_URL" -o paper.jar
          echo "$PAPER_SHA256  paper.jar" | sha256sum -c -
          printf 'eula=true\n' > eula.txt
          cat > server.properties <<'EOF'
          online-mode=false
          enforce-secure-profile=false
          spawn-protection=0
          white-list=false
          server-port=25565
          motd=WP05 Java core acceptance
          EOF
          cd /tmp/wp05-core/bot
          npm init -y >/dev/null
          npm install --save-exact mineflayer@4.35.0 >/tmp/wp05-core/evidence/npm-install.log 2>&1
          npm list --depth=0 > /tmp/wp05-core/evidence/npm-list.txt
          cat > bot.js <<'EOF'
          const mineflayer=require('mineflayer'), fs=require('fs')
          const role=process.env.ROLE, mode=process.env.MODE
          const name=role==='admin'?'Wp05JavaAdmin':'Wp05JavaTarget'
          const root='/tmp/wp05-core', sleep=ms=>new Promise(r=>setTimeout(r,ms))
          const ready=`${root}/${role}-${mode}.ready`, go=`${root}/${role}-${mode}.go`, done=`${root}/${role}-${mode}.done`
          const logFile=`${root}/evidence/${role}-${mode}.log`
          const write=x=>{fs.appendFileSync(logFile,`${new Date().toISOString()} ${x}\n`);console.log(x)}
          const bot=mineflayer.createBot({host:'127.0.0.1',port:25565,username:name,version:'1.21.11',auth:'offline'})
          let messages=[]
          bot.on('message',m=>{const t=m.toString();messages.push(t);write(`CHAT ${t}`)})
          bot.on('error',e=>write(`ERROR ${e.stack||e}`)); bot.on('kicked',r=>write(`KICKED ${String(r)}`))
          async function waitFile(p,t=30000){const s=Date.now();while(Date.now()-s<t){if(fs.existsSync(p))return;await sleep(100)}throw new Error(`file timeout ${p}`)}
          async function waitMsg(f,t=20000){const s=Date.now();while(Date.now()-s<t){if(messages.some(x=>x.includes(f)))return;await sleep(100)}throw new Error(`message timeout ${f}`)}
          async function waitSwords(n,t=20000){const s=Date.now();while(Date.now()-s<t){if(bot.inventory.items().filter(i=>i.name==='diamond_sword').length===n)return;await sleep(200)}throw new Error(`sword count did not become ${n}`)}
          async function selectSword(){const s=Date.now();while(Date.now()-s<15000){const item=bot.inventory.items().find(i=>i.name==='diamond_sword');if(item){if(item.slot>=36&&item.slot<=44)bot.setQuickBarSlot(item.slot-36);await sleep(300);if(bot.heldItem?.name==='diamond_sword')return}await sleep(100)}throw new Error('no held diamond sword')}
          async function command(text,expected){bot.chat(text);if(expected)await waitMsg(expected);await sleep(400)}
          async function browse(){let opened=false;const listener=w=>{opened=true;write(`WINDOW title=${w.title} slots=${w.slots.length}`);try{bot.closeWindow(w)}catch(_){}};bot.once('windowOpen',listener);bot.chat('/loreitems browse');for(let i=0;i<100;i++){if(opened)return;await sleep(100)}bot.removeListener('windowOpen',listener);throw new Error('browse GUI did not open')}
          async function completions(){try{const raw=await bot.tabComplete('/loreitems ',true,false,5000);const values=raw.map(v=>typeof v==='string'?v:(v?.match??String(v)));write(`TAB ${JSON.stringify(values)}`);return values}catch(e){write(`TAB_EMPTY ${e.message}`);return []}}
          bot.once('spawn',async()=>{try{
            write(`SPAWN role=${role} mode=${mode} uuid=${bot.player.uuid} username=${bot.username}`);fs.writeFileSync(ready,`${bot.player.uuid}\n`);await waitFile(go)
            if(role==='target'&&mode==='initial'){
              const tabs=await completions();if(tabs.some(x=>['create','adopt','give','browse','anomalies','audit','recovery'].includes(x)))throw new Error(`non-admin privileged completions ${JSON.stringify(tabs)}`)
              await command('/loreitems browse','You do not have permission to browse lore-item templates.')
              fs.writeFileSync(`${root}/target-permissions-ok`,'ok\n');await waitFile(`${root}/target-expect-online`);await waitSwords(1);write('ONLINE_TARGET_SWORDS 1');fs.writeFileSync(`${root}/target-online-ok`,'ok\n');await waitFile(`${root}/target-exit`)
            }else if(role==='target'&&mode==='recovery'){await waitSwords(2);write('RECOVERY_TARGET_SWORDS 2')
            }else if(role==='target'&&mode==='replay'){await waitSwords(2);write('REPLAY_TARGET_SWORDS 2')
            }else if(role==='admin'&&mode==='initial'){
              const tabs=await completions();for(const expected of ['create','adopt','give','browse'])if(!tabs.includes(expected))throw new Error(`admin completion missing ${expected}: ${JSON.stringify(tabs)}`)
              await browse();await selectSword();write(`SOURCE_BEFORE_CREATE ${JSON.stringify(bot.heldItem)}`)
              await command('/loreitems create acc_core_live Core Acceptance',"Created lore definition 'acc_core_live' from the held item.");await waitSwords(1);write(`SOURCE_AFTER_CREATE ${JSON.stringify(bot.heldItem)}`)
              await browse();await command('/loreitems adopt acc_core_live',"Adopted the held item into lore definition 'acc_core_live'.");write(`SOURCE_AFTER_ADOPT ${JSON.stringify(bot.heldItem)}`)
              await command('/loreitems give acc_core_live','Lore item queued. It will deliver when the player is online with inventory space.');await waitSwords(2)
              await command('/loreitems give acc_core_live Wp05JavaTarget','Lore item queued. It will deliver when the player is online with inventory space.');fs.writeFileSync(`${root}/target-expect-online`,'ok\n');await waitFile(`${root}/target-online-ok`)
              write('ADMIN_SWORDS_AFTER_SELF_GIVE 2');fs.writeFileSync(`${root}/admin-initial-ok`,'ok\n');await waitFile(`${root}/admin-exit`)
            }else if(role==='admin'&&mode==='recovery'){await browse();await waitSwords(2);write('ADMIN_RESTART_SWORDS 2')}
            fs.writeFileSync(done,'ok\n');bot.quit('acceptance complete')
          }catch(e){write(`FAIL ${e.stack||e}`);fs.writeFileSync(done,`fail ${e.message}\n`);bot.quit('acceptance failure');process.exitCode=1}})
          EOF

      - name: Execute ACC-ID-001 and ACC-CORE-001 through ACC-CORE-004
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/wp05-core/server
          start_server(){ local log="$1";rm -f server.stdin;mkfifo server.stdin;exec 3<>server.stdin;java -Xms512M -Xmx1536M -Dpaper.disablePluginRemapping=true -jar paper.jar --nogui <server.stdin >"$log" 2>&1 & SERVER_PID=$!;for _ in $(seq 1 180);do if grep -q 'Queued direct-delivery processing is active.' "$log"&&grep -q 'WP-05 deterministic acceptance helper is active' "$log";then return 0;fi;kill -0 "$SERVER_PID" 2>/dev/null||{ cat "$log";return 1;};sleep 1;done;cat "$log";return 1;}
          stop_server(){ echo stop >&3;wait "$SERVER_PID";exec 3>&-;rm -f server.stdin;}
          run_bot(){ local role="$1" mode="$2";rm -f "/tmp/wp05-core/${role}-${mode}.ready" "/tmp/wp05-core/${role}-${mode}.go" "/tmp/wp05-core/${role}-${mode}.done";(cd /tmp/wp05-core/bot&&ROLE="$role" MODE="$mode" node bot.js)>"/tmp/wp05-core/evidence/${role}-${mode}-stdout.log" 2>&1 & echo $!;}
          wait_ready(){ local role="$1" mode="$2" pid="$3";for _ in $(seq 1 90);do test -f "/tmp/wp05-core/${role}-${mode}.ready"&&return 0;kill -0 "$pid" 2>/dev/null||{ cat "/tmp/wp05-core/evidence/${role}-${mode}-stdout.log";return 1;};sleep 1;done;return 1;}
          finish_bot(){ local role="$1" mode="$2" pid="$3";for _ in $(seq 1 120);do test -f "/tmp/wp05-core/${role}-${mode}.done"&&break;sleep 1;done;cat "/tmp/wp05-core/${role}-${mode}.done";grep -q '^ok' "/tmp/wp05-core/${role}-${mode}.done";wait "$pid";}
          START="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          start_server /tmp/wp05-core/evidence/server-initial.log
          TARGET_PID="$(run_bot target initial)";wait_ready target initial "$TARGET_PID"
          ADMIN_PID="$(run_bot admin initial)";wait_ready admin initial "$ADMIN_PID"
          echo 'op Wp05JavaAdmin' >&3;echo 'wp05accept source Wp05JavaAdmin sword' >&3;sleep 2
          touch /tmp/wp05-core/target-initial.go /tmp/wp05-core/admin-initial.go
          for _ in $(seq 1 120);do test -f /tmp/wp05-core/admin-initial-ok&&test -f /tmp/wp05-core/target-online-ok&&break;test -f /tmp/wp05-core/admin-initial.done&&grep -q '^fail' /tmp/wp05-core/admin-initial.done&&{ cat /tmp/wp05-core/evidence/admin-initial.log;exit 1;};test -f /tmp/wp05-core/target-initial.done&&grep -q '^fail' /tmp/wp05-core/target-initial.done&&{ cat /tmp/wp05-core/evidence/target-initial.log;exit 1;};sleep 1;done
          grep -qx ok /tmp/wp05-core/admin-initial-ok;grep -qx ok /tmp/wp05-core/target-online-ok
          echo 'wp05accept dump Wp05JavaAdmin' >&3;echo 'wp05accept dump Wp05JavaTarget' >&3;sleep 2
          grep -F 'WP05_ACCEPT DUMP player=Wp05JavaAdmin' /tmp/wp05-core/evidence/server-initial.log;grep -F 'WP05_ACCEPT DUMP player=Wp05JavaTarget' /tmp/wp05-core/evidence/server-initial.log
          grep -F 'maxStack=1' /tmp/wp05-core/evidence/server-initial.log
          touch /tmp/wp05-core/admin-exit /tmp/wp05-core/target-exit;finish_bot admin initial "$ADMIN_PID";finish_bot target initial "$TARGET_PID";sleep 2
          echo 'loreitems give acc_core_live Wp05JavaTarget' >&3;sleep 4;stop_server
          python3 - <<'PY'
          import json,sqlite3
          from pathlib import Path
          c=sqlite3.connect('plugins/EnthusiaLoreItems/loreitems.db');c.row_factory=sqlite3.Row
          e={'definitions':[dict(r) for r in c.execute('select lookup_key,deleted_at from lore_definitions')],'instances':[dict(r) for r in c.execute('select instance_id from lore_instances')],'deliveries':[dict(r) for r in c.execute('select delivery_id,state from direct_deliveries order by created_at,delivery_id')],'integrity':[r[0] for r in c.execute('pragma integrity_check')],'foreign_keys':[list(r) for r in c.execute('pragma foreign_key_check')]};c.close();Path('/tmp/wp05-core/evidence/pre-restart-db.json').write_text(json.dumps(e,indent=2)+'\n')
          assert len(e['definitions'])==1 and e['definitions'][0]['lookup_key']=='acc_core_live' and e['definitions'][0]['deleted_at'] is None
          assert len(e['instances'])==4 and len({x['instance_id'] for x in e['instances']})==4
          assert sorted(x['state'] for x in e['deliveries'])==['COMPLETED','COMPLETED','PENDING'];assert e['integrity']==['ok'] and not e['foreign_keys']
          PY
          start_server /tmp/wp05-core/evidence/server-recovery.log
          TARGET_PID="$(run_bot target recovery)";wait_ready target recovery "$TARGET_PID";touch /tmp/wp05-core/target-recovery.go
          ADMIN_PID="$(run_bot admin recovery)";wait_ready admin recovery "$ADMIN_PID";echo 'op Wp05JavaAdmin' >&3;touch /tmp/wp05-core/admin-recovery.go
          finish_bot target recovery "$TARGET_PID";finish_bot admin recovery "$ADMIN_PID";sleep 2;stop_server
          python3 - <<'PY'
          import json,sqlite3
          from pathlib import Path
          c=sqlite3.connect('plugins/EnthusiaLoreItems/loreitems.db');d=c.execute('select count(*),sum(state="COMPLETED"),sum(state="REVIEW_REQUIRED") from direct_deliveries').fetchone();n=c.execute('select count(*) from lore_instances').fetchone()[0];i=[r[0] for r in c.execute('pragma integrity_check')];f=list(c.execute('pragma foreign_key_check'));c.close();Path('/tmp/wp05-core/evidence/post-recovery-db.json').write_text(json.dumps({'deliveries':list(d),'instances':n,'integrity':i,'foreign_keys':f},indent=2)+'\n');assert tuple(d)==(3,3,0) and n==4 and i==['ok'] and not f
          PY
          start_server /tmp/wp05-core/evidence/server-replay.log
          TARGET_PID="$(run_bot target replay)";wait_ready target replay "$TARGET_PID";touch /tmp/wp05-core/target-replay.go;finish_bot target replay "$TARGET_PID";sleep 2;stop_server
          python3 - <<'PY'
          import sqlite3
          c=sqlite3.connect('plugins/EnthusiaLoreItems/loreitems.db');d=c.execute('select count(*),sum(state="COMPLETED"),sum(state="REVIEW_REQUIRED") from direct_deliveries').fetchone();n=c.execute('select count(*) from lore_instances').fetchone()[0];i=[r[0] for r in c.execute('pragma integrity_check')];f=list(c.execute('pragma foreign_key_check'));c.close();assert tuple(d)==(3,3,0) and n==4 and i==['ok'] and not f
          PY
          END="$(date -u +%Y-%m-%dT%H:%M:%SZ)";sha256sum plugins/EnthusiaLoreItems/loreitems.db plugins/EnthusiaLoreItems/config.yml >/tmp/wp05-core/evidence/final-sha256.txt
          cat >/tmp/wp05-core/evidence/case-metadata.txt <<EOF
          case_ids=ACC-ID-001,ACC-CORE-001,ACC-CORE-002,ACC-CORE-003,ACC-CORE-004
          result=PASS
          authentication_mode=mineflayer-offline-protocol
          microsoft_xbox_authentication_claimed=false
          owner_scope_amendment=2026-08-07
          server=Paper-1.21.11-build-116
          java=21
          plugin_version=1.0.0-rc.1-pr-head
          source_commit=${{ github.event.pull_request.head.sha || github.sha }}
          start_utc=$START
          end_utc=$END
          expected=permission-gated Java command surface; browse GUI; durable create/adopt; distinct online self/target deliveries; cached-offline restart delivery exactly once
          actual=asserted by protocol logs, Java GUI-open event, physical PDC dumps, SQLite checkpoints, restart and replay checks
          cleanup=disposable GitHub Actions environment destroyed after job
          rollback=job fails and disposable environment is discarded
          EOF

      - name: Upload Java identity/core evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wp05-java-core-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 90
          if-no-files-found: error
          path: /tmp/wp05-core/evidence/
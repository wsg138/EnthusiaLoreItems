name: Agent apply display wiring

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: agent-apply-display-wiring-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply reviewed plugin wiring
        shell: bash
        run: |
          echo '' | base64 --decode > /tmp/display-wiring.patch
          git apply /tmp/display-wiring.patch
          rm -f .github/workflows/agent-source-bundle.yml
          rm -f .github/workflows/agent-apply-display-wiring.yml
      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.14.3"
      - name: Verify exact retained tree
        run: gradle --no-daemon clean check
      - name: Commit and push retained wiring
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugin/src/main/java/net/enthusia/loreitems/plugin/LoreItemsPlugin.java .github/workflows
          git commit -m 'wire display observation runtime'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
